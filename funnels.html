function NumbersTab({ doc, projections, comparing, onNumber, onRead, reading }) {
  const byId = new Map(doc.nodes.map((n) => [n.id, n]));
  const order = orderedNodes(doc);
  const cost = trafficCost(doc);
  const capture = order.find((n) => n.type === "capture" && n.number);
  const checkout = order.find((n) => n.type === "checkout" && n.number);
  return html`
    <button class="pill fe-add-row" type="button" id="read-numbers" disabled=${reading} onClick=${onRead}>
      ${reading ? "pensando…" : html`${svg(SPARK_ICON)} ler números`}
    </button>
    <div class="meters mb">
      <div class="meter"><span class="num" id="meter-cost">${cost ? brl(cost) : "—"}</span><span class="legend">custo total de tráfego</span></div>
      <div class="meter"><span class="num" id="meter-cpl">${cost && capture ? brl(Math.round(cost / capture.number)) : "—"}</span><span class="legend">CPL (custo ÷ captura)</span></div>
      <div class="meter"><span class="num" id="meter-cac">${cost && checkout ? brl(Math.round(cost / checkout.number)) : "—"}</span><span class="legend">CAC (custo ÷ checkout)</span></div>
    </div>
    <div class="table-scroll"><table class="table">
      <thead><tr><th>etapa</th><th>tipo</th><th class="num">número</th><th class="num">taxa real · média</th></tr></thead>
      <tbody>${order.map((n) => {
        /* "próximo" aqui é a primeira aresta que sai deste nó — num funil com
           ramos, é uma simplificação; o desenho completo com todas as saídas
           fica no palco. */
        const out = doc.edges.find((a) => a.from === n.id);
        const to = out ? byId.get(out.to) : null;
        let real = "—";
        if (to && n.number != null && n.number > 0 && to.number != null) real = formatRate(to.number / n.number);
        const avg = out && out.avgRate != null ? formatAvg(out.avgRate) : "—";
        const compared = comparedNumber(doc, comparing, n.id);
        const projection = n.number == null ? projections.get(n.id) : null;
        return html`<tr key=${n.id}>
          <td>${n.title || typeLabel(n) || "sem título"}</td>
          <td class="t-mute">${typeLabel(n)}</td>
          <td class="num"><${NumberInput} class="input input--num" min="0" value=${n.number} onValue=${(v) => onNumber(n.id, v)}/>
            ${projection && html`<span class="weak small"> ~${projection.value}</span>`}
            ${compared != null && html`<span class="weak small"> antes ${compared}</span>`}</td>
          <td class="num">${real} <span class="weak small">${avg}</span></td>
        </tr>`;
      })}</tbody>
    </table></div>
    ${doc.snapshots.length > 0 && html`
      <div class="heading mt"><span class="t-mono">retratos</span></div>
      <div class="table-scroll"><table class="table" id="snapshot-table">
        <thead><tr><th>quando</th>${order.map((n) => html`<th key=${n.id}>${truncate(n.title || typeLabel(n), 14)}</th>`)}</tr></thead>
        <tbody>${doc.snapshots.map((s) => html`<tr key=${s.id}>
          <td>${s.label} · ${dateLabel(dayOf(new Date(s.at)), true)}</td>
          ${order.map((n) => html`<td key=${n.id} class="num">${s.numbers[n.id] == null ? "—" : s.numbers[n.id]}</td>`)}
        </tr>`)}</tbody>
      </table></div>`}`;
}

/* miniatura do fluxo: só caixas e linhas, no mesmo lugar em que estão no
   palco, pra reconhecer o funil pela forma antes de ler o nome. */
function Thumbnail({ f }) {
  if (!f.nodes.length) return html`<p class="empty">sem etapas</p>`;
  const xs = f.nodes.map((n) => n.x), ys = f.nodes.map((n) => n.y);
  const minX = Math.min(...xs) - 20, minY = Math.min(...ys) - 20;
  const w = Math.max(...xs) + NODE_W + 20 - minX, h = Math.max(...ys) + NODE_H + 20 - minY;
  const byId = new Map(f.nodes.map((n) => [n.id, n]));
  return html`
    <svg viewBox=${minX + " " + minY + " " + w + " " + h} preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      ${f.edges.map((a) => {
        const from = byId.get(a.from), to = byId.get(a.to);
        if (!from || !to) return null;
        const x1 = from.x + NODE_W, y1 = from.y + PORT_Y, x2 = to.x, y2 = to.y + PORT_Y;
        const dx = Math.max(40, Math.abs(x2 - x1) * 0.5);
        return html`<path key=${a.id} d=${"M" + x1 + " " + y1 + " C" + (x1 + dx) + " " + y1 + " " + (x2 - dx) + " " + y2 + " " + x2 + " " + y2} vector-effect="non-scaling-stroke"/>`;
      })}
      ${f.nodes.map((n) => html`<rect key=${n.id} x=${n.x} y=${n.y} width=${NODE_W} height=${NODE_H} rx="22" class=${typeOf(n).conversion ? "is-conversion" : null} vector-effect="non-scaling-stroke"/>`)}
    </svg>`;
}

function FunnelList({ funnels }) {
  const [form, setForm] = useState(false);
  const list = funnels.all().sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  /* "n" abre um funil novo; no editor a tecla não vale, e a lista nem está montada lá */
  useKeydown((e) => {
    if (e.key !== "n" || e.ctrlKey || e.metaKey || e.altKey || form || isTyping()) return;
    e.preventDefault();
    setForm(true);
  });
  const duplicate = (id) => {
    const original = funnels.get(id);
    if (!original) return;
    const copy = JSON.parse(JSON.stringify(original));
    copy.id = newId();
    copy.name = (original.name || "sem nome") + " (cópia)";
    copy.createdAt = Date.now(); copy.updatedAt = Date.now();
    const ids = new Map();
    copy.nodes.forEach((n) => { const fresh = newId(); ids.set(n.id, fresh); n.id = fresh; });
    copy.edges.forEach((a) => { a.id = newId(); a.from = ids.get(a.from) || a.from; a.to = ids.get(a.to) || a.to; });
    [copy.creatives, copy.automations, copy.offers, copy.triggers].forEach((group) => {
      group.forEach((item) => { item.id = newId(); if (item.node) item.node = ids.get(item.node) || ""; });
    });
    copy.snapshots = [];
    funnels.save(copy);
    notify("funil duplicado");
  };
  const remove = (id) => {
    const before = funnels.remove(id);
    if (!before) return;
    notify("funil apagado", () => funnels.save(before));
  };
  return html`
    <main class="page" id="list">
      <div class="header">
        <div><h1>funis</h1><p class="sub">o caminho que alguém percorre até virar cliente</p></div>
        <div class="actions"><button class="pill pill--green" type="button" id="new-funnel" title="novo funil (n)" onClick=${() => setForm(true)}>${icon("plus")}funil</button></div>
      </div>
      <div class="fl-grid">${list.map((f) => html`<${FunnelCard} key=${f.id} f=${f} onDuplicate=${() => duplicate(f.id)} onRemove=${() => remove(f.id)}/>`)}</div>
      ${!list.length && html`<p class="empty">nenhum funil ainda — o "+" em cima cria o primeiro e já abre.</p>`}
      ${form && html`<${FunnelForm} funnels=${funnels} onClose=${() => setForm(false)}/>`}
    </main>`;
}

/* ================================================================
   a raiz: lista sem hash, editor com hash de um funil que existe
   ================================================================ */
function Funnels() {
  const funnels = useCollection("funnels", { normalize });
  const hash = useHash();
  const open = !!(hash && funnels.has(hash));
  /* o palco é a página: nada rola por baixo dele */
  useEffect(() => {
    document.body.style.overflow = open ? "hidden" : "";
    return () => { document.body.style.overflow = ""; };
  }, [open]);
  return open ? html`<${Editor} key=${hash} id=${hash} funnels=${funnels}/>` : html`<${FunnelList} funnels=${funnels}/>`;
}

mount(html`<${Funnels}/>`, "app");
</script>
</body>
</html>
