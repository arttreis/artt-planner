<style>
/* clients.html — duas colunas (lista + painel) que no celular viram duas
   telas: cada cliente aqui carrega ficha, canais, objetivos, backlog, diário
   e ofertas, e isso não cabe lado a lado numa tela estreita. a troca é feita
   por um atributo no container, não por rota — a pagina inteira e uma so. */
.clients-screen{display:flex;gap:var(--pd);align-items:flex-start}
.list-column{width:300px;flex:0 0 300px;display:flex;flex-direction:column;gap:var(--pd2)}
.panel-column{flex:1 1 auto;min-width:0}

#client-list .line{cursor:pointer}

.back-btn{display:none}
.panel-head{display:flex;align-items:center;gap:var(--pd2);margin-bottom:var(--pd)}
.client-title{flex:1 1 auto;min-width:0}
.client-title h2{margin:0 0 4px;font-size:19px;font-weight:600;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* cabecalho reaproveitado em canal, objetivo e oferta: rotulo + nome editavel + apagar */
.item-head{display:flex;align-items:center;gap:var(--pd2);margin-bottom:var(--pd2);flex-wrap:wrap}
.item-head .input{flex:1 1 160px;min-width:0}
.item-text{flex:1 1 auto;min-width:0}

.editable-line{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.editable-line .input{flex:1 1 120px;min-width:0}

.front-line{display:flex;gap:var(--pd2);align-items:center;padding:7px 0;border-bottom:1px solid var(--line-soft)}
.front-line:last-child{border-bottom:0}
.front-line .input{flex:1 1 auto}
.front-line input[type="number"]{width:64px;flex:0 0 auto}

.journal-text{font-size:13px;color:var(--ink-70)}
.journal-text p{margin:0 0 6px}
.journal-text :last-child{margin-bottom:0}

/* marca de feito reaproveitada em canal, objetivo, passo e backlog: o mesmo
   gesto do resto do sistema — apagado quando falta, verde quando feito. */
.action[data-done="false"]{opacity:.3}
.action[data-done="true"]{color:var(--green-ink)}

.is-finished{opacity:.6}
.channel-funnels{margin-top:var(--pd);padding-top:var(--pd2);border-top:1px solid var(--line-soft)}

/* prazo do backlog: discreto e de largura fixa, para o titulo (que cresce e
   corta com reticencias) nao perder espaco para uma data */
.backlog-due{
  width:150px;flex:0 0 auto;
  font-family:var(--mono);font-size:12px;color:var(--ink-50);
  padding:6px 8px;
}

/* cofre de acessos: uma linha rotulo->valor por campo, igual a uma ficha
   tecnica — e nao um formulario, porque a maior parte do tempo e so leitura */
.vault-line{display:flex;align-items:center;gap:8px;padding:3px 0}
.vault-line .t-mono{flex:0 0 64px}
.vault-value{flex:1 1 auto;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vault-value.mono{font-family:var(--mono);letter-spacing:.04em}

@media (max-width:880px){
  .clients-screen{display:block}
  .list-column,.panel-column{width:100%}
  .clients-screen[data-view="panel"] .list-column{display:none}
  .clients-screen[data-view="list"] .panel-column{display:none}
  .back-btn{display:inline-flex}
}

<main class="page" id="app"></main>
<script type="module">
import {
  initPage, collection, fronts, newId, notify, sendToDay, api,
  dateLabel, dayOf, brl, parseMoney, parseDuration, formatMin
} from "./shared/core.js";
import {
  html, mount, useState, useEffect, useRef, useCollection, useFronts, useHash, useKeydown, isTyping,
  useFields, Form, Field, Dialog, Markdown, FrontBadge, frontOptionList, icon, svg
} from "./shared/ui.js";

initPage("clients");

/* ---------- forma do documento ----------
   valores de enum em ingles no documento; o rotulo em portugues so na tela. */

const STATUSES = ["prospect", "proposal", "active", "paused", "closed"];
const STATUS_LABEL = { prospect: "prospecto", proposal: "proposta", active: "ativo", paused: "pausado", closed: "encerrado" };
const RECURRENCES = ["monthly", "project", "hourly", ""];
const RECURRENCE_LABEL = { monthly: "mensal", project: "projeto", hourly: "hora" };
const OFFER_TYPES = ["product", "service", "subscription", "bump", "upsell"];
const OFFER_LABEL = { product: "produto", service: "serviço", subscription: "assinatura", bump: "bump", upsell: "upsell" };
const JOURNAL_TYPES = ["note", "meeting", "decision", "delivery"];
const JOURNAL_LABEL = { note: "nota", meeting: "reunião", decision: "decisão", delivery: "entrega" };

const CHANNEL_TYPES = ["mercadolivre", "shopee", "tiktokshop", "amazon", "site", "instagram", "google", "whatsapp", "email", "other"];
const CHANNEL_LABEL = {
  mercadolivre: "mercado livre", shopee: "shopee", tiktokshop: "tiktok shop", amazon: "amazon",
  site: "site", instagram: "instagram", google: "google", whatsapp: "whatsapp", email: "e-mail", other: "outro"
};
/* o modelo de cada canal: a estrutura do que precisa existir. entra como
   itens nao feitos ao criar o canal, e dali pra frente e so texto editavel —
   o modelo nao volta a ser consultado. */
const CHANNEL_TEMPLATES = {
  mercadolivre: ["conta e reputação", "catálogo cadastrado", "fotos e fichas técnicas", "frete/Mercado Envios", "Mercado Ads", "promoções/cupons", "atendimento e perguntas", "avaliações", "integração com ERP"],
  shopee: ["conta e loja", "catálogo", "frete grátis/programa", "Shopee Ads", "cupons e lives", "avaliações", "atendimento"],
  tiktokshop: ["conta seller", "catálogo", "afiliados/creators", "vídeos e lives de produto", "TikTok Ads", "logística"],
  amazon: ["conta seller", "catálogo/ASINs", "FBA/frete", "Amazon Ads", "avaliações", "brand registry"],
  site: ["domínio e hospedagem", "loja/CMS", "checkout (Stripe)", "pixel Meta e GA4", "SEO básico", "e-mail transacional", "políticas"],
  instagram: ["bio e destaques", "linha editorial", "criativos", "Meta Ads", "WhatsApp/DM", "loja no Instagram"],
  google: ["Google Business", "Google Ads", "GA4", "Search Console"],
  whatsapp: ["número business", "catálogo", "automação (Manychat/API)", "scripts de atendimento"],
  email: ["ferramenta", "listas/segmentos", "automações", "templates"],
  other: []
};

const TABS = [
  { id: "dashboard", label: "painel" },
  { id: "profile", label: "ficha" },
  { id: "channels", label: "canais" },
  { id: "goals", label: "objetivos" },
  { id: "backlog", label: "backlog" },
  { id: "journal", label: "diário" },
  { id: "offers", label: "ofertas" },
  { id: "vault", label: "cofre" }
];

const listOrEmpty = (v) => (Array.isArray(v) ? v : []);

function normalize(d) {
  const contract = d.contract || {};
  return {
    id: String(d.id),
    name: String(d.name || "").slice(0, 120),
    front: d.front || "",
    status: STATUSES.includes(d.status) ? d.status : "prospect",
    brand: String(d.brand || "").slice(0, 120),
    summary: String(d.summary || ""),
    contacts: listOrEmpty(d.contacts),
    links: listOrEmpty(d.links),
    contract: {
      scope: String(contract.scope || ""),
      value: Math.round(+contract.value) || 0,
      recurrence: RECURRENCES.includes(contract.recurrence) ? contract.recurrence : "",
      start: contract.start || "",
      end: contract.end || "",
      extras: String(contract.extras || "")
    },
    channels: listOrEmpty(d.channels).map((c) => ({ ...c, items: listOrEmpty(c.items) })),
    goals: listOrEmpty(d.goals).map((g) => ({ ...g, steps: listOrEmpty(g.steps) })),
    backlog: listOrEmpty(d.backlog),
    journal: listOrEmpty(d.journal),
    offers: listOrEmpty(d.offers),
    /* so rotulo/usuario/url do acesso ficam aqui em claro; segredo e nota
       vao cifrados (ver "cofre de acessos" mais abaixo). o sal que deriva a
       chave e unico do sistema, guardado em collection("vault").get("config")
       — nao por cliente — entao nao repetimos ele aqui. */
    vault: { items: listOrEmpty(d.vault && d.vault.items) },
    ideaOrigin: d.ideaOrigin || "",
    createdAt: +d.createdAt || Date.now(),
    updatedAt: +d.updatedAt || Date.now()
  };
}

/* icones que nao moram no core por serem exclusivos desta pagina */
const BOLT_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/></svg>';
const COPY_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 00-2-2H6a2 2 0 00-2 2v8a2 2 0 002 2h2"/></svg>';
const EYE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>';

const isNarrow = () => matchMedia("(max-width:880px)").matches;
const journalDate = (at) => dateLabel(dayOf(new Date(at)), true);

/* ---------- a lista ---------- */

const lastContact = (c) => c.journal.reduce((m, e) => Math.max(m, +e.at || 0), c.createdAt);
/* "faz tempo": so vale a pena avisar de quem esta ativo — cliente pausado
   ou encerrado nao precisa de contato, entao nao ganha o traço. */
const isStale = (c) => c.status === "active" && (Date.now() - lastContact(c)) > 14 * 86400000;
function compareClients(a, b) {
  const pa = a.status === "active" ? 0 : 1, pb = b.status === "active" ? 0 : 1;
  return pa - pb || a.name.localeCompare(b.name, "pt-BR");
}
function compareBacklog(a, b) {
  if (a.done !== b.done) return a.done ? 1 : -1;
  if (a.due && b.due) return a.due.localeCompare(b.due) || a.createdAt - b.createdAt;
  if (a.due) return -1;
  if (b.due) return 1;
  return a.createdAt - b.createdAt;
}

/* ---------- cofre de acessos: a criptografia ----------
   segredo e nota de cada item viajam cifrados (AES-GCM 256) com uma chave
   derivada por PBKDF2 da senha-mestra + um sal do sistema. o servidor —
   e qualquer sincronia — so vai ver o campo "encrypted" em base64: sem a
   senha-mestra, e so ruido. rotulo/usuario/url ficam em claro no documento
   porque sao o indice do cofre (para listar sem destrancar nada faria
   sentido, mas aqui a tela inteira pede a senha antes de mostrar qualquer
   coisa — mais simples, e o cliente ja tem poucos acessos). */

function toBase64(bytes) {
  let bin = "";
  bytes.forEach((b) => { bin += String.fromCharCode(b); });
  return btoa(bin);
}
function fromBase64(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

/* deriva a chave e devolve so o CryptoKey, nao extraivel: a senha em texto
   puro nao sobrevive alem desta funcao, e a chave em si nunca vira bytes
   legiveis por outro codigo desta pagina — so o subtle.encrypt/decrypt a
   usam. 300 mil iteracoes e o piso atual do OWASP para PBKDF2-SHA256: lento
   o bastante para encarecer forca bruta, rapido o bastante para nao incomodar
   quem digita a senha certa uma vez por sessao. */
async function deriveKey(password, saltBase64) {
  const material = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: fromBase64(saltBase64), iterations: 300000, hash: "SHA-256" },
    material,
    { name: "AES-GCM", length: 256 },
    false,
    ["encrypt", "decrypt"]
  );
}
async function encryptItem(key, secret, note) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const data = new TextEncoder().encode(JSON.stringify({ secret, note }));
  const encrypted = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, data);
  return { encrypted: toBase64(new Uint8Array(encrypted)), iv: toBase64(iv) };
}
/* AES-GCM autentica o que cifra: com a chave errada isto lanca (nao devolve
   lixo silencioso) — e exatamente o sinal que usamos para dizer "senha não
   bate" em vez de mostrar um segredo qualquer decifrado errado. */
async function decryptItem(key, item) {
  const plain = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: fromBase64(item.iv) }, key, fromBase64(item.encrypted)
  );
  return JSON.parse(new TextDecoder().decode(plain));
}

function copyText(text, msg) {
  if (!text) return;
  navigator.clipboard?.writeText(text).then(() => notify(msg)).catch(() => notify("não consegui copiar"));
}

/* ---------- Merlin: o contexto da reuniao ---------- */

function contractText(c) {
  const parts = [];
  if (c.contract.scope) parts.push(c.contract.scope);
  parts.push(brl(c.contract.value));
  if (c.contract.recurrence) parts.push(RECURRENCE_LABEL[c.contract.recurrence]);
  return parts.join(" — ");
}
function meetingContext(c) {
  const f = c.front && fronts().get(c.front);
  return {
    name: c.name,
    status: STATUS_LABEL[c.status] || c.status,
    front: f ? f.name : "",
    summary: c.summary,
    contract: contractText(c),
    goals: c.goals.map((g) => g.text + " · " + (g.keyResult || "") + " · " + (g.due || "sem prazo") + " · " + (g.done ? "feito" : "aberto")),
    backlog: c.backlog.filter((b) => !b.done).map((b) => b.text + " · " + (b.due || "sem prazo")),
    channels: c.channels.map((ch) => {
      const done = ch.items.filter((i) => i.done).length;
      const missing = ch.items.filter((i) => !i.done).map((i) => i.text);
      return ch.name + " · " + done + " de " + ch.items.length + " feitos · faltam: " + (missing.join(", ") || "nada");
    }),
    journal: c.journal.slice().sort((a, b) => b.at - a.at).slice(0, 15)
      .map((e) => journalDate(e.at) + " · " + (JOURNAL_LABEL[e.type] || e.type) + " · " + e.text),
    offers: c.offers.map((o) => o.name + " · " + brl(o.price))
  };
}

/* ---------- a pagina ----------
   o estado de tela mora aqui: o cliente aberto, a aba, as caixas abertas, a
   chave-mestra do cofre. nada disso e documento — some ao recarregar. */
function Clients() {
  /* clients.html e a dona da colecao "clients". initPage() ja a abriu para
     as outras paginas terem nome/frente/status; passar o normalizador aqui a
     entrega a colecao existente. */
  const clients = useCollection("clients", { normalize });
  /* funis sao de funnels.html: aqui so lemos os de cada canal e criamos um
     vazio a partir dele */
  const funnels = useCollection("funnels");
  /* "config" e o unico doc desta colecao: guarda o sal (16 bytes, base64)
     que deriva a chave-mestra do cofre para o sistema inteiro. nao ha um por
     cliente porque a senha-mestra tambem e uma so — o Arthur digita ela uma
     vez por sessao, nao uma por cliente. */
  const vaultStore = useCollection("vault");
  useFronts();
  const hash = useHash();
  const [selectedId, setSelectedId] = useState(null);
  const [tab, setTab] = useState("dashboard");
  const [newForm, setNewForm] = useState(null);         // { name?, summary?, ideaOrigin? } | null
  const [frontsOpen, setFrontsOpen] = useState(false);
  const [confirming, setConfirming] = useState(false);
  const [meeting, setMeeting] = useState(null);         // texto da pauta | null
  const [thinking, setThinking] = useState(false);
  /* o cofre inteiro do sistema abre com UMA chave (Web Crypto, nao
     extraivel): ela mora só neste estado, nunca em localStorage/colecao, e
     some quando a aba fecha, recarrega ou o Arthur clica "trancar". sem isso
     guardado em lugar nenhum, nao existe "esqueci a senha e recupero depois"
     — perder a senha-mestra perde o cofre. e escolha: e o preco de nem o
     servidor, nem este navegador amanha, conseguirem ler os segredos sem ela. */
  const [masterKey, setMasterKey] = useState(null);
  const [vaultDialog, setVaultDialog] = useState(null); // { error } | null
  /* o id aberto, legivel de dentro de closures velhas (efeito do hash,
     desfazer, atalhos) sem depender do render em que nasceram */
  const selectedRef = useRef(null);
  selectedRef.current = selectedId;

  const doc = selectedId ? clients.get(selectedId) : null;
  const list = clients.all().sort(compareClients);

  /* ---------- abrir / fechar o painel ---------- */

  /* tira o #id da url sem entrar no historico, e avisa o useHash na hora —
     replaceState sozinho nao dispara hashchange */
  const clearHash = () => {
    history.replaceState(null, "", location.pathname + location.search);
    window.dispatchEvent(new HashChangeEvent("hashchange"));
  };
  const openClient = (id) => {
    if (!clients.has(id)) return;
    setSelectedId(id);
    setTab("dashboard");
    if (location.hash.slice(1) !== id) location.hash = id;
  };
  const closePanel = () => { setSelectedId(null); clearHash(); };
  const openNew = (prefill) => setNewForm(prefill || {});
  const closeNew = () => { setNewForm(null); if (!selectedRef.current) clearHash(); };

  /* ---------- rota por hash ----------
     "#<id>" abre o cliente; "#new?idea=<id>" abre a caixa de novo cliente
     ja com o titulo e o corpo da ideia (leitura so: quem normaliza e e dona
     da colecao "ideas" e ideas.html). hash vazio fecha o painel. */
  useEffect(() => {
    if (!hash) { if (selectedRef.current) closePanel(); return; }
    if (hash.startsWith("new")) {
      const q = new URLSearchParams(hash.split("?")[1] || "");
      const ideaId = q.get("idea");
      const idea = ideaId ? collection("ideas").get(ideaId) : null;
      openNew(idea ? { name: String(idea.title || ""), summary: String(idea.body || ""), ideaOrigin: ideaId } : null);
      return;
    }
    if (clients.has(hash)) openClient(hash);
  }, [hash]);

  /* o cliente aberto sumiu (apagado em outra aba ou na nuvem): fecha o painel */
  useEffect(() => { if (selectedId && !clients.has(selectedId)) closePanel(); });

  /* ---------- gravar ----------
     toda edicao passa por aqui: copia o doc vivo, muda, carimba e grava.
     ler de novo da colecao (e nao do render) evita que duas edicoes no mesmo
     tick pisem uma na outra. */
  const update = (mutate) => {
    const current = clients.get(selectedRef.current);
    if (!current) return;
    const d = structuredClone(current);
    mutate(d);
    d.updatedAt = Date.now();
    clients.save(d);
  };
  const updateItem = (listOf, id, mutate) => update((d) => {
    const arr = listOf(d);
    const x = arr && arr.find((i) => i.id === id);
    if (x) mutate(x);
  });
  /* remove um item de um array que vive dentro do doc aberto, sempre com
     desfazer — e a mesma casca para contato, link, canal, item de canal,
     objetivo, passo, item de backlog, oferta e acesso do cofre. o desfazer
     reinsere na mesma posicao, por cima do que mudou desde entao. */
  const removeFrom = (listOf, id, text) => {
    const current = clients.get(selectedRef.current);
    if (!current) return;
    const d = structuredClone(current);
    const arr = listOf(d);
    if (!arr) return;
    const i = arr.findIndex((x) => x.id === id);
    if (i < 0) return;
    const [removed] = arr.splice(i, 1);
    d.updatedAt = Date.now();
    clients.save(d);
    notify(text, () => {
      const now = clients.get(d.id);
      if (!now) return;
      const back = structuredClone(now);
      const arr2 = listOf(back);
      if (!arr2) return;
      arr2.splice(Math.min(i, arr2.length), 0, removed);
      back.updatedAt = Date.now();
      clients.save(back);
    });
  };
  const ctx = { update, updateItem, removeFrom, funnels, setTab };

  /* ---------- criar e apagar ---------- */

  const createClient = ({ name, front, status, summary, ideaOrigin }) => {
    const now = Date.now();
    const created = normalize({ id: newId(), name, front, status, summary: summary || "", ideaOrigin: ideaOrigin || "", createdAt: now, updatedAt: now });
    clients.save(created);
    setNewForm(null);
    openClient(created.id);
    /* a caixa ja fechou aqui; devolver false impede o Form de chamar o
       closeNew, que limparia o hash que acabamos de escrever */
    return false;
  };
  const deleteClient = () => {
    if (!doc) return;
    const id = doc.id, name = doc.name;
    const before = clients.remove(id);
    setConfirming(false);
    closePanel();
    notify('cliente "' + name + '" apagado', () => { clients.save(before); openClient(id); });
  };

  /* ---------- Merlin: preparar reuniao ---------- */

  const askMeeting = async () => {
    if (!doc || thinking) return;
    setThinking(true);
    try {
      const r = await api("/merlin", { method: "POST", body: JSON.stringify({ task: "meeting", context: meetingContext(doc) }) });
      if (r.ok) setMeeting(r.body.text || "");
      else if (r.status === 401) notify("entre para usar o Merlin");
      else notify(r.body.error || "o Merlin não respondeu — tenta de novo daqui a pouco");
    } catch (e) {
      notify("não consegui falar com o Merlin");
    } finally { setThinking(false); }
  };
  /* nao entra sozinha porque isto e uma sugestao de pauta, nao um fato — o
     diario e o registro do que realmente aconteceu na reuniao (append only,
     de proposito). guardar e um gesto do Arthur depois de ler e concordar com
     o que o Merlin escreveu, nunca automatico. */
  const keepMeeting = () => {
    if (!doc) return;
    const text = meeting;
    update((d) => { d.journal.push({ id: newId(), at: Date.now(), type: "meeting", text }); });
    setMeeting(null);
    notify("pauta guardada no diário");
  };

  /* ---------- cofre: a chave ---------- */

  const openVaultDialog = (error) => setVaultDialog({ error: error || "" });
  const lockVault = () => setMasterKey(null);
  const unlockVault = async (password) => {
    let config = vaultStore.get("config");
    if (!config) {
      config = { id: "config", salt: toBase64(crypto.getRandomValues(new Uint8Array(16))) };
      vaultStore.save(config);
    }
    const key = await deriveKey(password, config.salt);
    setMasterKey(key);
    setVaultDialog(null);
  };
  const vault = { key: masterKey, open: openVaultDialog, lock: lockVault };

  /* ---------- atalhos: n abre um cliente novo, / vai para a busca ----------
     Esc e dos dialogos, que se fecham sozinhos; fora deles, no celular, Esc
     volta do painel para a lista. */
  useKeydown((e) => {
    if (e.key === "Escape") { if (selectedRef.current && isNarrow()) closePanel(); return; }
    if (isTyping()) return;
    if (e.key === "/") {
      e.preventDefault();
      const s = document.getElementById("sb-search");
      if (s) { s.focus(); s.select(); }
      return;
    }
    if (e.key === "n" || e.key === "N") { e.preventDefault(); openNew(); }
  });

  return html`
    <div class="header">
      <div>
        <h1>clientes</h1>
        <p class="sub">ficha, contrato, canais, objetivos, backlog e diário de cada cliente</p>
      </div>
      <div class="actions">
        <button class="pill" type="button" id="fronts-btn" onClick=${() => setFrontsOpen(true)}>frentes</button>
        <button class="pill pill--green" type="button" id="new-client-btn" onClick=${() => openNew()}>novo cliente</button>
      </div>
    </div>

    <div class="clients-screen" id="screen" data-view=${selectedId ? "panel" : "list"}>
      <section class="list-column">
        ${list.length
          ? html`<ul class="list" id="client-list">
              ${list.map((c) => html`<${ClientRow} key=${c.id} c=${c} active=${c.id === selectedId} onOpen=${() => openClient(c.id)}/>`)}
            </ul>`
          : html`<p class="empty" id="list-empty">nenhum cliente por aqui ainda — crie o primeiro</p>`}
      </section>

      <section class="panel-column">
        ${doc
          ? html`<${Panel} key=${doc.id} doc=${doc} tab=${tab} ctx=${ctx} vault=${vault} thinking=${thinking}
              onBack=${closePanel} onDelete=${() => setConfirming(true)} onMeeting=${askMeeting}/>`
          : html`<div class="block" id="panel-empty"><p class="empty">escolha um cliente na lista, ou crie um novo</p></div>`}
      </section>
    </div>

    ${newForm && html`<${ClientForm} prefill=${newForm} onCreate=${createClient} onClose=${closeNew}/>`}
    ${frontsOpen && html`<${FrontsDialog} onClose=${() => setFrontsOpen(false)}/>`}
    ${confirming && doc && html`
      <${Dialog} title="apagar cliente?" label="Confirmar" onClose=${() => setConfirming(false)}
          sub=${'isso apaga "' + doc.name + '" e tudo que está nele — dá para desfazer logo em seguida.'}
          actions=${html`<button class="pill" type="button" onClick=${() => setConfirming(false)}>cancelar</button><button class="pill pill--green" type="button" id="confirm-delete-btn" onClick=${deleteClient}>apagar</button>`}/>`}
    ${meeting != null && html`<${MeetingDialog} text=${meeting} onClose=${() => setMeeting(null)} onKeep=${keepMeeting}/>`}
    ${vaultDialog && html`<${VaultPasswordForm} isNew=${!vaultStore.get("config")} error=${vaultDialog.error} onUnlock=${unlockVault} onClose=${() => setVaultDialog(null)}/>`}`;
}

/* ---------- um cliente na lista ----------
   sem filtro: a lista e curta (ativos primeiro, em ordem alfabetica) e a
   busca global da sidebar acha qualquer cliente pelo nome */
function ClientRow({ c, active, onOpen }) {
  return html`
    <li class=${"line" + (active ? " is-active" : "")} data-id=${c.id} tabindex="0" role="button"
        onClick=${onOpen} onKeyDown=${(e) => { if (e.key === "Enter") onOpen(); }}>
      <span class="name">${c.name}${isStale(c) && html` <span class="weak" title="mais de 14 dias sem entrada no diário">— faz tempo</span>`}</span>
      <${FrontBadge} id=${c.front}/>
      <${StatusBadge} status=${c.status}/>
    </li>`;
}

const StatusBadge = ({ status }) => html`<span class=${"badge" + (status === "active" ? " badge--green" : "")}>${STATUS_LABEL[status] || status}</span>`;

/* a barra de cima de cada aba: o rotulo e o "+" que abre a caixa de criar —
   nenhum formulario fica aberto no meio da lista */
const TabBar = ({ label, button, id, onAdd }) => html`
  <p class="heading mb2"><span class="t-mono">${label}</span><button class="pill pill--mini" type="button" id=${id} onClick=${onAdd}>${icon("plus")}${button}</button></p>`;

/* ---------- o painel do cliente ---------- */
function Panel({ doc, tab, ctx, vault, thinking, onBack, onDelete, onMeeting }) {
  const content =
    tab === "profile" ? html`<${Profile} doc=${doc} ctx=${ctx}/>` :
    tab === "channels" ? html`<${Channels} doc=${doc} ctx=${ctx}/>` :
    tab === "goals" ? html`<${Goals} doc=${doc} ctx=${ctx}/>` :
    tab === "backlog" ? html`<${Backlog} doc=${doc} ctx=${ctx}/>` :
    tab === "journal" ? html`<${Journal} doc=${doc} ctx=${ctx}/>` :
    tab === "offers" ? html`<${Offers} doc=${doc} ctx=${ctx}/>` :
    tab === "vault" ? html`<${Vault} doc=${doc} ctx=${ctx} masterKey=${vault.key} openDialog=${vault.open} lock=${vault.lock}/>` :
    html`<${Dashboard} doc=${doc} setTab=${ctx.setTab}/>`;
  return html`
    <div id="client-panel">
      <div class="panel-head">
        <button class="pill back-btn" type="button" id="back-btn" onClick=${onBack}>‹ clientes</button>
        <div class="client-title">
          <h2 id="panel-name">${doc.name || "(sem nome)"}</h2>
          <div class="row" id="panel-badges"><${FrontBadge} id=${doc.front}/><${StatusBadge} status=${doc.status}/></div>
        </div>
        <button class="pill" type="button" id="meeting-btn" disabled=${thinking} onClick=${onMeeting}
            title="pedir ao Merlin uma pauta a partir da ficha, canais, objetivos e diário">
          ${thinking ? "pensando…" : html`${svg(BOLT_ICON)} preparar reunião`}
        </button>
        <button class="action" type="button" id="delete-client-btn" title="apagar cliente" aria-label="Apagar cliente" onClick=${onDelete}>${icon("trash")}</button>
      </div>
      <div class="tabs" id="tabs" role="tablist">
        ${TABS.map((t) => html`<button key=${t.id} class="tab" type="button" role="tab" data-tab=${t.id} aria-selected=${tab === t.id} onClick=${() => ctx.setTab(t.id)}>${t.label}</button>`)}
      </div>
      <div id="tab-content" role="tabpanel">${content}</div>
    </div>`;
}

/* ---------- aba: painel (resumo) ---------- */
function Dashboard({ doc, setTab }) {
  const goalsDue = doc.goals.filter((g) => !g.done && g.due).sort((a, b) => a.due.localeCompare(b.due));
  const backlogDue = doc.backlog.filter((b) => !b.done && b.due).sort((a, b) => a.due.localeCompare(b.due)).slice(0, 6);
  const incomplete = doc.channels.filter((c) => c.items.some((i) => !i.done));
  const last = doc.journal.slice().sort((a, b) => b.at - a.at)[0];
  return html`
    <div class="grid">
      <div class="col-6 block">
        <p class="heading"><span class="t-mono">objetivos com prazo</span></p>
        ${goalsDue.length
          ? html`<ul class="list">${goalsDue.map((g) => html`<li key=${g.id} class="line"><span class="name">${g.text}</span><span class="measure">${dateLabel(g.due)}</span></li>`)}</ul>`
          : html`<p class="empty">nenhum objetivo com prazo em aberto</p>`}
      </div>
      <div class="col-6 block">
        <p class="heading"><span class="t-mono">próximos prazos do backlog</span></p>
        ${backlogDue.length
          ? html`<ul class="list">${backlogDue.map((b) => html`<li key=${b.id} class="line"><span class="name">${b.text}</span><span class="measure">${dateLabel(b.due)}</span></li>`)}</ul>`
          : html`<p class="empty">nada no backlog com prazo</p>`}
      </div>
      <div class="col-6 block">
        <p class="heading"><span class="t-mono">canais incompletos</span></p>
        ${incomplete.length
          ? html`<ul class="list">${incomplete.map((c) => {
              const done = c.items.filter((i) => i.done).length;
              return html`<li key=${c.id} class="line">
                <span class="name">${c.name}</span>
                <span class="bar" style="width:60px"><i style=${"width:" + Math.round((done / c.items.length) * 100) + "%"}></i></span>
                <span class="measure">${done} de ${c.items.length}</span>
              </li>`;
            })}</ul>`
          : html`<p class="empty">todos os canais completos, ou nenhum canal ainda</p>`}
      </div>
      <div class="col-6 block">
        <p class="heading"><span class="t-mono">contrato</span></p>
        <div class="meter"><span class="num">${brl(doc.contract.value)}</span><span class="legend">${RECURRENCE_LABEL[doc.contract.recurrence] || "sem recorrência definida"}</span></div>
        <p class="small weak mt2">último contato: ${last ? journalDate(last.at) + " · " + (JOURNAL_LABEL[last.type] || last.type) : "nenhum registro no diário"}</p>
      </div>
    </div>
    <div class="row mt">
      <button class="pill" type="button" onClick=${() => setTab("backlog")}>+ item no backlog</button>
      <button class="pill" type="button" onClick=${() => setTab("journal")}>+ nota no diário</button>
      <button class="pill" type="button" onClick=${() => setTab("channels")}>ver canais</button>
    </div>`;
}

/* ---------- campo de dinheiro ----------
   mostra o valor formatado, mas guarda o que esta sendo digitado em estado
   proprio: reformatar a cada tecla brigaria com o cursor. quando o valor
   muda por fora (sincronia), o texto acompanha. */
function MoneyInput({ value, onChange, ...rest }) {
  const format = (v) => brl(v).replace("R$ ", "");
  const [text, setText] = useState(() => format(value));
  useEffect(() => { if (parseMoney(text) !== value) setText(format(value)); }, [value]);
  return html`<input class="input input--num" ...${rest} value=${text}
    onInput=${(e) => { setText(e.currentTarget.value); onChange(parseMoney(e.currentTarget.value)); }}/>`;
}

/* ---------- "novo item" no fim de uma lista: Enter ou o botao acrescentam ---------- */
function NewItemRow({ placeholder, button, top, onAdd }) {
  const [text, setText] = useState("");
  const add = () => {
    const t = text.trim();
    if (!t) return;
    onAdd(t);
    setText("");
  };
  return html`
    <div class=${"form-row" + (top ? " mt2" : "")}>
      <input class="input" placeholder=${placeholder} value=${text} onInput=${(e) => setText(e.currentTarget.value)}
        onKeyDown=${(e) => { if (e.key === "Enter") { e.preventDefault(); add(); } }}/>
      <button class="pill pill--mini" type="button" onClick=${add}>${button}</button>
    </div>`;
}

/* ---------- aba: canais ---------- */
function Channels({ doc, ctx }) {
  const [form, setForm] = useState(false);
  return html`
    <${TabBar} label="canais" button="canal" id="add-channel" onAdd=${() => setForm(true)}/>
    <div class="column" id="channel-list">
      ${doc.channels.length
        ? doc.channels.map((ch) => html`<${Channel} key=${ch.id} doc=${doc} ch=${ch} ctx=${ctx}/>`)
        : html`<p class="empty">nenhum canal cadastrado ainda</p>`}
    </div>
    ${form && html`<${ChannelForm} onClose=${() => setForm(false)} onAdd=${(channel) => ctx.update((d) => { d.channels.push(channel); })}/>`}`;
}

function ChannelForm({ onClose, onAdd }) {
  const [v, bind] = useFields({ type: CHANNEL_TYPES[0], name: "" });
  const submit = () => {
    onAdd({
      id: newId(), type: v.type, name: v.name.trim() || CHANNEL_LABEL[v.type], url: "", note: "",
      items: (CHANNEL_TEMPLATES[v.type] || []).map((text) => ({ id: newId(), text, done: false }))
    });
  };
  return html`
    <${Form} title="novo canal" sub="o canal já nasce com o checklist do tipo" submit="adicionar" onSubmit=${submit} onClose=${onClose}>
      <${Field} label="tipo"><select class="select" ...${bind("type")}>${CHANNEL_TYPES.map((t) => html`<option key=${t} value=${t}>${CHANNEL_LABEL[t]}</option>`)}</select><//>
      <${Field} label="nome (opcional)"><input class="input" maxlength="80" ...${bind("name")}/><//>
    <//>`;
}

function Channel({ doc, ch, ctx }) {
  const { update, updateItem, removeFrom, funnels } = ctx;
  const done = ch.items.filter((i) => i.done).length;
  const pct = ch.items.length ? Math.round((done / ch.items.length) * 100) : 0;
  const channelFunnels = funnels.all().filter((f) => f.client === doc.id && f.channel === ch.id);
  const channelsOf = (d) => d.channels;
  const itemsOf = (d) => { const c = d.channels.find((x) => x.id === ch.id); return c ? c.items : null; };
  const newFunnel = () => {
    const now = Date.now();
    const f = {
      id: newId(), name: doc.name + " · " + ch.name, client: doc.id, channel: ch.id, front: doc.front,
      nodes: [], edges: [], creatives: [], automations: [], offers: [], triggers: [], snapshots: [],
      createdAt: now, updatedAt: now
    };
    funnels.save(f);
    location.href = "funnels.html#" + f.id;
  };
  return html`
    <div class="channel block block--flat" data-id=${ch.id}>
      <div class="item-head">
        <span class="badge">${CHANNEL_LABEL[ch.type] || ch.type}</span>
        <input class="input input--pill" value=${ch.name} onInput=${(e) => updateItem(channelsOf, ch.id, (x) => { x.name = e.currentTarget.value; })}/>
        <button class="action" type="button" aria-label="Remover canal" onClick=${() => removeFrom(channelsOf, ch.id, "canal removido")}>${icon("trash")}</button>
      </div>
      ${ch.items.length ? html`
        <div class="bar"><i style=${"width:" + pct + "%"}></i></div>
        <p class="small weak mt2">${done} de ${ch.items.length}</p>
        <ul class="list mt2">
          ${ch.items.map((i) => html`
            <li key=${i.id} class=${"line" + (i.done ? " is-done" : "")} data-item=${i.id}>
              <button class="action mark" type="button" data-done=${i.done} aria-label="Marcar feito" onClick=${() => updateItem(itemsOf, i.id, (x) => { x.done = !x.done; })}>${icon("check")}</button>
              <input class="input item-text" value=${i.text} onInput=${(e) => updateItem(itemsOf, i.id, (x) => { x.text = e.currentTarget.value; })}/>
              <button class="action" type="button" aria-label="Remover item" onClick=${() => removeFrom(itemsOf, i.id, "item removido")}>${icon("x")}</button>
            </li>`)}
        </ul>
        <${NewItemRow} placeholder="novo item" button="+ item" top onAdd=${(text) => update((d) => { const arr = itemsOf(d); if (arr) arr.push({ id: newId(), text, done: false }); })}/>`
        : html`<p class="empty">canal sem checklist — use a nota para anotar o que precisar</p>`}
      <label class="field-label mt2">nota</label>
      <textarea class="textarea" value=${ch.note} onInput=${(e) => updateItem(channelsOf, ch.id, (x) => { x.note = e.currentTarget.value; })}/>
      <div class="channel-funnels">
        <p class="heading"><span class="t-mono">funis</span><button class="pill pill--mini" type="button" onClick=${newFunnel}>novo funil</button></p>
        ${channelFunnels.length
          ? html`<ul class="list">${channelFunnels.map((f) => html`<li key=${f.id} class="line"><a class="link name" href=${"funnels.html#" + f.id}>${f.name}</a></li>`)}</ul>`
          : html`<p class="empty">nenhum funil ligado a este canal</p>`}
      </div>
    </div>`;
}

/* ---------- aba: objetivos ---------- */
function Goals({ doc, ctx }) {
  const [form, setForm] = useState(false);
  const sorted = doc.goals.slice().sort((a, b) => (a.done - b.done) || (a.due || "9999").localeCompare(b.due || "9999"));
  return html`
    <${TabBar} label="objetivos" button="objetivo" id="add-goal" onAdd=${() => setForm(true)}/>
    <div class="column" id="goal-list">
      ${sorted.length
        ? sorted.map((g) => html`<${Goal} key=${g.id} g=${g} ctx=${ctx}/>`)
        : html`<p class="empty">nenhum objetivo ainda</p>`}
    </div>
    ${form && html`<${GoalForm} onClose=${() => setForm(false)} onAdd=${(goal) => ctx.update((d) => { d.goals.push(goal); })}/>`}`;
}

function GoalForm({ onClose, onAdd }) {
  const [v, bind] = useFields({ text: "", keyResult: "", due: "" });
  const submit = () => {
    const text = v.text.trim();
    if (!text) { notify("o objetivo precisa de um título"); return false; }
    onAdd({ id: newId(), text, keyResult: v.keyResult.trim(), due: v.due || "", done: false, steps: [] });
  };
  return html`
    <${Form} title="novo objetivo" submit="adicionar" onSubmit=${submit} onClose=${onClose}>
      <${Field} label="título" full><input class="input" required maxlength="140" ...${bind("text")}/><//>
      <${Field} label="resultado-chave"><input class="input" maxlength="140" ...${bind("keyResult")}/><//>
      <${Field} label="prazo"><input class="input" type="date" ...${bind("due")}/><//>
    <//>`;
}

function Goal({ g, ctx }) {
  const { update, updateItem, removeFrom } = ctx;
  const goalsOf = (d) => d.goals;
  const stepsOf = (d) => { const x = d.goals.find((y) => y.id === g.id); return x ? x.steps : null; };
  const done = g.steps.filter((p) => p.done).length;
  return html`
    <div class=${"block block--flat" + (g.done ? " is-finished" : "")} data-id=${g.id}>
      <div class="item-head">
        <button class="action mark" type="button" data-done=${g.done} aria-label="Marcar feito" onClick=${() => updateItem(goalsOf, g.id, (x) => { x.done = !x.done; })}>${icon("check")}</button>
        <input class="input" placeholder="título" value=${g.text} onInput=${(e) => updateItem(goalsOf, g.id, (x) => { x.text = e.currentTarget.value; })}/>
        ${g.due && html`<span class="badge">${dateLabel(g.due)}</span>`}
        <button class="action" type="button" aria-label="Remover objetivo" onClick=${() => removeFrom(goalsOf, g.id, "objetivo removido")}>${icon("trash")}</button>
      </div>
      <div class="form-row">
        <input class="input" placeholder="resultado-chave" value=${g.keyResult} onInput=${(e) => updateItem(goalsOf, g.id, (x) => { x.keyResult = e.currentTarget.value; })}/>
        <input class="input" type="date" value=${g.due} onChange=${(e) => updateItem(goalsOf, g.id, (x) => { x.due = e.currentTarget.value; })}/>
      </div>
      <p class="heading mt2"><span class="t-mono">passos</span><span class="small weak">${done} de ${g.steps.length}</span></p>
      <ul class="list">
        ${g.steps.map((p) => html`
          <li key=${p.id} class=${"line" + (p.done ? " is-done" : "")} data-step=${p.id}>
            <button class="action mark" type="button" data-done=${p.done} aria-label="Marcar feito" onClick=${() => updateItem(stepsOf, p.id, (x) => { x.done = !x.done; })}>${icon("check")}</button>
            <input class="input item-text" value=${p.text} onInput=${(e) => updateItem(stepsOf, p.id, (x) => { x.text = e.currentTarget.value; })}/>
            <button class="action" type="button" aria-label="Remover passo" onClick=${() => removeFrom(stepsOf, p.id, "passo removido")}>${icon("x")}</button>
          </li>`)}
      </ul>
      <${NewItemRow} placeholder="novo passo" button="+ passo" onAdd=${(text) => update((d) => { const arr = stepsOf(d); if (arr) arr.push({ id: newId(), text, done: false }); })}/>
    </div>`;
}

function Backlog({ doc, ctx }) {
  const [form, setForm] = useState(false);
  const { updateItem, removeFrom } = ctx;
  const backlogOf = (d) => d.backlog;
  const items = doc.backlog.slice().sort(compareBacklog);
  const pull = (b) => sendToDay({ title: b.text, min: b.min, front: doc.front, client: doc.id, origin: { type: "client", id: doc.id } });
  return html`
    <${TabBar} label="backlog" button="tarefa" id="add-backlog" onAdd=${() => setForm(true)}/>
    ${items.length
      ? html`<ul class="list" id="backlog-list">
          ${items.map((b) => html`
            <li key=${b.id} class=${"line" + (b.done ? " is-done" : "")} data-id=${b.id}>
              <button class="action mark" type="button" data-done=${b.done} aria-label="Marcar feito" onClick=${() => updateItem(backlogOf, b.id, (x) => { x.done = !x.done; })}>${icon("check")}</button>
              <span class="name">${b.text}</span>
              ${b.min > 0 && html`<span class="measure">${formatMin(b.min)}</span>`}
              <input class="input backlog-due" type="date" title="prazo" value=${b.due} onChange=${(e) => updateItem(backlogOf, b.id, (x) => { x.due = e.currentTarget.value; })}/>
              <div class="row-actions">
                <button class="action" type="button" aria-label="Puxar para o dia" onClick=${() => pull(b)}>${icon("arrow")}</button>
                <button class="action" type="button" aria-label="Remover" onClick=${() => removeFrom(backlogOf, b.id, "item removido do backlog")}>${icon("trash")}</button>
              </div>

    ${form && html`<${BacklogForm} onClose=${() => setForm(false)} onAdd=${(item) => ctx.update((d) => { d.backlog.push(item); })}/>`}`;
}

/* ---------- aba: cofre ----------
   sem chave, a aba mostra o cadeado e ja pede a senha. com chave, decifra
   todos os itens de uma vez (e a mesma chave em todo item: falhou para um,
   falha para todos — esquece a chave e volta a pedir a senha em vez de
   mostrar qualquer coisa pela metade). */
function Vault({ doc, ctx, masterKey, openDialog, lock }) {
  const items = doc.vault.items;
  const itemsKey = JSON.stringify(items);
  const [plain, setPlain] = useState(null);       // id -> {secret, note} ja decifrados, so em memoria
  const [editingId, setEditingId] = useState(null);
  const [formGen, setFormGen] = useState(0);      // troca a key do formulario para ele nascer vazio de novo
  const itemsOf = (d) => d.vault.items;

  /* entrar na aba sem chave pede a senha na hora */
  useEffect(() => { if (!masterKey) openDialog(); }, []);

  /* decifrar e assincrono; o Arthur pode trocar de aba ou de cliente no
     meio do caminho — o `cancelled` larga o resultado de quem ja saiu */
  useEffect(() => {
    if (!masterKey) { setPlain(null); return; }
    let cancelled = false;
    Promise.all(items.map(async (item) => [item.id, await decryptItem(masterKey, item)]))
      .then((pairs) => { if (!cancelled) setPlain(Object.fromEntries(pairs)); })
      .catch(() => { if (!cancelled) { lock(); openDialog("senha não bate"); } });
    return () => { cancelled = true; };
  }, [masterKey, itemsKey]);

  if (!masterKey) return html`
    <div class="block" id="vault-locked">
      <p class="empty">cofre trancado — entre com a senha-mestra para ver os acessos deste cliente.</p>
      <button class="pill pill--green" type="button" id="unlock-vault-btn" onClick=${() => openDialog()}>destrancar</button>
    </div>`;
  if (!plain) return null;

  const editing = editingId ? items.find((x) => x.id === editingId) : null;
  const saveItem = async (v) => {
    const label = v.label.trim();
    if (!label) return;
    const { encrypted, iv } = await encryptItem(masterKey, v.secret, v.note);
    const patch = { label, user: v.user.trim(), url: v.url.trim(), encrypted, iv };
    if (editing) ctx.updateItem(itemsOf, editing.id, (x) => { Object.assign(x, patch); });
    else ctx.update((d) => { d.vault.items.push({ id: newId(), ...patch }); });
    setEditingId(null);
    setFormGen((n) => n + 1);
  };
  return html`
    <div class="block mb">
      <p class="heading"><span class="t-mono">cofre de acessos</span><button class="pill pill--mini" type="button" id="lock-vault-btn" onClick=${() => { lock(); openDialog(); }}>trancar</button></p>
      <p class="small weak">cifrado neste navegador (AES-GCM); a senha-mestra nunca é gravada, e o servidor só guarda o texto cifrado.</p>
    </div>
    <${VaultForm} key=${editing ? editing.id : "new-" + formGen} item=${editing} plain=${editing ? plain[editing.id] : null} onSave=${saveItem} onCancel=${() => setEditingId(null)}/>
    <div class="column" id="vault-list">
      ${items.length
        ? items.map((item) => html`<${VaultItem} key=${item.id + ":" + item.iv} item=${item} plain=${plain[item.id] || {}}
            onEdit=${() => setEditingId(item.id)} onRemove=${() => ctx.removeFrom(itemsOf, item.id, "acesso apagado")}/>`)
        : html`<p class="empty">nenhum acesso guardado ainda</p>`}
    </div>`;
}

function VaultForm({ item, plain, onSave, onCancel }) {
  const [v, bind] = useFields({
    label: item ? item.label : "", user: item ? item.user : "", secret: plain ? plain.secret : "",
    url: item ? item.url : "", note: plain ? plain.note : ""

  return html`
    <div class="block mb" id="vault-form">
      <p class="heading"><span class="t-mono">${item ? "editar acesso" : "novo acesso"}</span></p>
      <div class="form-grid">
        <input class="input" id="vault-label" placeholder="rótulo (ex.: painel Shopify)" ...${bind("label")}/>
        <input class="input" id="vault-user" placeholder="usuário" ...${bind("user")}/>
        <input class="input mono" id="vault-secret" placeholder="senha / segredo" ...${bind("secret")}/>
        <input class="input" id="vault-url" placeholder="url (opcional)" ...${bind("url")}/>
      </div>
      <textarea class="textarea mt2" id="vault-note" placeholder="nota (opcional)" ...${bind("note")}/>
      <div class="row mt2">

      </div>

}

function VaultItem({ item, plain, onEdit, onRemove }) {

  return html`

      </div>

      <div class="vault-line">

        <button class="action" type="button" aria-label="Mostrar senha" onClick=${() => setShown((s) => !s)}>${svg(EYE_ICON)}</button>
        <button class="action" type="button" aria-label="Copiar senha" onClick=${() => copyText(plain.secret, "senha copiada")}>${svg(COPY_ICON)}</button>

      ${item.url && html`<div class="vault-line"><span class="t-mono weak">link</span><a class="link vault-value" href=${item.url} target="_blank" rel="noopener">${item.url}</a></div>`}
      ${plain.note && html`<p class="small weak mt2">${plain.note}</p>`}
    </div>`;
}

/* a senha-mestra: criar (primeira vez no sistema) ou destrancar */
function VaultPasswordForm({ isNew, error, onUnlock, onClose }) {
  const [v, bind] = useFields({ password: "" });

  const submit = () => { if (v.password) onUnlock(v.password); return false; };
  return html`

        sub=${isNew
          ? "essa senha cifra os acessos guardados aqui, só neste navegador — nem o Merlin, nem o servidor a conhecem."
          : "a mesma senha de sempre, pedida de novo porque a aba recarregou ou o cofre foi trancado."}>
      <${Field} label="senha-mestra" full><input class="input" id="vault-password" type="password" autocomplete="current-password" placeholder="só fica na memória desta aba" ...${bind("password")}/><//>
      <p class="small weak full">sem recuperação: se esquecer a senha-mestra, o cofre é perdido.</p>
      ${error && html`<p class="small full" id="vault-error">${error}</p>`}
    <//>`;
}

/* ---------- caixa: frentes (o cadastro mora aqui) ---------- */
function FrontsDialog({ onClose }) {
  const list = useFronts();
  const store = fronts();
  const saveFront = (f, patch) => store.save({ ...f, ...patch });
  const add = () => {
    const used = list.map((f) => f.color);
    const color = [1, 2, 3, 4, 5, 6].find((c) => !used.includes(c)) || 1;
    const maxOrder = list.reduce((m, f) => Math.max(m, f.order), 0);
    store.save({ id: newId(), name: "nova frente", color, order: maxOrder + 1 });
  };
  const remove = (id) => {
    if (list.length <= 1) { notify("precisa sobrar ao menos uma frente"); return; }
    const before = store.remove(id);
    notify("frente apagada", () => store.save(before));
  };
  return html`
    <${Dialog} title="frentes" label="Frentes" sub="o cadastro das empresas — cliente, tarefa, ideia e funil apontam para uma frente" onClose=${onClose}>
      <div id="front-list">
        ${list.map((f) => html`
          <div key=${f.id} class="front-line" data-id=${f.id}>
            <input class="input" value=${f.name} onInput=${(e) => saveFront(f, { name: e.currentTarget.value })}/>
            <select class="select input--mono" value=${f.color} onChange=${(e) => saveFront(f, { color: +e.currentTarget.value })}>
              ${[1, 2, 3, 4, 5, 6].map((n) => html`<option key=${n} value=${n}>${n}</option>`)}
            </select>
            <span class="badge" data-color=${f.color}>amostra</span>
            <input class="input" type="number" value=${f.order} onChange=${(e) => saveFront(f, { order: +e.currentTarget.value })}/>
            <button class="action" type="button" aria-label="Apagar frente" onClick=${() => remove(f.id)}>${icon("trash")}</button>
          </div>`)}
      </div>
      <button class="pill mt" type="button" id="add-front" onClick=${add}>+ nova frente</button>
    <//>`;
}
