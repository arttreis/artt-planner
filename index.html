<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0d0d0d">
<title>artt · planner</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 472.5 472.5' fill='%232EE86B'><path d='M236.31,236.23c-3.63,128.42,107.71,238.95,236.22,236.22v-118.11c-64.78,2.88-121-53.42-118.11-118.11h-118.11Z'/><path d='M236.22,0C239.85,128.42,128.52,238.95,0,236.22v-118.11C64.78,120.99,121,64.69,118.11,0h118.11Z'/><path d='M315.07,0h77.61c44.09,0,79.89,35.8,79.89,79.89v77.61h-157.5V0h0Z'/><path d='M79.96,315H.07v78.75h78.75v78.75h78.75v-79.89c0-42.86-34.75-77.61-77.61-77.61Z'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ---------------------------------------------------------------
   design system arttreis.com.br — lado escuro dos tokens.
   copiado do :root do site; a unica adicao e --br3 (12px), um passo
   intermediario entre --br2 e --br para os ladrilhos de 44px.
   --------------------------------------------------------------- */
:root{
  --pd:16px; --pd2:8px; --pd3:4px;
  --br:16px; --br2:8px; --br3:12px; --br-pill:100px;

  --bg:#0d0d0d;
  --surface:#141414;
  --surface-2:#1b1b1b;

  --ink:#f2f2f2;
  --ink-70:rgba(242,242,242,.7);
  --ink-50:rgba(242,242,242,.5);
  --ink-30:rgba(242,242,242,.32);

  --line:rgba(242,242,242,.13);
  --line-soft:rgba(242,242,242,.07);
  --fill:rgba(242,242,242,.05);
  --fill-hover:rgba(242,242,242,.1);
  --scrim:rgba(13,13,13,.62);

  --green:#2EE86B;
  --green-glow:rgba(46,232,107,.3);
  --on-green:#0d0d0d;

  --sans:"Sora",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
  --t:220ms var(--ease);
}

*{box-sizing:border-box}
/* varias classes usam display:flex, que venceria o display:none do atributo hidden */
[hidden]{display:none !important}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-size:14px;line-height:1.35;
  letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;
  min-height:100dvh;
  display:grid;place-items:center;
  padding:clamp(24px,7vh,88px) clamp(12px,3vw,40px);
}

button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:var(--br2)}

/* rotulo mono, o .t-mono do sistema */
.t-mono{
  font-family:var(--mono);font-size:11px;font-weight:400;
  letter-spacing:.08em;text-transform:uppercase;
}

/* ---------- a luz ----------
   o mesmo movimento do .funil do arttreis.com.br: um radial largo de
   --green-glow ancorado fora da tela, em opacidade baixa. a luz entra pela
   esquerda e morre antes de chegar do outro lado — o preto para de ser
   chapado sem virar cenario. */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(104% 78% at 22% 6%,var(--green-glow),transparent 64%);
  opacity:.28;
}
/* a grade de 28px do sistema, mascarada onde a luz bate: da textura ao fundo
   e some sozinha no escuro. e a mesma de .work__media no site. */
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(var(--line-soft) 1px,transparent 1px),
    linear-gradient(90deg,var(--line-soft) 1px,transparent 1px);
  background-size:28px 28px;
  -webkit-mask-image:radial-gradient(84% 68% at 22% 6%,#000,transparent 76%);
  mask-image:radial-gradient(84% 68% at 22% 6%,#000,transparent 76%);
  opacity:.42;
}

/* ---------- o aparelho ---------- */
.fone{
  position:relative;z-index:1;
  width:100%;max-width:496px;
  height:min(880px,calc(100dvh - clamp(48px,14vh,176px)));
  display:flex;flex-direction:column;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:calc(var(--br) * 1.75);
  overflow:hidden;
  box-shadow:
    inset 0 1px 0 rgba(242,242,242,.05),
    0 40px 110px -44px rgba(0,0,0,.95);
}
/* a mesma luz atravessa o aparelho — e por isso que ele parece aceso, e nao
   recortado. fica atras do conteudo, que sobe pro z-index 1. */
.fone::before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(128% 56% at -4% 16%,var(--green-glow),transparent 58%);
  opacity:.3;
}
.topo,.rolagem,.pilula-area{position:relative;z-index:1}

.topo{
  flex:0 0 auto;
  display:flex;justify-content:space-between;align-items:center;gap:var(--pd);
  padding:calc(var(--pd) * 1.25) calc(var(--pd) * 1.5) var(--pd3);
  color:var(--ink-30);
}
.janela{
  font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--ink-30);
  border-bottom:1px dashed var(--line);padding-bottom:1px;
  transition:color var(--t);
}
.janela:hover{color:var(--ink-70)}

/* a area que rola; a pilula fica parada no pe */
.rolagem{
  flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  padding:var(--pd) calc(var(--pd) * 1.5) var(--pd2);
  scrollbar-width:thin;scrollbar-color:var(--line) transparent;
}
.rolagem::-webkit-scrollbar{width:6px}
.rolagem::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}

.selo{
  width:52px;height:52px;border-radius:var(--br3);
  background:var(--fill);border:1px solid var(--line);
  display:grid;place-items:center;margin-bottom:calc(var(--pd) * 1.5);
}
.selo svg{width:23px;height:23px;color:var(--green)}

/* ---------- chamada ---------- */
.chamada{
  margin:0 0 var(--pd2);font-size:30px;font-weight:600;line-height:1.14;
  letter-spacing:-.038em;
}
.chamada .c1{display:block;color:var(--ink)}
.chamada .c2{display:block;color:var(--ink)}
/* se e medida, e mono — o .n do sistema */
.chamada .medida{
  font-family:var(--mono);font-weight:500;letter-spacing:-.03em;
  color:var(--green);
}
/* nao ha vermelho neste sistema: quando nao cabe, o verde simplesmente some */
.chamada[data-tom="estouro"] .medida{color:var(--ink)}
.contexto{margin:0 0 calc(var(--pd) * 1.25);font-size:13px;color:var(--ink-50);min-height:18px}

/* ---------- trilho do dia ---------- */
.trilho{
  display:flex;height:12px;border-radius:var(--br2);overflow:hidden;
  background:var(--bg);border:1px solid var(--line-soft);
}
.faixa{min-width:0;transition:background var(--t)}
.faixa+.faixa{box-shadow:inset 1px 0 0 var(--bg)}
.gasto{background:var(--bg)}
/* reservado: ocupado, mas nao por voce — tinta mais fraca que a banda de trabalho */
.reservado{background:repeating-linear-gradient(90deg,var(--fill) 0 2px,var(--bg) 2px 5px)}
.banda{background:var(--fill-hover)}
.banda.destaque{background:var(--ink)}
/* banda de palpite: ocupa o mesmo espaco, mas nao finge ser medida */
.banda.palpite{
  background:repeating-linear-gradient(45deg,var(--fill-hover) 0 4px,transparent 4px 8px);
}
.livre{background:var(--green);flex:1 1 auto}
.livre.recibo{background:var(--ink)}
.estouro{
  /* com estouro pequeno a barra vira um respingo de 3px e parece sujeira */
  height:6px;min-width:18px;margin-top:var(--pd3);border-radius:3px;
  background:repeating-linear-gradient(45deg,var(--ink-30) 0 3px,transparent 3px 6px);
}
.nota{
  display:block;margin-top:var(--pd2);text-align:right;
  color:var(--ink-30);min-height:15px;font-size:10px;
}
.editor-dia{
  display:flex;align-items:center;gap:var(--pd2);flex-wrap:wrap;margin-top:var(--pd2);
  font-family:var(--mono);font-size:11px;color:var(--ink-50);
}
.editor-dia input{
  background:var(--fill);border:1px solid var(--line);border-radius:var(--br2);
  padding:5px 8px;font-family:var(--mono);font-size:11px;color:var(--ink);
}
.editor-dia button{color:var(--green);text-decoration:underline;text-underline-offset:3px}

.rotulo{
  margin:calc(var(--pd) * 1.25) 0 var(--pd2);color:var(--ink-50);
  display:flex;justify-content:space-between;align-items:center;gap:var(--pd);
}
/* .pill do sistema */
.pill{
  display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 14px;
  font-size:12.5px;color:var(--ink-70);
  background:var(--fill);border:1px solid var(--line);border-radius:var(--br-pill);
  transition:background var(--t),color var(--t);
}
.pill:hover{background:var(--fill-hover);color:var(--ink)}
.pill svg{width:11px;height:11px;transition:transform var(--t)}

/* ---------- lista ---------- */
.lista{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--pd2)}
.tarefa{
  display:flex;align-items:center;gap:var(--pd);
  padding:10px 12px;border-radius:var(--br);
  background:var(--fill);border:1px solid var(--line-soft);
  transition:background var(--t),border-color var(--t),opacity var(--t),transform var(--t);
}
.tarefa:hover,.tarefa:focus-within{background:var(--fill-hover);border-color:var(--line)}
.tarefa.saindo{opacity:0;transform:translateX(12px)}
.tarefa.arrastando{
  position:relative;z-index:2;cursor:grabbing;
  background:var(--surface-2);border-color:var(--line);
  box-shadow:0 14px 30px rgba(0,0,0,.55);transition:none;
}

/* alca de arrastar: fica sempre visivel, senao ninguem descobre que da pra reordenar */
.pega{
  flex:0 0 auto;width:30px;height:30px;display:grid;place-items:center;
  border-radius:var(--br2);color:var(--ink-30);cursor:grab;
  touch-action:none;transition:color var(--t),background var(--t);
}
.pega:hover{color:var(--ink-70);background:var(--fill-hover)}
.pega svg{width:15px;height:15px}

/* o corte: daqui pra baixo nao da tempo hoje */
.corte{
  display:flex;align-items:center;gap:var(--pd2);
  margin:var(--pd2) 2px var(--pd3);color:var(--ink-30);
}
.corte::after{content:"";flex:1 1 auto;height:1px;background:var(--line)}
.tarefa[data-cabe="nao"]{opacity:.45}
.tarefa[data-cabe="nao"] .marca{border-style:dashed}

/* o ladrilho de icone e o proprio botao de concluir */
.marca{
  flex:0 0 auto;width:44px;height:44px;border-radius:var(--br3);
  background:var(--fill);border:1px solid var(--line);
  display:grid;place-items:center;color:var(--ink);
  transition:background var(--t),color var(--t),border-color var(--t);
}
.marca svg{width:18px;height:18px;opacity:.18;transition:opacity var(--t)}
.marca:hover{background:var(--green);border-color:var(--green);color:var(--on-green)}
.marca:hover svg,.tarefa:focus-within .marca svg{opacity:1}

.miolo{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.nome{
  font-size:14.5px;font-weight:500;color:var(--ink);letter-spacing:-.015em;
  background:none;border:0;outline:0;padding:0;width:100%;
  text-overflow:ellipsis;cursor:text;
}
.sub{
  align-self:flex-start;display:flex;align-items:center;gap:6px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;
  color:var(--ink-30);padding:1px 0;text-align:left;transition:color var(--t);
}
.sub:hover{color:var(--ink-70)}
.sub svg{width:11px;height:11px;flex:0 0 auto}
/* a tarefa cuja duracao se perdeu no caminho: cobra, em vez de sumir da conta */
.sub[data-falta="sim"]{color:var(--ink-70);text-decoration:underline;text-underline-offset:3px}
/* editar duracao na propria linha, no lugar exato onde ela e lida */
.sub-edit{
  align-self:flex-start;width:104px;
  background:var(--fill);border:1px solid var(--green-glow);border-radius:var(--br2);
  padding:2px 7px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;
  color:var(--ink);
}

.acoes{flex:0 0 auto;display:flex;align-items:center;gap:2px;opacity:0;transition:opacity var(--t)}
.tarefa:hover .acoes,.tarefa:focus-within .acoes{opacity:1}
.acao{
  width:30px;height:30px;display:grid;place-items:center;border-radius:var(--br2);
  color:var(--ink-30);transition:color var(--t),background var(--t);
}
.acao:hover{color:var(--ink);background:var(--fill-hover)}
.acao svg{width:15px;height:15px}
/* ---------- a fila e de outro dia ----------
   nao e erro nem alarme: e um fato com duas saidas. por isso tinta neutra e
   nenhum vermelho — o sistema nao tem um, e isso aqui nao pediria. */
.faixa-ontem{
  margin:calc(var(--pd) * 1.25) 0 0;
  padding:var(--pd);
  background:var(--fill);
  border:1px solid var(--line);
  border-radius:var(--br3);
}
.fo-texto{margin:0 0 var(--pd2);font-size:13px;color:var(--ink-70)}
.fo-texto b{color:var(--ink);font-weight:600}
.fo-acoes{display:flex;gap:var(--pd2);flex-wrap:wrap}

/* ---------- dia vazio ---------- */
.vazio{padding:var(--pd3) 0}
.vazio-sub{margin:0 0 var(--pd);font-size:13.5px;color:var(--ink-50)}
.exemplos{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--pd2)}
.exemplos li{
  display:flex;align-items:center;gap:var(--pd);
  padding:10px 12px;border-radius:var(--br);
  border:1px dashed var(--line);color:var(--ink-30);
}
.exemplos .e-marca{
  flex:0 0 auto;width:44px;height:44px;border-radius:var(--br3);
  border:1px dashed var(--line);
}
.exemplos .e-miolo{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.exemplos .e-nome{font-size:14.5px;font-weight:500;color:var(--ink-50)}
.exemplos .e-sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em}
.exemplos .e-sub b{font-weight:400;color:var(--green)}
.vazio-rodape{margin:var(--pd) 0 0;font-size:12.5px;color:var(--ink-30)}

/* ---------- concluidas ---------- */
.lista-feitas{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--pd3)}
.feitas[data-aberto="nao"] .lista-feitas{display:none}
.feitas[data-aberto="nao"] .pill svg{transform:rotate(-90deg)}
.feita{
  display:flex;align-items:center;gap:var(--pd);padding:6px 12px;border-radius:var(--br2);
  color:var(--ink-30);transition:background var(--t);
}
.feita:hover{background:var(--fill)}
.feita .marca{width:30px;height:30px;border-radius:var(--br2);color:var(--green);background:var(--fill)}
.feita .marca svg{width:13px;height:13px;opacity:1}
.feita .f-nome{
  flex:1 1 auto;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
  font-size:13.5px;text-decoration:line-through;text-decoration-color:var(--line);
}
.feita .f-tempo{flex:0 0 auto;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em}

/* ---------- o que ocupa o dia sem ser trabalho ----------
   fica acima da fila porque acontece antes dela na conta: e o dia que voce
   ja nao tem. sem check, porque nao se conclui almoco para ganhar tempo. */
.lista-reservas{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--pd3)}
.reserva{
  display:flex;align-items:center;gap:var(--pd2);padding:7px 12px;border-radius:var(--br2);
  color:var(--ink-50);background:var(--fill);transition:background var(--t);
}
.reserva:hover{background:var(--fill-hover)}
.reserva .r-marca{
  flex:0 0 auto;width:22px;height:22px;display:grid;place-items:center;color:var(--ink-30);
}
.reserva .r-marca svg{width:13px;height:13px}
.reserva .r-nome{
  flex:1 1 auto;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:13px;
}
.reserva .r-tempo{flex:0 0 auto;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em}
.reserva .acao{width:26px;height:26px}
.reserva .acoes{opacity:0}
.reserva:hover .acoes,.reserva:focus-within .acoes{opacity:1}

/* ---------- a nuvem ----------
   fica no pe da rolagem, em tinta baixa: e infraestrutura, nao assunto do dia. */
.arquivo{margin-top:calc(var(--pd) * 1.5);padding-top:var(--pd);border-top:1px solid var(--line-soft)}
.arq-linha{
  margin:0;display:flex;align-items:center;justify-content:space-between;
  gap:var(--pd2);flex-wrap:wrap;color:var(--ink-30);
}
.arq-acoes{display:flex;gap:var(--pd);flex:0 0 auto}
.arq-link{
  font-size:11.5px;color:var(--ink-50);
  text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line);
  transition:color var(--t);
}
.arq-link:hover{color:var(--ink)}
/* sincronizado e o unico estado que ganha o verde: e o unico em que o dia
   existe fora deste navegador */
#nuvem-estado[data-e="ligada"]{color:var(--green)}
#nuvem-estado[data-e="erro"],#nuvem-estado[data-e="offline"]{color:var(--ink-70)}

/* ---------- entrar ----------
   uma folha sobre o aparelho, nao uma pagina a parte: voce nao sai do dia
   para entrar na conta. */
.entrada{
  position:absolute;inset:0;z-index:20;
  display:grid;place-items:center;padding:var(--pd);
  background:var(--scrim);backdrop-filter:blur(3px);
}
.ent-caixa{
  position:relative;width:100%;max-width:330px;
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--br);
  padding:calc(var(--pd) * 1.5);
}
.ent-fechar{
  position:absolute;top:10px;right:12px;
  width:26px;height:26px;border-radius:var(--br2);
  color:var(--ink-30);font-size:13px;transition:color var(--t),background var(--t);
}
.ent-fechar:hover{color:var(--ink);background:var(--fill)}
.ent-titulo{margin:0 0 var(--pd3);font-size:15px;font-weight:600;letter-spacing:-.02em}
.ent-sub{margin:0 0 var(--pd);font-size:12.5px;color:var(--ink-50)}
.ent-form{margin:0}
.ent-campo{
  width:100%;height:44px;padding:0 14px;margin-bottom:var(--pd2);
  background:var(--fill);border:1px solid var(--line);border-radius:var(--br2);
  font-size:14px;color:var(--ink);
}
.ent-campo:focus{outline:none;border-color:var(--green-glow);background:var(--fill-hover)}
/* o codigo e medida, entao e mono e espacado — como todo numero deste sistema */
.ent-codigo{
  font-family:var(--mono);font-size:22px;letter-spacing:.32em;text-align:center;
}
.ent-botao{
  width:100%;height:44px;border-radius:var(--br-pill);
  background:var(--green);color:var(--on-green);
  font-size:13.5px;font-weight:600;transition:opacity var(--t);
}
.ent-botao:hover{opacity:.88}
.ent-recado{margin:var(--pd2) 0 0;font-size:12px;color:var(--ink-50);min-height:16px}

/* ---------- pilula do composer ---------- */
.pilula-area{flex:0 0 auto;padding:var(--pd2) calc(var(--pd) * 1.25) calc(var(--pd) * 1.25)}
.fantasma{
  display:flex;align-items:center;gap:var(--pd2);
  margin:0 var(--pd3) var(--pd2);padding:9px 12px;
  border:1px dashed var(--line);border-radius:var(--br);color:var(--ink-30);
}
.fantasma .g-nome{flex:1 1 auto;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:13.5px}
.fantasma .g-tempo{flex:0 0 auto;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em}
.fantasma[data-cabe="nao"]{border-style:solid;border-color:var(--line);color:var(--ink-70)}

/* ---------- os chips de duracao ----------
   toda tarefa tem duracao: quando o texto nao traz uma, ela e perguntada aqui
   antes de a tarefa existir. e um passo, nao um erro — dai a tinta neutra. */
.chips{
  margin:0 var(--pd3) var(--pd2);padding:10px 12px;
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--br);
}
.chips-txt{
  margin:0 0 var(--pd2);font-size:12px;color:var(--ink-50);
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
}
.chips-txt b{color:var(--ink-70);font-weight:500}
.chips-fila{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  height:30px;padding:0 13px;border-radius:var(--br-pill);
  background:var(--fill);border:1px solid var(--line);
  font-family:var(--mono);font-size:11.5px;color:var(--ink-70);
  transition:background var(--t),color var(--t),border-color var(--t);
}
.chip:hover{background:var(--fill-hover);color:var(--ink)}
.chip[data-cabe="nao"]{color:var(--ink-30)}
.chip.outro{font-family:var(--sans);font-size:12px;color:var(--ink-50)}

.pilula{
  display:flex;align-items:center;gap:var(--pd2);
  height:56px;padding:0 var(--pd2);
  background:var(--fill);border:1px solid var(--line);
  border-radius:var(--br-pill);transition:border-color var(--t),background var(--t);
}
.pilula:focus-within{border-color:var(--green-glow);background:var(--fill-hover)}
.mais{
  flex:0 0 auto;width:38px;height:38px;border-radius:50%;
  background:var(--fill-hover);border:1px solid var(--line);
  display:grid;place-items:center;color:var(--ink-50);
  transition:background var(--t),color var(--t),border-color var(--t);
}
.mais svg{width:16px;height:16px}
.pilula:focus-within .mais{background:var(--green);border-color:var(--green);color:var(--on-green)}
.pilula input{
  flex:1 1 auto;min-width:0;background:none;border:0;outline:0;
  font-size:14.5px;caret-color:var(--green);
}
.pilula input::placeholder{color:var(--ink-30)}
.enviar{
  flex:0 0 auto;width:38px;height:38px;border-radius:50%;
  display:grid;place-items:center;color:var(--ink-30);
  transition:color var(--t),background var(--t);
}
.enviar svg{width:16px;height:16px}
.enviar:hover{color:var(--ink);background:var(--fill-hover)}
.aviso-storage{margin:var(--pd2) 6px 0;font-size:11.5px;color:var(--ink-70)}

/* ---------- desfazer ---------- */
.aviso{
  position:absolute;left:var(--pd);right:var(--pd);bottom:86px;z-index:5;
  display:flex;align-items:center;justify-content:space-between;gap:var(--pd);
  padding:11px 14px;border-radius:var(--br);
  background:var(--surface-2);border:1px solid var(--line);
  font-size:13px;color:var(--ink);
  box-shadow:0 10px 30px rgba(0,0,0,.55);
}
.aviso span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aviso button{
  flex:0 0 auto;color:var(--green);font-size:12.5px;
  text-decoration:underline;text-underline-offset:3px;padding:var(--pd3) 2px;
}

/* no celular o aparelho vira a tela inteira */
/* ---------- bento ----------
   o aparelho nao muda: mesmo tamanho, mesmo miolo, mesma casca. a grade so
   abre trilho AO LADO dele para os blocos novos (ideias, matriz, etc).
   trilho vazio nao existe — :empty tira do fluxo, entao ate o primeiro bloco
   nascer a tela e exatamente a de hoje. */
.lado{display:flex;flex-direction:column;gap:var(--pd);width:100%;max-width:496px}
.lado:empty{display:none}

/* o ladrilho dos blocos novos: mesma superficie e mesma sombra do aparelho,
   um raio abaixo — o dia continua sendo o objeto principal da tela. */
.bloco{
  position:relative;
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--br);padding:calc(var(--pd) * 1.25);
  box-shadow:inset 0 1px 0 rgba(242,242,242,.05),0 40px 110px -44px rgba(0,0,0,.95);
}

@media (min-width:1200px){
  body{
    /* o aparelho fica na coluna do meio, no tamanho que sempre teve.
       os trilhos so existem se tiverem bloco dentro. */
    grid-template-columns:minmax(272px,340px) 496px minmax(272px,340px);
    justify-content:center;
    align-items:start;
    gap:var(--pd);
  }
  .fone{grid-column:2;grid-row:1}
  #lado-esq{grid-column:1;grid-row:1}
  #lado-dir{grid-column:3;grid-row:1}
  /* alinha o topo dos blocos com o topo do aparelho */
  .lado{max-width:none}
}

@media (max-width:480px){
  body{padding:0}
  .fone{max-width:none;height:100dvh;border-radius:0;border:0;box-shadow:none}
  .topo{padding-top:max(18px,env(safe-area-inset-top))}
  .pilula-area{padding-bottom:max(var(--pd),env(safe-area-inset-bottom))}
  .chamada{font-size:27px}
  /* sem hover no toque, as acoes ficam sempre visiveis — entao elas precisam
     custar menos largura, senao comem o titulo */
  .acoes{opacity:1}
  .tarefa{gap:10px;padding:10px}
  .marca{width:40px;height:40px}
  .acao{width:28px;height:28px}
  .exemplos li{gap:10px;padding:10px}
  .exemplos .e-marca{width:40px;height:40px}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important;animation-duration:.01ms !important}
}

<!-- os trilhos do bento. ficam depois do aparelho no DOM de proposito: no
     celular a coluna e uma so, e bloco novo tem que cair EMBAIXO do dia, nao
     na frente dele. no desktop a grade joga o primeiro para a esquerda. -->
<div class="lado" id="lado-esq"></div>
<div class="lado" id="lado-dir"></div>

<script>
(() => {
  "use strict";

  const CHAVE = "artt-planner:v2";
  const CHAVE_ANTIGA = "artt-planner:v1";
  const DIA = 1440;

  /* a data como o estado a guarda: YYYY-MM-DD no fuso local, nunca ISO/UTC —
     toISOString() em Sao Paulo joga tudo depois das 21h para o dia seguinte. */
  function diaDe(d) {
    return d.getFullYear() + "-" +
      String(d.getMonth() + 1).padStart(2, "0") + "-" +
      String(d.getDate()).padStart(2, "0");
  }
  const hoje = () => diaDe(new Date());
  const ehDia = (v) => typeof v === "string" && /^\d{4}-\d{2}-\d{2}$/.test(v);

  /* prefixo por aba: duas abas abertas no mesmo milissegundo nao podem gerar o mesmo id */
  const SESSAO = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  let contador = 0;
  const proximoId = () => SESSAO + "-" + (++contador);

  /* ---------- estado ---------- */

  function normalizar(t) {
    return {
      id: t && t.id ? String(t.id) : proximoId(),
      titulo: String((t && t.titulo) || "").slice(0, 300),
      min: Number.isFinite(+(t && t.min)) && +t.min > 0 ? Math.min(Math.round(+t.min), DIA) : 0,
      feito: !!(t && t.feito),
      /* reserva ocupa a janela sem ser trabalho: almoco, reuniao, bloco fixo.
         nao se conclui, nao devolve tempo, nao entra na fila — so encolhe o dia. */
      reserva: !!(t && t.reserva)
    };
  }

  const minutoValido = (v, padrao) =>
    Number.isFinite(+v) && +v >= 0 && +v <= DIA ? Math.round(+v) : padrao;

  function carregar() {
    let bruto = null;
    try {
      bruto = JSON.parse(localStorage.getItem(CHAVE));
      if (!bruto) {
        /* migra do formato antigo, que guardava capacidade em vez de janela */
        const velho = JSON.parse(localStorage.getItem(CHAVE_ANTIGA));
        if (velho && Array.isArray(velho.tarefas)) {
          bruto = {
            tarefas: velho.tarefas,
            inicio: 540,
            fim: 540 + minutoValido(velho.capacidade, 600),
            feitasAbertas: !!velho.feitasAbertas
          };
        }
      }
    } catch (e) { /* storage bloqueado ou corrompido: comeca limpo */ }

    return carregarDe(bruto);
  }

  /* a mesma validacao para tudo que entra: localStorage, arquivo importado e
     arquivo sincronizado. nada chega ao estado sem passar por aqui. */
  function carregarDe(bruto) {
    const vazio = { tarefas: [], inicio: 540, fim: 1140, feitasAbertas: false, dia: hoje(), v: 0 };
    if (!bruto || !Array.isArray(bruto.tarefas)) return vazio;
    const inicio = minutoValido(bruto.inicio, 540);
    let fim = minutoValido(bruto.fim, 1140);
    if (fim <= inicio) fim = Math.min(inicio + 600, DIA);
    return {
      tarefas: bruto.tarefas.map(normalizar).filter((t) => t.titulo),
      inicio,
      fim,
      feitasAbertas: !!bruto.feitasAbertas,
      /* estado gravado antes do campo existir e a fila viva de quem ja usava:
         tratar como hoje na primeira carga, em vez de acusar um atraso inventado */
      dia: ehDia(bruto.dia) ? bruto.dia : hoje(),
      /* carimbo de escrita: e por ele que dois aparelhos decidem quem esta na
         frente. lastModified do arquivo nao serve — quem mexe nele e o cliente
         de sync, nao nos. */
      v: Number.isFinite(+bruto.v) && +bruto.v > 0 ? Math.round(+bruto.v) : 0
    };
  }

  const estado = carregar();
  let storageQuebrado = false;
  /* declarado aqui, e nao junto do resto do desfazer, porque o listener de
     storage abaixo o consulta e e registrado antes daquele bloco */
  let paraDesfazer = null;

  function salvar() {
    /* o navegador continua sendo a fonte de verdade da sessao: o arquivo e
       camada de sincronia, nao substituto. se ele falhar, o dia nao se perde. */
    estado.v = Date.now();
    try { localStorage.setItem(CHAVE, JSON.stringify(estado)); }
    catch (e) {
      if (!storageQuebrado) {
        storageQuebrado = true;
        elAvisoStorage.hidden = false;
        elAvisoStorage.textContent = "não consegui salvar neste navegador — o que você fizer agora some ao fechar";
      }
    }
    agendarGravacao();
  }

  /* outra aba gravou: recarrega em vez de sobrescrever o trabalho dela */
  window.addEventListener("storage", (e) => {
    if (e.key !== CHAVE) return;
    Object.assign(estado, carregar());
    /* o desfazer pendente virou lixo: ele restauraria um retrato anterior ao
       que a outra aba acabou de gravar, apagando o trabalho dela — o oposto
       do que este listener existe para evitar. (guardado porque este listener
       e registrado antes das referencias de DOM existirem.) */
    if (paraDesfazer) fecharAviso();
    render();
  });

  /* ---------- tempo ---------- */

  /* escrito por extenso: so as formas que alguem realmente digita com pressa */
  const POREXTENSO = [
    [/(?:^|\s)meia\s*hora(?=\s|$)/i, 30],
    [/(?:^|\s)uma\s*hora\s*e\s*meia(?=\s|$)/i, 90],
    [/(?:^|\s)(?:uma|1)\s*hora(?=\s|$)/i, 60],
    [/(?:^|\s)duas\s*horas(?=\s|$)/i, 120],
    [/(?:^|\s)tr[eê]s\s*horas(?=\s|$)/i, 180]
  ];

  function lerDuracao(texto) {
    /* por extenso primeiro: "meia hora" nao tem digito para os padroes abaixo pegarem */
    for (const [re, valor] of POREXTENSO) {
      const m = texto.match(re);
      if (m) return fatiar(texto, m, valor);
    }

    /* decimal com virgula ou ponto: "1,5h" e "1.5h" sao a mesma coisa aqui */
    const decimal = texto.match(/(?:^|\s)(\d{1,2})[.,](\d{1,2})\s*h(?:oras?)?(?=\s|$)/i);
    if (decimal) {
      const fracao = +("0." + decimal[2]);
      return fatiar(texto, decimal, Math.round(((+decimal[1]) + fracao) * 60));
    }

    /* minutos so contam colados na hora ("1h30") ou com unidade ("1h 30m"):
       senao "revisar 1h 20 slides" viraria 1h20 e comeria o "20" do titulo.
       "1h 30" tambem nao conta, pela mesma razao — o 30 pode ser do titulo. */
    const comHora = texto.match(/(?:^|\s)(\d{1,2})\s*h(?:oras?)?(?:(\d{1,2})|\s*(\d{1,2})\s*(?:m|min|mins|minutos?))?(?=\s|$)/i);
    const m = comHora || texto.match(/(?:^|\s)(\d{1,3})\s*(?:m|min|mins|minutos?)(?=\s|$)/i);
    if (!m) return { min: 0, titulo: texto.replace(/\s+/g, " ").trim() };
    const min = comHora ? (+m[1]) * 60 + (+(m[2] || m[3] || 0)) : +m[1];
    return fatiar(texto, m, min);
  }

  /* fatia pela posicao real do match: replace(string) apagaria a primeira
     ocorrencia literal, que pode nao ser a que casou */
  function fatiar(texto, m, min) {
    const limpo = texto.slice(0, m.index) + " " + texto.slice(m.index + m[0].length);
    return { min: Math.min(min, DIA), titulo: limpo.replace(/\s+/g, " ").trim() };
  }

  /* o texto tem numero mas nada casou: provavelmente e tempo mal escrito.
     serve so para a previa avisar em vez de criar uma tarefa muda. */
  const pareceTempoQuebrado = (texto, min) =>
    !min && /\d/.test(texto) && !/^\s*\d+\s*$/.test(texto);

  function formatar(min) {
    if (!min) return "—";
    const h = Math.floor(min / 60), m = min % 60;
    if (!h) return m + "m";
    if (!m) return h + "h";
    return h + "h" + String(m).padStart(2, "0");
  }

  function longo(min) {
    if (!min) return "0m";
    const h = Math.floor(min / 60), m = min % 60;
    return (h ? h + "h" : "") + (h && m ? " " : "") + (m ? m + "m" : "");
  }

  const relogio = (min) =>
    String(Math.floor(min / 60) % 24).padStart(2, "0") + ":" + String(Math.round(min) % 60).padStart(2, "0");

  const agoraMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
  const limitar = (v, a, b) => Math.max(a, Math.min(b, v));

  /* "2026-09-01" -> Date local ao meio-dia: sem hora, o parse de "YYYY-MM-DD"
     e tratado como UTC e volta um dia em fusos negativos */
  const dataDe = (dia) => {
    const [a, m, d] = dia.split("-").map(Number);
    return new Date(a, m - 1, d, 12);
  };

  const rotuloData = (dia) =>
    new Intl.DateTimeFormat("pt-BR", { weekday: "short", day: "2-digit", month: "short" })
      .format(dataDe(dia)).replace(/\./g, "").replace(",", " ·").toUpperCase();

  /* so o dia da semana, para a faixa: "esta fila e de segunda" */
  const diaDaSemana = (dia) =>
    new Intl.DateTimeFormat("pt-BR", { weekday: "long" }).format(dataDe(dia));

  const atrasada = () => estado.dia !== hoje();

  /* a fila e so trabalho: reserva ocupa a janela mas nunca e "coisa na fila" */
  const pendentes = () => estado.tarefas.filter((t) => !t.feito && !t.reserva);
  const feitas = () => estado.tarefas.filter((t) => t.feito && !t.reserva);
  const reservas = () => estado.tarefas.filter((t) => t.reserva);

  /* a conta inteira do produto, em minutos. nenhum pixel entra aqui. */
  /* toda tarefa ocupa espaco. o composer nao deixa nascer nenhuma sem duracao,
     mas fila antiga (e importada) pode ter — e essas custam um palpite visivel
     em vez de zero: valer zero e o que fazia 20 tarefas reais exibirem folga. */
  const PALPITE = 30;
  const custoDe = (t) => t.min || PALPITE;

  function contas() {
    const janela = estado.fim - estado.inicio;
    const agora = agoraMin();
    const decorrido = limitar(agora - estado.inicio, 0, janela);
    const abertas = pendentes();
    const comprometido = abertas.reduce((s, t) => s + custoDe(t), 0);
    /* reserva sai da janela ANTES de qualquer promessa de folga: a diferenca
       entre "cabem 4h" e "cabem 4h se voce nao almocar" e o que separa um
       medidor de um otimista. so a reserva que ainda nao passou e descontada. */
    const reservado = reservas().reduce((s, t) => s + t.min, 0);
    const reservaViva = Math.max(0, Math.min(reservado, janela - decorrido));
    const restante = janela - decorrido - reservaViva;
    return {
      janela, agora, decorrido, restante, abertas, comprometido,
      reservado, reservaViva,
      semEstimativa: abertas.filter((t) => !t.min).length,
      sobra: restante - comprometido,
      estouro: Math.max(0, comprometido - restante),
      horaExtra: agora > estado.fim
    };
  }

  /* onde cada tarefa cai dentro do dia, e a partir de qual delas nao da mais tempo.
     tarefa sem estimativa entra pelo palpite: ela desloca o cursor e pode
     disparar o corte como qualquer outra — so aparece marcada como palpite. */
  function distribuir() {
    const c = contas();
    const vagas = new Map();
    /* a reserva ocupa a frente do que resta: o trabalho comeca depois dela.
       nao e o horario real do almoco — e o espaco que ele tira do dia. */
    let cursor = c.decorrido + c.reservaViva;
    let corte = -1;
    c.abertas.forEach((t, i) => {
      const custo = custoDe(t);
      const disponivel = c.janela - cursor;
      if (disponivel <= 0) { if (corte < 0) corte = i; return; }
      const usar = Math.min(custo, disponivel);
      const cortada = usar < custo;
      if (cortada && corte < 0) corte = i;
      vagas.set(t.id, { de: cursor, min: usar, cortada, palpite: !t.min });
      cursor += usar;
    });
    return { c, vagas, corte };
  }

  /* ---------- referencias ---------- */

  const $ = (id) => document.getElementById(id);
  const elLista = $("lista"), elFeitas = $("lista-feitas"), elVazio = $("vazio");
  const elTrilho = $("trilho"), elEstouro = $("estouro");
  const elC1 = $("c1"), elMedidaTxt = $("medida"), elResto = $("resto"), elChamada = $("chamada");
  const elContexto = $("contexto"), elNota = $("nota"), elJanela = $("janela");
  const elSecaoFeitas = $("feitas"), elRotuloFeitas = $("feitas-rotulo");
  const elRotuloFila = $("rotulo-fila"), elRotuloTexto = $("rotulo-texto");
  const elCampo = $("campo"), elFantasma = $("fantasma"), elAvisoStorage = $("aviso-storage");
  const elAviso = $("aviso"), elAvisoTexto = $("aviso-texto");
  const elEditorDia = $("editor-dia"), elInicio = $("inicio"), elFim = $("fim");
  const elVazioSub = $("vazio-sub"), elExemplos = $("exemplos"), elVazioRodape = $("vazio-rodape");
  const elFaixaOntem = $("faixa-ontem"), elFoTexto = $("fo-texto"), elFoQuando = $("fo-quando");
  const elChips = $("chips");

  /* titulo do usuario indo para innerHTML: escapa antes, sempre */
  const escapar = (s) => String(s).replace(/[&<>"]/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5l5.5 5.5L20 6.5"/></svg>';
  const RELOGIO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/></svg>';
  const PEGA = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>';
  const LIXO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9.5 7V5h5v2M6.5 7l1 12.5h9L17.5 7"/></svg>';

  const semMovimento = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- render ---------- */

  function render() {
    const d = distribuir();
    renderChamada(d);
    renderTrilho(d);
    renderFaixaOntem();
    renderReservas();
    renderPendentes(d);
    renderFeitas();
  }

  function renderReservas() {
    const lista = reservas();
    const secao = $("reservas");
    secao.hidden = lista.length === 0;
    if (!lista.length) return;

    const total = lista.reduce((s, t) => s + t.min, 0);
    $("reservas-rotulo").textContent = longo(total) + " fora do trabalho";

    const ul = $("lista-reservas");
    ul.textContent = "";
    lista.forEach((t) => {
      const li = document.createElement("li");
      li.className = "reserva";
      li.dataset.id = t.id;

      const marca = document.createElement("span");
      marca.className = "r-marca";
      marca.innerHTML = RELOGIO;

      const nome = document.createElement("span");
      nome.className = "r-nome";
      nome.textContent = t.titulo;

      const tempo = document.createElement("span");
      tempo.className = "r-tempo";
      tempo.textContent = formatar(t.min);

      const lixo = document.createElement("button");
      lixo.className = "acao";
      lixo.dataset.acao = "excluir";
      lixo.innerHTML = LIXO;
      lixo.setAttribute("aria-label", "Remover reserva: " + t.titulo);

      const acoes = document.createElement("div");
      acoes.className = "acoes";
      acoes.append(lixo);

      li.append(marca, nome, tempo, acoes);
      ul.appendChild(li);
    });
  }

  /* nada acontece sozinho: a fila velha continua exatamente como ficou, e a
     unica coisa que muda e a tela parar de chamar aquilo de hoje. */
  function renderFaixaOntem() {
    const velha = atrasada();
    elFaixaOntem.hidden = !velha;
    if (!velha) return;

    const abertas = pendentes();
    const total = abertas.reduce((s, t) => s + t.min, 0);
    const quando = diaDaSemana(estado.dia);

    elFoTexto.innerHTML = "Esta fila é de <b>" + quando + "</b>" +
      (abertas.length
        ? " · " + abertas.length + (abertas.length === 1 ? " aberta" : " abertas") +
          (total ? " · " + longo(total) : "")
        : " e não sobrou nada aberto");
    elFoQuando.textContent = "fechar " + quando;
  }

  /* so o que depende do relogio, para o tick nao roubar o foco de quem digita */
  function renderTempo() {
    const d = distribuir();
    renderChamada(d);
    renderTrilho(d);
    renderHorarios(d);
  }

  function renderChamada({ c }) {
    /* o carimbo e a data DA FILA, nao a de hoje: enquanto o estado for de ontem,
       dizer "hoje" aqui seria afirmar algo falso sobre o que esta na tela */
    $("data").textContent = rotuloData(estado.dia);

    elJanela.textContent = relogio(estado.inicio) + " → " + relogio(estado.fim);
    elChamada.dataset.tom = "normal";

    const prontas = feitas().length;

    if (!c.abertas.length) {
      elC1.textContent = prontas ? "Tudo fechado." : "Dia limpo.";
      elMedidaTxt.textContent = formatar(Math.max(0, c.restante));
      elResto.textContent = c.horaExtra ? "— o dia já acabou" : (prontas ? "ainda de dia" : "pela frente");
      if (prontas) {
        const total = feitas().reduce((s, t) => s + t.min, 0);
        /* enquanto a fila for de ontem, "N fechadas" e trabalho de ontem:
           dizer de quando sem tirar o credito do que foi feito */
        elContexto.textContent = prontas + (prontas === 1 ? " fechada" : " fechadas") +
          (total ? " · " + longo(total) + " de trabalho" : "") +
          (atrasada() ? " — de " + diaDaSemana(estado.dia) : "");
      } else {
        elContexto.textContent = "o dia acaba às " + relogio(estado.fim) + ".";
      }
    } else if (c.sobra >= 0) {
      elC1.textContent = "Ainda cabem";
      /* "~" so aqui: a sobra e o unico numero que o palpite pode INFLAR.
         no estouro ele e piso — palpite so pode aumentar o debito, nunca reduzi-lo. */
      elMedidaTxt.textContent = (c.semEstimativa ? "~" : "") + formatar(c.sobra);
      elResto.textContent = "no seu dia";
      elContexto.textContent = longo(c.comprometido) + " na fila" +
        (c.reservaViva ? " · " + longo(c.reservaViva) + " reservado" : "") +
        " · o dia acaba às " + relogio(estado.fim);
    } else {
      /* passar das 19:00 qualifica o estouro, nao substitui a pergunta.
         antes, as 19:01 a tela trocava "não cabe 2h48" por "1m de hora extra"
         — o numero encolhia justamente quando cortar algo era mais urgente. */
      elChamada.dataset.tom = "estouro";
      elC1.textContent = "Não cabe.";
      elMedidaTxt.textContent = formatar(c.estouro);
      elResto.textContent = "além do que resta";
      elContexto.textContent = c.horaExtra
        ? "passou das " + relogio(estado.fim) + " · " + longo(c.comprometido) + " ainda na fila. Algo tem que sair."
        : longo(c.comprometido) + " na fila para " + longo(c.restante) + " de dia. Algo tem que sair.";
    }

    elNota.textContent = c.semEstimativa
      ? c.semEstimativa + (c.semEstimativa === 1 ? " sem duração · conta " : " sem duração · contam ") +
        formatar(PALPITE) + (c.semEstimativa === 1 ? "" : " cada")
      : "";
  }

  function renderTrilho({ c, vagas }) {
    elTrilho.textContent = "";

    const faixa = (classe, min) => {
      const el = document.createElement("div");
      el.className = "faixa " + classe;
      /* tudo e % da mesma janela: sem px fixo, sem gap, sem min-width — e por isso
         que o desenho nao pode divergir da conta */
      el.style.flex = "0 0 " + ((min / c.janela) * 100) + "%";
      el.style.minWidth = "0";
      return el;
    };

    if (c.decorrido > 0) elTrilho.appendChild(faixa("gasto", c.decorrido));

    /* a reserva antes do trabalho: e o que o dia ja nao tem para oferecer */
    if (c.reservaViva > 0) {
      const r = faixa("reservado", c.reservaViva);
      r.title = "reservado · " + longo(c.reservaViva);
      elTrilho.appendChild(r);
    }

    c.abertas.forEach((t) => {
      const vaga = vagas.get(t.id);
      if (!vaga) return;
      const el = faixa("banda" + (vaga.palpite ? " palpite" : ""), vaga.min);
      el.dataset.id = t.id;
      el.title = t.titulo + " · " + (vaga.palpite ? "palpite de " + formatar(PALPITE) : formatar(t.min));
      elTrilho.appendChild(el);
    });

    if (c.comprometido < c.restante) {
      const livre = document.createElement("div");
      livre.className = "faixa livre";
      elTrilho.appendChild(livre);
    }

    /* a hachura acompanha o estouro, inclusive depois do fim do dia: sumir ali
       era o produto abandonar a propria pergunta quando a resposta e mais dura */
    elEstouro.hidden = c.estouro <= 0;
    if (!elEstouro.hidden) elEstouro.style.width = Math.min(100, (c.estouro / c.janela) * 100) + "%";
  }

  /* o horario projetado nao cabe na linha: vive no title dela */
  function renderHorarios({ vagas }) {
    elLista.querySelectorAll(".tarefa").forEach((li) => {
      const vaga = vagas.get(li.dataset.id);
      if (!vaga) { li.removeAttribute("title"); return; }
      li.title = relogio(estado.inicio + vaga.de) + "–" + relogio(estado.inicio + vaga.de + vaga.min);
    });
  }

  function renderPendentes(d) {
    const corte = d.corte;
    const abertas = pendentes();
    /* a tela vazia cobre tambem o "tudo concluido": nunca sobra um buraco */
    elVazio.hidden = abertas.length > 0;
    elRotuloFila.hidden = abertas.length === 0;
    elRotuloTexto.textContent = abertas.length +
      (abertas.length === 1 ? " coisa na fila" : " coisas na fila");
    elLista.textContent = "";

    if (!abertas.length) {
      renderVazio(d);
      return;
    }

    abertas.forEach((t, i) => {
      /* a régua: daqui pra baixo o dia nao alcanca */
      if (corte >= 0 && i === corte) {
        const regua = document.createElement("li");
        regua.className = "corte";
        regua.innerHTML = '<span class="t-mono">daqui não dá tempo hoje</span>';
        elLista.appendChild(regua);
      }

      const li = document.createElement("li");
      li.className = "tarefa";
      li.dataset.id = t.id;
      if (corte >= 0 && i >= corte) li.dataset.cabe = "nao";
      li.tabIndex = 0;

      const marca = document.createElement("button");
      marca.className = "marca";
      marca.dataset.acao = "concluir";
      marca.innerHTML = CHECK;
      marca.setAttribute("aria-label", "Concluir: " + t.titulo);

      const nome = document.createElement("input");
      nome.className = "nome";
      nome.value = t.titulo;
      nome.dataset.acao = "renomear";
      nome.setAttribute("aria-label", "Título da tarefa");

      const sub = document.createElement("button");
      sub.className = "sub";
      sub.type = "button";
      sub.dataset.acao = "tempo";
      const vaga = d.vagas.get(t.id);
      const parcial = vaga && vaga.cortada ? " · só " + formatar(vaga.min) + " hoje" : "";
      /* sem duracao nao e um estado neutro: e uma pergunta em aberto que ja
         esta custando PALPITE na conta. a linha diz isso e pede o numero. */
      if (!t.min) sub.dataset.falta = "sim";
      sub.innerHTML = RELOGIO + "<span>" +
        (t.min ? formatar(t.min) : "definir duração · contando " + formatar(PALPITE)) +
        parcial + "</span>";
      sub.setAttribute("aria-label", t.min
        ? "Duração: " + longo(t.min) + ". Alterar"
        : "Sem duração, contando " + longo(PALPITE) + " como palpite. Definir");

      const miolo = document.createElement("div");
      miolo.className = "miolo";
      miolo.append(nome, sub);

      const lixo = document.createElement("button");
      lixo.className = "acao";
      lixo.dataset.acao = "excluir";
      lixo.innerHTML = LIXO;
      lixo.setAttribute("aria-label", "Excluir: " + t.titulo);

      const acoes = document.createElement("div");
      acoes.className = "acoes";
      acoes.append(lixo);

      const pega = document.createElement("button");
      pega.className = "pega";
      pega.type = "button";
      pega.innerHTML = PEGA;
      pega.setAttribute("aria-label", "Arrastar para reordenar: " + t.titulo);

      li.append(marca, miolo, acoes, pega);
      elLista.appendChild(li);
    });

    renderHorarios(d);
  }

  function renderVazio({ c }) {
    const estreia = estado.tarefas.length === 0;
    /* os dois cartoes so na estreia — depois eles pareceriam fila de verdade.
       o rodape, nao: ele e a unica explicacao de como a duracao e lida, e
       sumir para sempre depois da primeira tarefa deixava quem esquecesse a
       sintaxe alimentando a tela as cegas. volta toda vez que a fila esvazia. */
    elExemplos.hidden = !estreia;
    elVazioRodape.hidden = false;
    elVazioRodape.textContent = estreia
      ? "Escreve assim, com a duração no fim: ela sai do título e entra na barra do dia."
      : "Com a duração no fim — “revisar proposta 45m”, “gravar 1h30”, “almoço 1h”. Sem ela, eu pergunto.";

    if (c.horaExtra) {
      elVazioSub.textContent = "Passou das " + relogio(estado.fim) + " e não sobrou nada na fila.";
    } else if (!estreia) {
      elVazioSub.textContent = "Nada na fila. Dá pra puxar mais alguma coisa, ou parar por aqui.";
    } else {
      elVazioSub.textContent = "Escreve embaixo a primeira coisa que precisa caber hoje.";
    }
  }

  function renderFeitas() {
    const prontas = feitas();
    elSecaoFeitas.hidden = prontas.length === 0;
    elSecaoFeitas.dataset.aberto = estado.feitasAbertas ? "sim" : "nao";
    $("alternar-feitas").setAttribute("aria-expanded", String(!!estado.feitasAbertas));
    elRotuloFeitas.textContent = prontas.length + (prontas.length === 1 ? " concluída" : " concluídas");
    elFeitas.textContent = "";

    prontas.forEach((t) => {
      const li = document.createElement("li");
      li.className = "feita";
      li.dataset.id = t.id;

      const marca = document.createElement("button");
      marca.className = "marca";
      marca.dataset.acao = "reabrir";
      marca.innerHTML = CHECK;
      marca.setAttribute("aria-label", "Reabrir: " + t.titulo);

      const nome = document.createElement("span");
      nome.className = "f-nome";
      nome.textContent = t.titulo;

      const tempo = document.createElement("span");
      tempo.className = "f-tempo";
      tempo.textContent = formatar(t.min);

      li.append(marca, nome, tempo);
      elFeitas.appendChild(li);
    });
  }

  /* ---------- desfazer ---------- */

  let timerAviso = null;
  /* uma pilha, e nao uma variavel unica: apagar duas coisas seguidas deixava
     so a ultima recuperavel, e o desfazer revertia junto tudo que tinha
     acontecido no intervalo, em silencio. cada acao volta sozinha, na ordem. */
  const PILHA = 12;

  function comDesfazer(texto, acao) {
    /* o retrato guarda o documento inteiro, nao so as tarefas: a faixa de
       ontem mexe no dia e o import troca ate a janela — desfazer parcial
       deixaria a tela num estado que nunca existiu */
    const antes = {
      tarefas: estado.tarefas.map((t) => ({ ...t })),
      dia: estado.dia, inicio: estado.inicio, fim: estado.fim,
      texto
    };
    acao();
    paraDesfazer = paraDesfazer || [];
    paraDesfazer.push(antes);
    if (paraDesfazer.length > PILHA) paraDesfazer.shift();
    mostrarAviso(texto);
  }

  function mostrarAviso(texto) {
    elAvisoTexto.textContent = texto;
    elAviso.hidden = false;
    clearTimeout(timerAviso);
    timerAviso = setTimeout(fecharAviso, semMovimento() ? 9000 : 6000);
  }

  function fecharAviso() {
    elAviso.hidden = true;
    paraDesfazer = null;
    clearTimeout(timerAviso);
  }

  $("aviso-desfazer").addEventListener("click", () => {
    if (!paraDesfazer || !paraDesfazer.length) return;
    const passo = paraDesfazer.pop();
    estado.tarefas = passo.tarefas;
    estado.dia = passo.dia;
    estado.inicio = passo.inicio;
    estado.fim = passo.fim;
    salvar();
    render();
    /* ainda ha passos atras: o aviso continua, apontando para o proximo */
    if (paraDesfazer.length) mostrarAviso(paraDesfazer[paraDesfazer.length - 1].texto);
    else fecharAviso();
  });

  /* ---------- acoes ---------- */

  const acharIndice = (id) => estado.tarefas.findIndex((t) => t.id === id);
  const seletor = (id) => '[data-id="' + (window.CSS && CSS.escape ? CSS.escape(id) : id) + '"]';

  /* titulo e duracao chegam ja resolvidos: quem decide o tempo e o composer,
     que nao deixa nascer tarefa sem ele */
  function criar(titulo, min, reserva) {
    const limpo = String(titulo).replace(/\s+/g, " ").trim();
    if (!limpo || !min) return;
    /* escrever numa fila de ontem ja e a decisao de comecar hoje: carimba o dia
       e leva junto o que estava aberto, em vez de misturar em silencio */
    if (atrasada()) {
      estado.tarefas = pendentes();
      estado.dia = hoje();
    }
    estado.tarefas.unshift({
      id: proximoId(), titulo: limpo.slice(0, 300), min, feito: false, reserva: !!reserva
    });
    salvar();
    render();
  }

  function concluir(id) {
    const i = acharIndice(id);
    if (i < 0 || estado.tarefas[i].feito) return;
    const t = estado.tarefas[i];
    const aplicar = () => {
      const j = acharIndice(id);
      if (j < 0) return;
      estado.tarefas[j].feito = true;
      const [x] = estado.tarefas.splice(j, 1);
      estado.tarefas.push(x);
      salvar();
      render();
      piscarRecibo();
    };
    const texto = t.min ? "+" + longo(t.min) + " de volta pro dia" : "feita.";
    const li = elLista.querySelector(seletor(id));
    if (li && !semMovimento()) {
      li.classList.add("saindo");
      setTimeout(() => comDesfazer(texto, aplicar), 140);
    } else {
      comDesfazer(texto, aplicar);
    }
  }

  /* voce ve o dia devolvendo o tempo: e o unico recibo que importa */
  function piscarRecibo() {
    const livre = elTrilho.querySelector(".livre");
    if (!livre || semMovimento()) return;
    livre.classList.add("recibo");
    setTimeout(() => livre.classList.remove("recibo"), 180);
  }

  function reabrir(id) {
    const i = acharIndice(id);
    if (i < 0) return;
    estado.tarefas[i].feito = false;
    const [t] = estado.tarefas.splice(i, 1);
    estado.tarefas.unshift(t);
    salvar();
    render();
  }

  function excluir(id) {
    const i = acharIndice(id);
    if (i < 0) return;
    const titulo = estado.tarefas[i].titulo;
    comDesfazer("apaguei “" + curto(titulo) + "”", () => {
      /* re-busca o indice dentro da acao: entre capturar e aplicar, outra aba
         pode ter gravado e mexido na lista — com o indice velho, apagaria
         a linha errada. concluir() ja fazia assim. */
      const j = acharIndice(id);
      if (j < 0) return;
      estado.tarefas.splice(j, 1);
      salvar();
      render();
    });
  }

  /* editar duracao acontece na propria linha. prompt() era bloqueante, feio,
     nao existe em PWA no iOS — e o gesto mais frequente depois de criar. */
  function editarTempo(id) {
    const t = estado.tarefas[acharIndice(id)];
    if (!t) return;
    const li = elLista.querySelector(seletor(id));
    const botao = li && li.querySelector('[data-acao="tempo"]');
    if (!botao) return;

    const campo = document.createElement("input");
    campo.className = "sub-edit";
    campo.value = t.min ? formatar(t.min) : "";
    campo.setAttribute("aria-label", "Duração de " + t.titulo);
    campo.placeholder = "45m, 1h30";
    botao.replaceWith(campo);
    campo.focus();
    campo.select();

    let encerrado = false;
    const encerrar = (aplicar) => {
      if (encerrado) return;
      encerrado = true;
      const min = aplicar ? lerDuracao(" " + campo.value.trim() + " ").min : 0;
      /* so grava o que foi entendido: "45" sem unidade nao apaga a estimativa
         que ja existia, ao contrario do prompt() que ela substituia em silencio */
      if (aplicar && min && min !== t.min) {
        comDesfazer("duração de “" + curto(t.titulo) + "” era " + formatar(t.min), () => {
          const atual = estado.tarefas[acharIndice(id)];
          if (atual) atual.min = min;
          salvar();
          render();
        });
      } else {
        render();
      }
    };

    campo.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); encerrar(true); }
      else if (e.key === "Escape") { e.preventDefault(); encerrar(false); }
    });
    campo.addEventListener("blur", () => encerrar(true));
  }

  const curto = (s) => (s.length > 28 ? s.slice(0, 28) + "…" : s);

  /* usado pelo chip "outro": pergunta um tempo livre sem sair do fluxo */
  function pedirTempo(titulo, atual, aoResponder) {
    const r = prompt("Quanto tempo leva “" + titulo + "”? (ex: 45m, 1h30)", atual ? formatar(atual) : "");
    if (r === null) { aoResponder(0); return; }
    aoResponder(lerDuracao(" " + r.trim() + " ").min);
  }

  function renomear(id, valor) {
    const t = estado.tarefas[acharIndice(id)];
    if (!t) return;
    const limpo = valor.replace(/\s+/g, " ").trim();
    if (!limpo) { excluir(id); return; }
    if (limpo === t.titulo) return;
    t.titulo = limpo.slice(0, 300);
    salvar();
    /* redesenhar a lista roubaria o foco de quem digita: atualiza so o que depende do titulo */
    const li = elLista.querySelector(seletor(id));
    if (li) {
      const rotular = (acao, texto) => {
        const b = li.querySelector('[data-acao="' + acao + '"]');
        if (b) b.setAttribute("aria-label", texto + t.titulo);
      };
      rotular("concluir", "Concluir: ");
      rotular("excluir", "Excluir: ");
    }
    renderTempo();
  }

  function reordenar(idOrigem, idDestino) {
    const de = acharIndice(idOrigem), para = acharIndice(idDestino);
    if (de < 0 || para < 0 || de === para) return;
    const [t] = estado.tarefas.splice(de, 1);
    estado.tarefas.splice(para, 0, t);
    salvar();
    render();
  }

  function mover(id, passo) {
    const abertas = pendentes();
    const pos = abertas.findIndex((t) => t.id === id);
    const destino = pos + passo;
    if (pos < 0 || destino < 0 || destino >= abertas.length) return;
    reordenar(id, abertas[destino].id);
    const li = elLista.querySelector(seletor(id));
    if (li) li.focus();
  }

  /* ---------- composer ---------- */

  /* toda tarefa tem duracao. quando o texto nao traz uma, o Enter nao cria:
     ele pergunta. a tarefa so existe depois que o tempo dela existe. */
  const CHIPS = [15, 30, 60, 120];
  let pendenteDeTempo = null;
  let pendenteEhReserva = false;

  /* o que ocupa o dia sem ser trabalho seu. escrever "almoco 1h" nao deveria
     virar uma tarefa que voce conclui para ganhar tempo de volta que nunca
     esteve la — entao essas viram reserva, e o prefixo "-" forca qualquer uma. */
  const RESERVA = /^(?:-\s*|(?:almo[çc]o|caf[ée]|janta(?:r)?|reuni[ãa]o|call|daily|1:1|dentista|m[ée]dico|academia|deslocamento|transito|tr[âa]nsito)\b)/i;
  const ehReserva = (titulo) => RESERVA.test(titulo.trim());
  const semPrefixo = (titulo) => titulo.replace(/^-\s*/, "").trim();

  $("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const bruto = elCampo.value.replace(/\s+/g, " ").trim();
    if (!bruto) return;
    const { min, titulo } = lerDuracao(elCampo.value);
    const nome = titulo || bruto;
    const reserva = ehReserva(nome);
    if (min) { criarEfechar(semPrefixo(nome), min, reserva); return; }
    abrirChips(semPrefixo(nome), reserva);
  });

  function criarEfechar(titulo, min, reserva) {
    criar(titulo, min, reserva);
    elCampo.value = "";
    elFantasma.hidden = true;
    fecharChips();
    elCampo.focus();
  }

  function abrirChips(titulo, reserva) {
    pendenteDeTempo = titulo;
    pendenteEhReserva = !!reserva;
    elFantasma.hidden = true;
    $("chips-txt").innerHTML = "<b>" + escapar(titulo) + "</b> — " +
      (reserva ? "quanto tempo isso tira do dia?" : "quanto tempo isso leva?");

    const fila = $("chips-fila");
    fila.textContent = "";
    const c = contas();
    CHIPS.forEach((min) => {
      const b = document.createElement("button");
      b.className = "chip";
      b.type = "button";
      b.textContent = formatar(min);
      /* o chip que nao cabe hoje continua clicavel: a tela informa, nao proibe */
      b.dataset.cabe = min <= c.sobra ? "sim" : "nao";
      b.dataset.min = min;
      fila.appendChild(b);
    });
    const outro = document.createElement("button");
    outro.className = "chip outro";
    outro.type = "button";
    outro.dataset.min = "livre";
    outro.textContent = "outro";
    fila.appendChild(outro);

    elChips.hidden = false;
    const primeiro = fila.querySelector(".chip");
    if (primeiro) primeiro.focus();
  }

  function fecharChips() {
    elChips.hidden = true;
    pendenteDeTempo = null;
    pendenteEhReserva = false;
  }

  $("chips-fila").addEventListener("click", (e) => {
    const b = e.target.closest(".chip");
    if (!b || !pendenteDeTempo) return;
    const titulo = pendenteDeTempo, reserva = pendenteEhReserva;
    if (b.dataset.min === "livre") {
      elChips.hidden = true;
      pedirTempo(titulo, 0, (min) => {
        if (min) criarEfechar(titulo, min, reserva);
        else { elChips.hidden = false; }
      });
      return;
    }
    criarEfechar(titulo, +b.dataset.min, reserva);
  });

  /* setas andam entre os chips; Esc volta pro campo sem criar nada */
  $("chips-fila").addEventListener("keydown", (e) => {
    if (e.key === "Escape") { e.preventDefault(); fecharChips(); elCampo.focus(); return; }
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    e.preventDefault();
    const todos = [...$("chips-fila").querySelectorAll(".chip")];
    const i = todos.indexOf(e.target.closest(".chip"));
    if (i < 0) return;
    const proximo = todos[(i + (e.key === "ArrowRight" ? 1 : todos.length - 1)) % todos.length];
    if (proximo) proximo.focus();
  });

  /* previa fantasma: voce ve o que o parser entendeu antes de confirmar */
  function atualizarFantasma() {
    if (!elChips.hidden) return;
    const bruto = elCampo.value.replace(/\s+/g, " ").trim();
    if (!bruto) { elFantasma.hidden = true; return; }
    const { min, titulo } = lerDuracao(elCampo.value);
    const c = contas();
    const cabe = !min || min <= c.sobra;
    elFantasma.hidden = false;
    elFantasma.dataset.cabe = cabe ? "sim" : "nao";
    elFantasma.querySelector(".g-nome").textContent = titulo || bruto;
    /* numero no texto que o parser nao entendeu quase sempre e tempo mal escrito:
       dizer isso agora evita a tarefa muda que some da conta depois */
    elFantasma.querySelector(".g-tempo").textContent = min
      ? formatar(min) + (cabe ? "" : " · não cabe hoje")
      : (pareceTempoQuebrado(bruto, min) ? "não entendi o tempo · 45m, 1h30" : "o tempo vem a seguir");
  }
  elCampo.addEventListener("input", atualizarFantasma);
  elCampo.addEventListener("focus", atualizarFantasma);
  elCampo.addEventListener("blur", () => { elFantasma.hidden = true; });

  /* ---------- eventos da lista ---------- */

  elLista.addEventListener("click", (e) => {
    const botao = e.target.closest("[data-acao]");
    const li = e.target.closest(".tarefa");
    if (!botao || !li || botao.dataset.acao === "renomear") return;
    const id = li.dataset.id;
    if (botao.dataset.acao === "concluir") concluir(id);
    else if (botao.dataset.acao === "excluir") excluir(id);
    else if (botao.dataset.acao === "tempo") editarTempo(id);
  });

  elLista.addEventListener("change", (e) => {
    if (!e.target.dataset || e.target.dataset.acao !== "renomear") return;
    renomear(e.target.closest(".tarefa").dataset.id, e.target.value);
  });

  elLista.addEventListener("keydown", (e) => {
    const li = e.target.closest(".tarefa");
    if (!li) return;
    const id = li.dataset.id;
    const noNome = e.target.classList.contains("nome");

    if (e.altKey && (e.key === "ArrowUp" || e.key === "ArrowDown")) {
      e.preventDefault();
      /* o render de mover() destroi o input sem disparar change: salva a edicao antes */
      if (noNome) renomear(id, e.target.value);
      mover(id, e.key === "ArrowUp" ? -1 : 1);
      return;
    }

    if (noNome) {
      if (e.key === "Enter") { e.preventDefault(); e.target.blur(); li.focus(); }
      else if (e.key === "Escape") {
        const t = estado.tarefas[acharIndice(id)];
        if (t) e.target.value = t.titulo;
        e.target.blur();
        li.focus();
      }
      return;
    }

    /* os atalhos valem so na linha em si: dentro de um <button> eles roubariam
       a ativacao nativa e Enter concluiria a tarefa em vez de acionar o botao */
    if (e.target !== li) return;

    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); concluir(id); }
    else if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); excluir(id); }
  });

  /* arrastar para reordenar com pointer events: o drag do HTML5 nao dispara em toque,
     e este app abre no celular. a alca captura o ponteiro e a ordem do DOM vira a ordem do estado. */
  let arrasto = null;

  elLista.addEventListener("pointerdown", (e) => {
    const pega = e.target.closest(".pega");
    if (!pega || e.button > 0) return;
    const li = pega.closest(".tarefa");
    if (!li) return;
    e.preventDefault();
    arrasto = { li, y: e.clientY };
    li.classList.add("arrastando");
    pega.setPointerCapture(e.pointerId);
  });

  elLista.addEventListener("pointermove", (e) => {
    if (!arrasto) return;
    const li = arrasto.li;
    li.style.transform = "translateY(" + (e.clientY - arrasto.y) + "px)";
    const alvo = [...elLista.querySelectorAll(".tarefa")].find((n) => {
      if (n === li) return false;
      const r = n.getBoundingClientRect();
      return e.clientY >= r.top && e.clientY <= r.bottom;
    });
    if (!alvo) return;
    const r = alvo.getBoundingClientRect();
    elLista.insertBefore(li, e.clientY > r.top + r.height / 2 ? alvo.nextSibling : alvo);
    arrasto.y = e.clientY;
    li.style.transform = "translateY(0px)";
  });

  function soltarArrasto() {
    if (!arrasto) return;
    const li = arrasto.li;
    li.classList.remove("arrastando");
    li.style.transform = "";
    arrasto = null;
    const ordem = [...elLista.querySelectorAll(".tarefa")].map((n) => n.dataset.id);
    const mapa = new Map(estado.tarefas.map((t) => [t.id, t]));
    const vistos = new Set(ordem);
    estado.tarefas = ordem.map((id) => mapa.get(id)).filter(Boolean)
      .concat(estado.tarefas.filter((t) => !vistos.has(t.id)));
    salvar();
    render();
  }
  elLista.addEventListener("pointerup", soltarArrasto);
  elLista.addEventListener("pointercancel", soltarArrasto);

  /* com o foco na alca, as setas sozinhas ja reordenam (Alt+setas segue valendo na linha) */
  elLista.addEventListener("keydown", (e) => {
    if (e.altKey) return;
    const pega = e.target.closest(".pega");
    if (!pega || (e.key !== "ArrowUp" && e.key !== "ArrowDown")) return;
    e.preventDefault();
    const id = pega.closest(".tarefa").dataset.id;
    mover(id, e.key === "ArrowUp" ? -1 : 1);
    const volta = elLista.querySelector(seletor(id) + " .pega");
    if (volta) volta.focus();
  });

  elFeitas.addEventListener("click", (e) => {
    const b = e.target.closest('[data-acao="reabrir"]');
    if (b) reabrir(b.closest(".feita").dataset.id);
  });

  $("lista-reservas").addEventListener("click", (e) => {
    const b = e.target.closest('[data-acao="excluir"]');
    if (b) excluir(b.closest(".reserva").dataset.id);
  });

  $("alternar-feitas").addEventListener("click", () => {
    estado.feitasAbertas = !estado.feitasAbertas;
    salvar();
    renderFeitas();
  });

  $("limpar").addEventListener("click", () => {
    const n = feitas().length;
    if (!n) return;
    comDesfazer("removi " + n + (n === 1 ? " concluída" : " concluídas"), () => {
      estado.tarefas = pendentes();
      salvar();
      render();
    });
  });

  /* ---------- a fila de outro dia ---------- */

  /* trazer: as abertas passam a ser a fila de hoje, na mesma ordem. as
     concluidas de ontem saem — elas sao registro daquele dia, nao deste. */
  $("fo-trazer").addEventListener("click", () => {
    if (!atrasada()) return;
    const n = pendentes().length;
    comDesfazer(
      n ? "trouxe " + n + (n === 1 ? " tarefa" : " tarefas") + " pra hoje" : "dia começado",
      () => {
        estado.tarefas = pendentes();
        estado.dia = hoje();
        salvar();
        render();
      }
    );
  });

  /* fechar: o dia anterior acaba como ficou, aberto e tudo. comeca um dia limpo. */
  $("fo-fechar").addEventListener("click", () => {
    if (!atrasada()) return;
    const n = pendentes().length;
    comDesfazer(
      n ? "fechei o dia com " + n + (n === 1 ? " aberta" : " abertas") : "dia fechado",
      () => {
        estado.tarefas = [];
        estado.dia = hoje();
        salvar();
        render();
      }
    );
  });

  /* ---------- editor do dia ---------- */

  elJanela.addEventListener("click", () => {
    elInicio.value = relogio(estado.inicio);
    elFim.value = relogio(estado.fim);
    elEditorDia.hidden = false;
    elInicio.focus();
  });

  $("salvar-dia").addEventListener("click", () => {
    const ler = (v) => {
      const p = /^(\d{1,2}):(\d{2})$/.exec(v || "");
      return p ? (+p[1]) * 60 + (+p[2]) : null;
    };
    const i = ler(elInicio.value), f = ler(elFim.value);
    if (i !== null && f !== null && f > i) {
      estado.inicio = i;
      estado.fim = f;
      salvar();
      render();
    }
    elEditorDia.hidden = true;
    elJanela.focus();
  });

  elEditorDia.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { elEditorDia.hidden = true; elJanela.focus(); }
  });

  /* ---------- teclado global ---------- */

  document.addEventListener("keydown", (e) => {
    const alvo = document.activeElement;
    const digitando = alvo && /^(INPUT|TEXTAREA)$/.test(alvo.tagName);
    if (e.key === "/" && !digitando) { e.preventDefault(); elCampo.focus(); }
    else if (e.key === "Escape") {
      if (alvo === elCampo) elCampo.blur();
      else if (!elAviso.hidden) fecharAviso();
    }
  });

  /* ---------- a nuvem ----------
     o mesmo dia em qualquer navegador, inclusive celular e Safari. entra-se
     com um codigo de seis digitos que chega por e-mail: sem senha para
     decorar, sem conta para criar alem do proprio e-mail.

     o navegador continua sendo a fonte de verdade da sessao. a nuvem e
     camada de sincronia: se ela cair, o dia nao vai junto. */

  const API = "/api";
  let entrou = false;
  let timerSubir = null;
  let vDoServidor = 0;   /* maior carimbo que ja vi vindo de la */

  async function api(rota, opcoes) {
    const r = await fetch(API + rota, {
      credentials: "same-origin",
      headers: { "content-type": "application/json" },
      ...opcoes
    });
    const corpo = await r.json().catch(() => ({}));
    return { ok: r.ok, status: r.status, corpo };
  }

  /* sobe o dia atual. o servidor recusa se ele estiver na frente — e ai
     quem adota e o cliente, em vez dos dois discordarem em silencio. */
  async function subirDia() {
    if (!entrou) return;
    try {
      const r = await api("/dias", {
        method: "POST",
        body: JSON.stringify({ dia: estado.dia, v: estado.v, doc: estado })
      });
      if (r.ok) { vDoServidor = Math.max(vDoServidor, estado.v); marcarNuvem("ligada"); return; }
      if (r.status === 409 && r.corpo.servidor) { adotarDaNuvem(r.corpo.servidor); return; }
      if (r.status === 401) { entrou = false; marcarNuvem("fora"); return; }
      marcarNuvem("erro");
    } catch (e) {
      /* sem rede: o dia esta salvo aqui e sobe na proxima */
      marcarNuvem("offline");
    }
  }

  /* baixa o que mudou desde a ultima vez. so troca a tela se o dia de la for
     o mesmo dia daqui e estiver na frente — dia antigo do servidor nao
     sequestra a fila de hoje. */
  async function baixarDias() {
    if (!entrou) return;
    try {
      const r = await api("/dias?desde=" + vDoServidor, { method: "GET" });
      if (r.status === 401) { entrou = false; marcarNuvem("fora"); return; }
      if (!r.ok) { marcarNuvem("erro"); return; }

      const dias = r.corpo.dias || [];
      dias.forEach((d) => { vDoServidor = Math.max(vDoServidor, d.v); });
      const doDia = dias.filter((d) => d.dia === estado.dia).sort((a, b) => b.v - a.v)[0];
      if (doDia && doDia.v > estado.v) adotarDaNuvem(doDia);
      else marcarNuvem("ligada");
    } catch (e) { marcarNuvem("offline"); }
  }

  /* troca o documento inteiro pelo da nuvem, que esta na frente. nao e merge
     por tarefa: vale porque quem escreve e uma pessoa so, e quem gravou por
     ultimo teve o dia mais recente. */
  function adotarDaNuvem(deLa) {
    Object.assign(estado, carregarDe(deLa.doc));
    vDoServidor = Math.max(vDoServidor, deLa.v);
    try { localStorage.setItem(CHAVE, JSON.stringify(estado)); } catch (e) {}
    render();
    marcarNuvem("ligada");
    mostrarAviso("atualizei com o que veio do outro aparelho");
  }

  /* debounce: digitar tres tarefas seguidas e uma subida, nao tres */
  function agendarGravacao() {
    if (!entrou) return;
    clearTimeout(timerSubir);
    timerSubir = setTimeout(subirDia, 1500);
  }

  const DIZERES = {
    ligada:  ["sincronizado", ""],
    fora:    ["só neste navegador", "entrar"],
    offline: ["sem conexão — sobe depois", ""],
    erro:    ["não consegui sincronizar", "tentar de novo"]
  };

  function marcarNuvem(qual) {
    const [texto, acao] = DIZERES[qual] || DIZERES.fora;
    const el = $("nuvem-estado");
    el.textContent = texto;
    el.dataset.e = qual;
    const botao = $("nuvem-acao");
    botao.hidden = !acao;
    botao.textContent = acao;
    botao.dataset.para = qual;
    $("nuvem-sair").hidden = !entrou;
  }

  /* ---------- entrar ---------- */

  let emailPedido = "";

  function abrirEntrada() {
    $("entrada").hidden = false;
    $("entrada-email").hidden = false;
    $("entrada-codigo").hidden = true;
    $("entrada-recado").textContent = "";
    $("campo-email").value = "";
    $("campo-email").focus();
  }

  const fecharEntrada = () => { $("entrada").hidden = true; };

  $("nuvem-acao").addEventListener("click", (e) => {
    if (e.currentTarget.dataset.para === "erro") { subirDia(); return; }
    abrirEntrada();
  });
  $("entrada-fechar").addEventListener("click", fecharEntrada);

  $("form-email").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = $("campo-email").value.trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s.]+\.[^@\s]+$/.test(email)) {
      $("entrada-recado").textContent = "esse e-mail não parece certo";
      return;
    }
    $("entrada-recado").textContent = "mandando…";
    const r = await api("/codigo", { method: "POST", body: JSON.stringify({ email }) });
    if (!r.ok) {
      $("entrada-recado").textContent = r.corpo.erro || "não consegui mandar o código";
      return;
    }
    emailPedido = email;
    $("entrada-email").hidden = true;
    $("entrada-codigo").hidden = false;
    $("entrada-recado").textContent = "mandei um código de 6 dígitos para " + email;
    $("campo-codigo").value = "";
    $("campo-codigo").focus();
  });

  $("form-codigo").addEventListener("submit", async (e) => {
    e.preventDefault();
    const codigo = $("campo-codigo").value.replace(/\D/g, "");
    if (codigo.length !== 6) { $("entrada-recado").textContent = "o código tem 6 dígitos"; return; }
    $("entrada-recado").textContent = "conferindo…";
    const r = await api("/entrar", { method: "POST", body: JSON.stringify({ email: emailPedido, codigo }) });
    if (!r.ok) {
      $("entrada-recado").textContent = r.corpo.erro || "código inválido";
      return;
    }
    entrou = true;
    fecharEntrada();
    marcarNuvem("ligada");
    /* baixa antes de subir: o outro aparelho pode ter o dia mais novo */
    await baixarDias();
    await subirDia();
  });

  $("nuvem-sair").addEventListener("click", async () => {
    await api("/sair", { method: "POST" }).catch(() => {});
    entrou = false;
    vDoServidor = 0;
    marcarNuvem("fora");
    mostrarAviso("saí da conta — o dia continua neste navegador");
  });

  /* voltar pra aba e quando o outro aparelho pode ter gravado */
  document.addEventListener("visibilitychange", () => {
    if (!entrou) return;
    if (document.hidden) { clearTimeout(timerSubir); subirDia(); }
    else baixarDias();
  });

  async function retomarNuvem() {
    try {
      const r = await api("/eu", { method: "GET" });
      entrou = !!(r.ok && r.corpo.entrou);
    } catch (e) { entrou = false; }
    if (!entrou) { marcarNuvem("fora"); return; }
    marcarNuvem("ligada");
    await baixarDias();
  }

  /* ---------- o dia encolhendo ---------- */
  /* o tick nao tem transicao: tempo passando e um fato seco, nao um efeito.
     virar a meia-noite com a aba aberta muda a fila de categoria, e ai o
     redesenho tem que ser inteiro — a faixa e o corte dependem disso. */
  let diaDoUltimoTick = estado.dia;
  function tick() {
    if (atrasada() && diaDoUltimoTick !== hoje()) { diaDoUltimoTick = hoje(); render(); return; }
    renderTempo();
  }
  setInterval(tick, 30000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });

  render();
  /* nao bloqueia a primeira pintura: o dia aparece, o arquivo se conecta atras */
  retomarNuvem();
})();
</script>
</body>
</html>
