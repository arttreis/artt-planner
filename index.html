<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0d0d0d">
<title>artt · planner</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='13' y='4' width='6' height='24' rx='3' fill='%232EE86B'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ---------------------------------------------------------------
   design system arttreis.com.br — lado escuro dos tokens.
   copiado do :root do site; a unica adicao e --br3 (12px), um passo
   intermediario entre --br2 e --br para os ladrilhos de 44px.
   --------------------------------------------------------------- */
:root{
  --pd:16px; --pd2:8px; --pd3:4px;
  --br:16px; --br2:8px; --br3:12px; --br-pill:100px;

  --bg:#0d0d0d;
  --surface:#141414;
  --surface-2:#1b1b1b;

  --ink:#f2f2f2;
  --ink-70:rgba(242,242,242,.7);
  --ink-50:rgba(242,242,242,.5);
  --ink-30:rgba(242,242,242,.32);

  --line:rgba(242,242,242,.13);
  --line-soft:rgba(242,242,242,.07);
  --fill:rgba(242,242,242,.05);
  --fill-hover:rgba(242,242,242,.1);
  --scrim:rgba(13,13,13,.62);

  --green:#2EE86B;
  --green-glow:rgba(46,232,107,.3);
  --on-green:#0d0d0d;

  --sans:"Sora",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
  --t:220ms var(--ease);
}

*{box-sizing:border-box}
/* varias classes usam display:flex, que venceria o display:none do atributo hidden */
[hidden]{display:none !important}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-size:14px;line-height:1.35;
  letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;
  min-height:100dvh;
  display:grid;place-items:center;
  padding:clamp(24px,7vh,88px) clamp(12px,3vw,40px);
}

button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:var(--br2)}

/* rotulo mono, o .t-mono do sistema */
.t-mono{
  font-family:var(--mono);font-size:11px;font-weight:400;
  letter-spacing:.08em;text-transform:uppercase;
}

/* ---------- o aparelho ---------- */
.fone{
  position:relative;
  width:100%;max-width:496px;
  height:min(880px,calc(100dvh - clamp(48px,14vh,176px)));
  display:flex;flex-direction:column;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:calc(var(--br) * 1.75);
  overflow:hidden;
}

.topo{
  flex:0 0 auto;
  display:flex;justify-content:space-between;align-items:center;gap:var(--pd);
  padding:calc(var(--pd) * 1.25) calc(var(--pd) * 1.5) var(--pd3);
  color:var(--ink-30);
}
.janela{
  font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--ink-30);
  border-bottom:1px dashed var(--line);padding-bottom:1px;
  transition:color var(--t);
}
.janela:hover{color:var(--ink-70)}

/* a area que rola; a pilula fica parada no pe */
.rolagem{
  flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  padding:var(--pd) calc(var(--pd) * 1.5) var(--pd2);
  scrollbar-width:thin;scrollbar-color:var(--line) transparent;
}
.rolagem::-webkit-scrollbar{width:6px}
.rolagem::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}

.selo{
  width:52px;height:52px;border-radius:var(--br3);
  background:var(--fill);border:1px solid var(--line);
  display:grid;place-items:center;margin-bottom:calc(var(--pd) * 1.5);
}
.selo svg{width:23px;height:23px;color:var(--green)}

/* ---------- chamada ---------- */
.chamada{
  margin:0 0 var(--pd2);font-size:30px;font-weight:600;line-height:1.14;
  letter-spacing:-.038em;
}
.chamada .c1{display:block;color:var(--ink)}
.chamada .c2{display:block;color:var(--ink)}
/* se e medida, e mono — o .n do sistema */
.chamada .medida{
  font-family:var(--mono);font-weight:500;letter-spacing:-.03em;
  color:var(--green);
}
/* nao ha vermelho neste sistema: quando nao cabe, o verde simplesmente some */
.chamada[data-tom="estouro"] .medida{color:var(--ink)}
.contexto{margin:0 0 calc(var(--pd) * 1.25);font-size:13px;color:var(--ink-50);min-height:18px}

/* ---------- trilho do dia ---------- */
.trilho{
  display:flex;height:12px;border-radius:var(--br2);overflow:hidden;
  background:var(--bg);border:1px solid var(--line-soft);
}
.faixa{min-width:0;transition:background var(--t)}
.faixa+.faixa{box-shadow:inset 1px 0 0 var(--bg)}
.gasto{background:var(--bg)}
.banda{background:var(--fill-hover)}
.banda.destaque{background:var(--ink)}
.livre{background:var(--green);flex:1 1 auto}
.livre.recibo{background:var(--ink)}
.estouro{
  /* com estouro pequeno a barra vira um respingo de 3px e parece sujeira */
  height:6px;min-width:18px;margin-top:var(--pd3);border-radius:3px;
  background:repeating-linear-gradient(45deg,var(--ink-30) 0 3px,transparent 3px 6px);
}
.nota{
  display:block;margin-top:var(--pd2);text-align:right;
  color:var(--ink-30);min-height:15px;font-size:10px;
}
.editor-dia{
  display:flex;align-items:center;gap:var(--pd2);flex-wrap:wrap;margin-top:var(--pd2);
  font-family:var(--mono);font-size:11px;color:var(--ink-50);
}
.editor-dia input{
  background:var(--fill);border:1px solid var(--line);border-radius:var(--br2);
  padding:5px 8px;font-family:var(--mono);font-size:11px;color:var(--ink);
}
.editor-dia button{color:var(--green);text-decoration:underline;text-underline-offset:3px}

.rotulo{
  margin:calc(var(--pd) * 1.25) 0 var(--pd2);color:var(--ink-50);
  display:flex;justify-content:space-between;align-items:center;gap:var(--pd);
}
/* .pill do sistema */
.pill{
  display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 14px;
  font-size:12.5px;color:var(--ink-70);
  background:var(--fill);border:1px solid var(--line);border-radius:var(--br-pill);
  transition:background var(--t),color var(--t);
}
.pill:hover{background:var(--fill-hover);color:var(--ink)}
.pill svg{width:11px;height:11px;transition:transform var(--t)}

/* ---------- lista ---------- */
.lista{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--pd2)}
.tarefa{
  display:flex;align-items:center;gap:var(--pd);
  padding:10px 12px;border-radius:var(--br);
  background:var(--fill);border:1px solid var(--line-soft);
  transition:background var(--t),border-color var(--t),opacity var(--t),transform var(--t);
}
.tarefa:hover,.tarefa:focus-within{background:var(--fill-hover);border-color:var(--line)}
.tarefa.saindo{opacity:0;transform:translateX(12px)}
.tarefa.arrastando{
  position:relative;z-index:2;cursor:grabbing;
  background:var(--surface-2);border-color:var(--line);
  box-shadow:0 14px 30px rgba(0,0,0,.55);transition:none;
}

/* alca de arrastar: fica sempre visivel, senao ninguem descobre que da pra reordenar */
.pega{
  flex:0 0 auto;width:30px;height:30px;display:grid;place-items:center;
  border-radius:var(--br2);color:var(--ink-30);cursor:grab;
  touch-action:none;transition:color var(--t),background var(--t);
}
.pega:hover{color:var(--ink-70);background:var(--fill-hover)}
.pega svg{width:15px;height:15px}

/* o corte: daqui pra baixo nao da tempo hoje */
.corte{
  display:flex;align-items:center;gap:var(--pd2);
  margin:var(--pd2) 2px var(--pd3);color:var(--ink-30);
}
.corte::after{content:"";flex:1 1 auto;height:1px;background:var(--line)}
.tarefa[data-cabe="nao"]{opacity:.45}
.tarefa[data-cabe="nao"] .marca{border-style:dashed}

/* o ladrilho de icone e o proprio botao de concluir */
.marca{
  flex:0 0 auto;width:44px;height:44px;border-radius:var(--br3);
  background:var(--fill);border:1px solid var(--line);
  display:grid;place-items:center;color:var(--ink);
  transition:background var(--t),color var(--t),border-color var(--t);
}
.marca svg{width:18px;height:18px;opacity:.18;transition:opacity var(--t)}
.marca:hover{background:var(--green);border-color:var(--green);color:var(--on-green)}
.marca:hover svg,.tarefa:focus-within .marca svg{opacity:1}

.miolo{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.nome{
  font-size:14.5px;font-weight:500;color:var(--ink);letter-spacing:-.015em;
  background:none;border:0;outline:0;padding:0;width:100%;
  text-overflow:ellipsis;cursor:text;
}
.sub{
  align-self:flex-start;display:flex;align-items:center;gap:6px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;
  color:var(--ink-30);padding:1px 0;text-align:left;transition:color var(--t);
}
.sub:hover{color:var(--ink-70)}
.sub svg{width:11px;height:11px;flex:0 0 auto}

.acoes{flex:0 0 auto;display:flex;align-items:center;gap:2px;opacity:0;transition:opacity var(--t)}
.tarefa:hover .acoes,.tarefa:focus-within .acoes{opacity:1}
.acao{
  width:30px;height:30px;display:grid;place-items:center;border-radius:var(--br2);
  color:var(--ink-30);transition:color var(--t),background var(--t);
}
.acao:hover{color:var(--ink);background:var(--fill-hover)}
.acao svg{width:15px;height:15px}
/* prioridade em escala de tinta: este sistema nao tem uma segunda cor */
.ponto{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink-30)}
.tarefa[data-prio="1"] .ponto{border-color:var(--ink);background:var(--ink)}
.tarefa[data-prio="2"] .ponto{border-color:var(--ink-70);background:var(--ink-70)}
.tarefa[data-prio="3"] .ponto{border-color:var(--ink-30);background:var(--ink-30)}
.tarefa[data-prio="1"] .marca{border-color:var(--ink-70)}
.tarefa[data-prio="2"] .marca{border-color:var(--line)}

/* ---------- dia vazio ---------- */
.vazio{padding:var(--pd3) 0}
.vazio-sub{margin:0 0 var(--pd);font-size:13.5px;color:var(--ink-50)}
.exemplos{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--pd2)}
.exemplos li{
  display:flex;align-items:center;gap:var(--pd);
  padding:10px 12px;border-radius:var(--br);
  border:1px dashed var(--line);color:var(--ink-30);
}
.exemplos .e-marca{
  flex:0 0 auto;width:44px;height:44px;border-radius:var(--br3);
  border:1px dashed var(--line);
}
.exemplos .e-miolo{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.exemplos .e-nome{font-size:14.5px;font-weight:500;color:var(--ink-50)}
.exemplos .e-sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em}
.exemplos .e-sub b{font-weight:400;color:var(--green)}
.vazio-rodape{margin:var(--pd) 0 0;font-size:12.5px;color:var(--ink-30)}

/* ---------- concluidas ---------- */
.lista-feitas{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--pd3)}
.feitas[data-aberto="nao"] .lista-feitas{display:none}
.feitas[data-aberto="nao"] .pill svg{transform:rotate(-90deg)}
.feita{
  display:flex;align-items:center;gap:var(--pd);padding:6px 12px;border-radius:var(--br2);
  color:var(--ink-30);transition:background var(--t);
}
.feita:hover{background:var(--fill)}
.feita .marca{width:30px;height:30px;border-radius:var(--br2);color:var(--green);background:var(--fill)}
.feita .marca svg{width:13px;height:13px;opacity:1}
.feita .f-nome{
  flex:1 1 auto;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
  font-size:13.5px;text-decoration:line-through;text-decoration-color:var(--line);
}
.feita .f-tempo{flex:0 0 auto;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em}

/* ---------- pilula do composer ---------- */
.pilula-area{flex:0 0 auto;padding:var(--pd2) calc(var(--pd) * 1.25) calc(var(--pd) * 1.25)}
.fantasma{
  display:flex;align-items:center;gap:var(--pd2);
  margin:0 var(--pd3) var(--pd2);padding:9px 12px;
  border:1px dashed var(--line);border-radius:var(--br);color:var(--ink-30);
}
.fantasma .g-nome{flex:1 1 auto;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:13.5px}
.fantasma .g-tempo{flex:0 0 auto;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em}
.fantasma[data-cabe="nao"]{border-style:solid;border-color:var(--line);color:var(--ink-70)}

.pilula{
  display:flex;align-items:center;gap:var(--pd2);
  height:56px;padding:0 var(--pd2);
  background:var(--fill);border:1px solid var(--line);
  border-radius:var(--br-pill);transition:border-color var(--t),background var(--t);
}
.pilula:focus-within{border-color:var(--green-glow);background:var(--fill-hover)}
.mais{
  flex:0 0 auto;width:38px;height:38px;border-radius:50%;
  background:var(--fill-hover);border:1px solid var(--line);
  display:grid;place-items:center;color:var(--ink-50);
  transition:background var(--t),color var(--t),border-color var(--t);
}
.mais svg{width:16px;height:16px}
.pilula:focus-within .mais{background:var(--green);border-color:var(--green);color:var(--on-green)}
.pilula input{
  flex:1 1 auto;min-width:0;background:none;border:0;outline:0;
  font-size:14.5px;caret-color:var(--green);
}
.pilula input::placeholder{color:var(--ink-30)}
.enviar{
  flex:0 0 auto;width:38px;height:38px;border-radius:50%;
  display:grid;place-items:center;color:var(--ink-30);
  transition:color var(--t),background var(--t);
}
.enviar svg{width:16px;height:16px}
.enviar:hover{color:var(--ink);background:var(--fill-hover)}
.aviso-storage{margin:var(--pd2) 6px 0;font-size:11.5px;color:var(--ink-70)}

/* ---------- desfazer ---------- */
.aviso{
  position:absolute;left:var(--pd);right:var(--pd);bottom:86px;z-index:5;
  display:flex;align-items:center;justify-content:space-between;gap:var(--pd);
  padding:11px 14px;border-radius:var(--br);
  background:var(--surface-2);border:1px solid var(--line);
  font-size:13px;color:var(--ink);
  box-shadow:0 10px 30px rgba(0,0,0,.55);
}
.aviso span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aviso button{
  flex:0 0 auto;color:var(--green);font-size:12.5px;
  text-decoration:underline;text-underline-offset:3px;padding:var(--pd3) 2px;
}

/* no celular o aparelho vira a tela inteira */
@media (max-width:480px){
  body{padding:0}
  .fone{max-width:none;height:100dvh;border-radius:0;border:0}
  .topo{padding-top:max(18px,env(safe-area-inset-top))}
  .pilula-area{padding-bottom:max(var(--pd),env(safe-area-inset-bottom))}
  .chamada{font-size:27px}
  /* sem hover no toque, as acoes ficam sempre visiveis — entao elas precisam
     custar menos largura, senao comem o titulo */
  .acoes{opacity:1}
  .tarefa{gap:10px;padding:10px}
  .marca{width:40px;height:40px}
  .acao{width:28px;height:28px}
  .exemplos li{gap:10px;padding:10px}
  .exemplos .e-marca{width:40px;height:40px}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important;animation-duration:.01ms !important}
}
</style>
</head>
<body>

<main class="fone">

  <div class="topo">
    <span class="t-mono" id="data"></span>
    <button class="janela" id="janela" title="Mudar o começo e o fim do seu dia"></button>
  </div>

  <div class="rolagem">

    <div class="selo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M4 8h9M4 14h5M4 20h13"/><path d="M17 3.5v9"/>
      </svg>
    </div>

    <h1 class="chamada" id="chamada">
      <span class="c1" id="c1"></span>
      <span class="c2"><span class="medida" id="medida"></span> <span id="resto"></span></span>
    </h1>
    <p class="contexto" id="contexto"></p>

    <div class="trilho" id="trilho" aria-hidden="true"></div>
    <div class="estouro" id="estouro" hidden aria-hidden="true"></div>
    <span class="nota t-mono" id="nota"></span>
    <div class="editor-dia" id="editor-dia" hidden>
      <label>de <input type="time" id="inicio" step="300"></label>
      <label>até <input type="time" id="fim" step="300"></label>
      <button type="button" id="salvar-dia">salvar</button>
    </div>

    <p class="rotulo" id="rotulo-fila"><span class="t-mono" id="rotulo-texto"></span></p>

    <ul class="lista" id="lista"></ul>

    <div class="vazio" id="vazio" hidden>
      <p class="vazio-sub" id="vazio-sub"></p>
      <ul class="exemplos" id="exemplos" aria-hidden="true">
        <li>
          <span class="e-marca"></span>
          <span class="e-miolo">
            <span class="e-nome">fechar o relatório da Vibra</span>
            <span class="e-sub"><b>1h30</b></span>
          </span>
        </li>
        <li>
          <span class="e-marca"></span>
          <span class="e-miolo">
            <span class="e-nome">ligar pro contador</span>
            <span class="e-sub"><b>15m</b></span>
          </span>
        </li>
      </ul>
      <p class="vazio-rodape" id="vazio-rodape">Escreve assim, com a duração no fim: ela sai do título e entra na barra do dia.</p>
    </div>

    <section class="feitas" id="feitas" data-aberto="nao" hidden>
      <p class="rotulo">
        <button class="pill" id="alternar-feitas" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          <span id="feitas-rotulo"></span>
        </button>
        <button class="pill" id="limpar">limpar</button>
      </p>
      <ul class="lista-feitas" id="lista-feitas"></ul>
    </section>

  </div>

  <div class="pilula-area">
    <div class="fantasma" id="fantasma" hidden aria-hidden="true">
      <span class="g-nome"></span>
      <span class="g-tempo"></span>
    </div>
    <form class="pilula" id="form" autocomplete="off">
      <span class="mais" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </span>
      <input id="campo" placeholder="o que precisa caber?" aria-label="Nova tarefa">
      <button class="enviar" type="submit" aria-label="Adicionar tarefa">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M12 5l7 7-7 7"/></svg>
      </button>
    </form>
    <p class="aviso-storage" id="aviso-storage" hidden></p>
  </div>

  <div class="aviso" id="aviso" hidden role="status" aria-live="polite">
    <span id="aviso-texto"></span>
    <button type="button" id="aviso-desfazer">desfazer</button>
  </div>

</main>

<script>
(() => {
  "use strict";

  const CHAVE = "artt-planner:v2";
  const CHAVE_ANTIGA = "artt-planner:v1";
  const PRIOS = [0, 1, 2, 3];
  const NOME_PRIO = { 0: "sem prioridade", 1: "alta", 2: "média", 3: "baixa" };
  const DIA = 1440;

  /* prefixo por aba: duas abas abertas no mesmo milissegundo nao podem gerar o mesmo id */
  const SESSAO = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  let contador = 0;
  const proximoId = () => SESSAO + "-" + (++contador);

  /* ---------- estado ---------- */

  function normalizar(t) {
    return {
      id: t && t.id ? String(t.id) : proximoId(),
      titulo: String((t && t.titulo) || "").slice(0, 300),
      min: Number.isFinite(+(t && t.min)) && +t.min > 0 ? Math.min(Math.round(+t.min), DIA) : 0,
      prio: PRIOS.includes(+(t && t.prio)) ? +t.prio : 0,
      feito: !!(t && t.feito)
    };
  }

  const minutoValido = (v, padrao) =>
    Number.isFinite(+v) && +v >= 0 && +v <= DIA ? Math.round(+v) : padrao;

  function carregar() {
    const vazio = { tarefas: [], inicio: 540, fim: 1140, feitasAbertas: false };
    let bruto = null;
    try {
      bruto = JSON.parse(localStorage.getItem(CHAVE));
      if (!bruto) {
        /* migra do formato antigo, que guardava capacidade em vez de janela */
        const velho = JSON.parse(localStorage.getItem(CHAVE_ANTIGA));
        if (velho && Array.isArray(velho.tarefas)) {
          bruto = {
            tarefas: velho.tarefas,
            inicio: 540,
            fim: 540 + minutoValido(velho.capacidade, 600),
            feitasAbertas: !!velho.feitasAbertas
          };
        }
      }
    } catch (e) { /* storage bloqueado ou corrompido: comeca limpo */ }

    if (!bruto || !Array.isArray(bruto.tarefas)) return vazio;
    const inicio = minutoValido(bruto.inicio, 540);
    let fim = minutoValido(bruto.fim, 1140);
    if (fim <= inicio) fim = Math.min(inicio + 600, DIA);
    return {
      tarefas: bruto.tarefas.map(normalizar).filter((t) => t.titulo),
      inicio,
      fim,
      feitasAbertas: !!bruto.feitasAbertas
    };
  }

  const estado = carregar();
  let storageQuebrado = false;

  function salvar() {
    try { localStorage.setItem(CHAVE, JSON.stringify(estado)); }
    catch (e) {
      if (!storageQuebrado) {
        storageQuebrado = true;
        elAvisoStorage.hidden = false;
        elAvisoStorage.textContent = "não consegui salvar neste navegador — o que você fizer agora some ao fechar";
      }
    }
  }

  /* outra aba gravou: recarrega em vez de sobrescrever o trabalho dela */
  window.addEventListener("storage", (e) => {
    if (e.key !== CHAVE) return;
    Object.assign(estado, carregar());
    render();
  });

  /* ---------- tempo ---------- */

  function lerDuracao(texto) {
    /* minutos so contam colados na hora ("1h30") ou com unidade ("1h 30m"):
       senao "revisar 1h 20 slides" viraria 1h20 e comeria o "20" do titulo */
    const comHora = texto.match(/(?:^|\s)(\d{1,2})\s*h(?:(\d{1,2})|\s*(\d{1,2})\s*(?:m|min|mins))?(?=\s|$)/i);
    const m = comHora || texto.match(/(?:^|\s)(\d{1,3})\s*(?:m|min|mins)(?=\s|$)/i);
    if (!m) return { min: 0, titulo: texto.replace(/\s+/g, " ").trim() };
    const min = comHora ? (+m[1]) * 60 + (+(m[2] || m[3] || 0)) : +m[1];
    /* fatia pela posicao real do match: replace(string) apagaria a primeira
       ocorrencia literal, que pode nao ser a que casou */
    const limpo = texto.slice(0, m.index) + " " + texto.slice(m.index + m[0].length);
    return { min: Math.min(min, DIA), titulo: limpo.replace(/\s+/g, " ").trim() };
  }

  function formatar(min) {
    if (!min) return "—";
    const h = Math.floor(min / 60), m = min % 60;
    if (!h) return m + "m";
    if (!m) return h + "h";
    return h + "h" + String(m).padStart(2, "0");
  }

  function longo(min) {
    if (!min) return "0m";
    const h = Math.floor(min / 60), m = min % 60;
    return (h ? h + "h" : "") + (h && m ? " " : "") + (m ? m + "m" : "");
  }

  const relogio = (min) =>
    String(Math.floor(min / 60) % 24).padStart(2, "0") + ":" + String(Math.round(min) % 60).padStart(2, "0");

  const agoraMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
  const limitar = (v, a, b) => Math.max(a, Math.min(b, v));

  const pendentes = () => estado.tarefas.filter((t) => !t.feito);
  const feitas = () => estado.tarefas.filter((t) => t.feito);

  /* a conta inteira do produto, em minutos. nenhum pixel entra aqui. */
  function contas() {
    const janela = estado.fim - estado.inicio;
    const agora = agoraMin();
    const decorrido = limitar(agora - estado.inicio, 0, janela);
    const restante = janela - decorrido;
    const abertas = pendentes();
    const comprometido = abertas.reduce((s, t) => s + t.min, 0);
    return {
      janela, agora, decorrido, restante, abertas, comprometido,
      semEstimativa: abertas.filter((t) => !t.min).length,
      sobra: restante - comprometido,
      estouro: Math.max(0, comprometido - restante),
      horaExtra: agora > estado.fim
    };
  }

  /* onde cada tarefa cai dentro do dia, e a partir de qual delas nao da mais tempo.
     tarefa sem estimativa nao consome nem corta: ela so nao e mensuravel. */
  function distribuir() {
    const c = contas();
    const vagas = new Map();
    let cursor = c.decorrido;
    let corte = -1;
    c.abertas.forEach((t, i) => {
      if (!t.min) return;
      const disponivel = c.janela - cursor;
      if (disponivel <= 0) { if (corte < 0) corte = i; return; }
      const usar = Math.min(t.min, disponivel);
      const cortada = usar < t.min;
      if (cortada && corte < 0) corte = i;
      vagas.set(t.id, { de: cursor, min: usar, cortada });
      cursor += usar;
    });
    return { c, vagas, corte };
  }

  /* ---------- referencias ---------- */

  const $ = (id) => document.getElementById(id);
  const elLista = $("lista"), elFeitas = $("lista-feitas"), elVazio = $("vazio");
  const elTrilho = $("trilho"), elEstouro = $("estouro");
  const elC1 = $("c1"), elMedidaTxt = $("medida"), elResto = $("resto"), elChamada = $("chamada");
  const elContexto = $("contexto"), elNota = $("nota"), elJanela = $("janela");
  const elSecaoFeitas = $("feitas"), elRotuloFeitas = $("feitas-rotulo");
  const elRotuloFila = $("rotulo-fila"), elRotuloTexto = $("rotulo-texto");
  const elCampo = $("campo"), elFantasma = $("fantasma"), elAvisoStorage = $("aviso-storage");
  const elAviso = $("aviso"), elAvisoTexto = $("aviso-texto");
  const elEditorDia = $("editor-dia"), elInicio = $("inicio"), elFim = $("fim");
  const elVazioSub = $("vazio-sub"), elExemplos = $("exemplos"), elVazioRodape = $("vazio-rodape");

  const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5l5.5 5.5L20 6.5"/></svg>';
  const RELOGIO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/></svg>';
  const PEGA = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>';
  const LIXO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9.5 7V5h5v2M6.5 7l1 12.5h9L17.5 7"/></svg>';

  const semMovimento = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- render ---------- */

  function render() {
    const d = distribuir();
    renderChamada(d);
    renderTrilho(d);
    renderPendentes(d);
    renderFeitas();
  }

  /* so o que depende do relogio, para o tick nao roubar o foco de quem digita */
  function renderTempo() {
    const d = distribuir();
    renderChamada(d);
    renderTrilho(d);
    renderHorarios(d);
  }

  function renderChamada({ c }) {
    $("data").textContent = new Intl.DateTimeFormat("pt-BR", { weekday: "short", day: "2-digit", month: "short" })
      .format(new Date()).replace(/\./g, "").replace(",", " ·").toUpperCase();

    elJanela.textContent = relogio(estado.inicio) + " → " + relogio(estado.fim);
    elChamada.dataset.tom = "normal";

    const prontas = feitas().length;

    if (!c.abertas.length) {
      elC1.textContent = prontas ? "Tudo fechado." : "Dia limpo.";
      elMedidaTxt.textContent = formatar(Math.max(0, c.restante));
      elResto.textContent = c.horaExtra ? "— o dia já acabou" : (prontas ? "ainda de dia" : "pela frente");
      if (prontas) {
        const total = feitas().reduce((s, t) => s + t.min, 0);
        elContexto.textContent = prontas + (prontas === 1 ? " fechada" : " fechadas") +
          (total ? " · " + longo(total) + " de trabalho" : "");
      } else {
        elContexto.textContent = "o dia acaba às " + relogio(estado.fim) + ".";
      }
    } else if (c.horaExtra) {
      /* o dia acabou e ainda ha fila: isso e um fato, nao uma acusacao */
      elC1.textContent = "Seu dia acabou.";
      elMedidaTxt.textContent = formatar(c.agora - estado.fim);
      elResto.textContent = "de hora extra";
      elContexto.textContent = "terminou às " + relogio(estado.fim) + " · " +
        c.abertas.length + (c.abertas.length === 1 ? " ainda aberta" : " ainda abertas");
    } else if (c.sobra >= 0) {
      elC1.textContent = "Ainda cabem";
      elMedidaTxt.textContent = (c.semEstimativa ? "~" : "") + formatar(c.sobra);
      elResto.textContent = "no seu dia";
      elContexto.textContent = longo(c.comprometido) + " na fila · o dia acaba às " + relogio(estado.fim);
    } else {
      elChamada.dataset.tom = "estouro";
      elC1.textContent = "Não cabe.";
      elMedidaTxt.textContent = formatar(c.estouro);
      elResto.textContent = "além do que resta";
      elContexto.textContent = longo(c.comprometido) + " na fila para " + longo(c.restante) + " de dia. Algo tem que sair.";
    }

    elNota.textContent = c.semEstimativa ? c.semEstimativa + " sem estimativa" : "";
  }

  function renderTrilho({ c, vagas }) {
    elTrilho.textContent = "";

    const faixa = (classe, min) => {
      const el = document.createElement("div");
      el.className = "faixa " + classe;
      /* tudo e % da mesma janela: sem px fixo, sem gap, sem min-width — e por isso
         que o desenho nao pode divergir da conta */
      el.style.flex = "0 0 " + ((min / c.janela) * 100) + "%";
      el.style.minWidth = "0";
      return el;
    };

    if (c.decorrido > 0) elTrilho.appendChild(faixa("gasto", c.decorrido));

    c.abertas.forEach((t) => {
      const vaga = vagas.get(t.id);
      if (!vaga) return;
      const el = faixa("banda", vaga.min);
      el.dataset.id = t.id;
      el.title = t.titulo + " · " + formatar(t.min);
      elTrilho.appendChild(el);
    });

    if (c.comprometido < c.restante) {
      const livre = document.createElement("div");
      livre.className = "faixa livre";
      elTrilho.appendChild(livre);
    }

    elEstouro.hidden = c.estouro <= 0 || c.horaExtra;
    if (!elEstouro.hidden) elEstouro.style.width = Math.min(100, (c.estouro / c.janela) * 100) + "%";
  }

  /* o horario projetado nao cabe na linha: vive no title dela */
  function renderHorarios({ vagas }) {
    elLista.querySelectorAll(".tarefa").forEach((li) => {
      const vaga = vagas.get(li.dataset.id);
      if (!vaga) { li.removeAttribute("title"); return; }
      li.title = relogio(estado.inicio + vaga.de) + "–" + relogio(estado.inicio + vaga.de + vaga.min);
    });
  }

  function renderPendentes(d) {
    const corte = d.corte;
    const abertas = pendentes();
    /* a tela vazia cobre tambem o "tudo concluido": nunca sobra um buraco */
    elVazio.hidden = abertas.length > 0;
    elRotuloFila.hidden = abertas.length === 0;
    elRotuloTexto.textContent = abertas.length +
      (abertas.length === 1 ? " coisa na fila" : " coisas na fila");
    elLista.textContent = "";

    if (!abertas.length) {
      renderVazio(d);
      return;
    }

    abertas.forEach((t, i) => {
      /* a régua: daqui pra baixo o dia nao alcanca */
      if (corte >= 0 && i === corte) {
        const regua = document.createElement("li");
        regua.className = "corte";
        regua.innerHTML = '<span class="t-mono">daqui não dá tempo hoje</span>';
        elLista.appendChild(regua);
      }

      const li = document.createElement("li");
      li.className = "tarefa";
      li.dataset.id = t.id;
      li.dataset.prio = t.prio;
      if (corte >= 0 && i >= corte) li.dataset.cabe = "nao";
      li.tabIndex = 0;

      const marca = document.createElement("button");
      marca.className = "marca";
      marca.dataset.acao = "concluir";
      marca.innerHTML = CHECK;
      marca.setAttribute("aria-label", "Concluir: " + t.titulo);

      const nome = document.createElement("input");
      nome.className = "nome";
      nome.value = t.titulo;
      nome.dataset.acao = "renomear";
      nome.setAttribute("aria-label", "Título da tarefa");

      const sub = document.createElement("button");
      sub.className = "sub";
      sub.type = "button";
      sub.dataset.acao = "tempo";
      const vaga = d.vagas.get(t.id);
      const parcial = vaga && vaga.cortada ? " · só " + formatar(vaga.min) + " hoje" : "";
      sub.innerHTML = RELOGIO + "<span>" + (t.min ? formatar(t.min) : "sem duração") + parcial + "</span>";
      sub.setAttribute("aria-label", "Duração: " + (t.min ? longo(t.min) : "não definida") + ". Alterar");

      const miolo = document.createElement("div");
      miolo.className = "miolo";
      miolo.append(nome, sub);

      const prio = document.createElement("button");
      prio.className = "acao";
      prio.dataset.acao = "prio";
      prio.innerHTML = '<span class="ponto"></span>';
      prio.setAttribute("aria-label", "Prioridade " + NOME_PRIO[t.prio] + ". Alternar");

      const lixo = document.createElement("button");
      lixo.className = "acao";
      lixo.dataset.acao = "excluir";
      lixo.innerHTML = LIXO;
      lixo.setAttribute("aria-label", "Excluir: " + t.titulo);

      const acoes = document.createElement("div");
      acoes.className = "acoes";
      acoes.append(prio, lixo);

      const pega = document.createElement("button");
      pega.className = "pega";
      pega.type = "button";
      pega.innerHTML = PEGA;
      pega.setAttribute("aria-label", "Arrastar para reordenar: " + t.titulo);

      li.append(marca, miolo, acoes, pega);
      elLista.appendChild(li);
    });

    renderHorarios(d);
  }

  function renderVazio({ c }) {
    const estreia = estado.tarefas.length === 0;
    /* os exemplos ensinam a sintaxe e se autodestroem depois da primeira tarefa */
    elExemplos.hidden = !estreia;
    elVazioRodape.hidden = !estreia;

    if (c.horaExtra) {
      elVazioSub.textContent = "Passou das " + relogio(estado.fim) + " e não sobrou nada na fila.";
    } else if (!estreia) {
      elVazioSub.textContent = "Nada na fila. Dá pra puxar mais alguma coisa, ou parar por aqui.";
    } else {
      elVazioSub.textContent = "Escreve embaixo a primeira coisa que precisa caber hoje.";
    }
  }

  function renderFeitas() {
    const prontas = feitas();
    elSecaoFeitas.hidden = prontas.length === 0;
    elSecaoFeitas.dataset.aberto = estado.feitasAbertas ? "sim" : "nao";
    $("alternar-feitas").setAttribute("aria-expanded", String(!!estado.feitasAbertas));
    elRotuloFeitas.textContent = prontas.length + (prontas.length === 1 ? " concluída" : " concluídas");
    elFeitas.textContent = "";

    prontas.forEach((t) => {
      const li = document.createElement("li");
      li.className = "feita";
      li.dataset.id = t.id;

      const marca = document.createElement("button");
      marca.className = "marca";
      marca.dataset.acao = "reabrir";
      marca.innerHTML = CHECK;
      marca.setAttribute("aria-label", "Reabrir: " + t.titulo);

      const nome = document.createElement("span");
      nome.className = "f-nome";
      nome.textContent = t.titulo;

      const tempo = document.createElement("span");
      tempo.className = "f-tempo";
      tempo.textContent = formatar(t.min);

      li.append(marca, nome, tempo);
      elFeitas.appendChild(li);
    });
  }

  /* ---------- desfazer ---------- */

  let paraDesfazer = null;
  let timerAviso = null;

  function comDesfazer(texto, acao) {
    const antes = estado.tarefas.map((t) => ({ ...t }));
    acao();
    paraDesfazer = antes;
    elAvisoTexto.textContent = texto;
    elAviso.hidden = false;
    clearTimeout(timerAviso);
    timerAviso = setTimeout(fecharAviso, semMovimento() ? 9000 : 6000);
  }

  function fecharAviso() {
    elAviso.hidden = true;
    paraDesfazer = null;
    clearTimeout(timerAviso);
  }

  $("aviso-desfazer").addEventListener("click", () => {
    if (!paraDesfazer) return;
    estado.tarefas = paraDesfazer;
    fecharAviso();
    salvar();
    render();
  });

  /* ---------- acoes ---------- */

  const acharIndice = (id) => estado.tarefas.findIndex((t) => t.id === id);
  const seletor = (id) => '[data-id="' + (window.CSS && CSS.escape ? CSS.escape(id) : id) + '"]';

  function criar(texto) {
    const bruto = texto.replace(/\s+/g, " ").trim();
    if (!bruto) return;
    const { min, titulo } = lerDuracao(texto);
    /* "90m" sozinho nao sobra titulo: guarda o que foi digitado em vez de sumir em silencio */
    estado.tarefas.unshift({ id: proximoId(), titulo: (titulo || bruto).slice(0, 300), min, prio: 0, feito: false });
    salvar();
    render();
  }

  function concluir(id) {
    const i = acharIndice(id);
    if (i < 0 || estado.tarefas[i].feito) return;
    const t = estado.tarefas[i];
    const aplicar = () => {
      const j = acharIndice(id);
      if (j < 0) return;
      estado.tarefas[j].feito = true;
      const [x] = estado.tarefas.splice(j, 1);
      estado.tarefas.push(x);
      salvar();
      render();
      piscarRecibo();
    };
    const texto = t.min ? "+" + longo(t.min) + " de volta pro dia" : "feita.";
    const li = elLista.querySelector(seletor(id));
    if (li && !semMovimento()) {
      li.classList.add("saindo");
      setTimeout(() => comDesfazer(texto, aplicar), 140);
    } else {
      comDesfazer(texto, aplicar);
    }
  }

  /* voce ve o dia devolvendo o tempo: e o unico recibo que importa */
  function piscarRecibo() {
    const livre = elTrilho.querySelector(".livre");
    if (!livre || semMovimento()) return;
    livre.classList.add("recibo");
    setTimeout(() => livre.classList.remove("recibo"), 180);
  }

  function reabrir(id) {
    const i = acharIndice(id);
    if (i < 0) return;
    estado.tarefas[i].feito = false;
    const [t] = estado.tarefas.splice(i, 1);
    estado.tarefas.unshift(t);
    salvar();
    render();
  }

  function excluir(id) {
    const i = acharIndice(id);
    if (i < 0) return;
    const titulo = estado.tarefas[i].titulo;
    comDesfazer("apaguei “" + (titulo.length > 28 ? titulo.slice(0, 28) + "…" : titulo) + "”", () => {
      estado.tarefas.splice(i, 1);
      salvar();
      render();
    });
  }

  function ciclarPrioridade(id) {
    const t = estado.tarefas[acharIndice(id)];
    if (!t) return;
    t.prio = (t.prio + 1) % 4;
    salvar();
    render();
    const botao = elLista.querySelector(seletor(id) + ' [data-acao="prio"]');
    if (botao) botao.focus();
  }

  function editarTempo(id) {
    const t = estado.tarefas[acharIndice(id)];
    if (!t) return;
    const r = prompt("Quanto tempo isso leva? (ex: 45m, 1h30 — vazio remove)", t.min ? formatar(t.min) : "");
    if (r === null) return;
    t.min = lerDuracao(" " + r.trim() + " ").min;
    salvar();
    render();
  }

  function renomear(id, valor) {
    const t = estado.tarefas[acharIndice(id)];
    if (!t) return;
    const limpo = valor.replace(/\s+/g, " ").trim();
    if (!limpo) { excluir(id); return; }
    if (limpo === t.titulo) return;
    t.titulo = limpo.slice(0, 300);
    salvar();
    /* redesenhar a lista roubaria o foco de quem digita: atualiza so o que depende do titulo */
    const li = elLista.querySelector(seletor(id));
    if (li) {
      const rotular = (acao, texto) => {
        const b = li.querySelector('[data-acao="' + acao + '"]');
        if (b) b.setAttribute("aria-label", texto + t.titulo);
      };
      rotular("concluir", "Concluir: ");
      rotular("excluir", "Excluir: ");
    }
    renderTempo();
  }

  function reordenar(idOrigem, idDestino) {
    const de = acharIndice(idOrigem), para = acharIndice(idDestino);
    if (de < 0 || para < 0 || de === para) return;
    const [t] = estado.tarefas.splice(de, 1);
    estado.tarefas.splice(para, 0, t);
    salvar();
    render();
  }

  function mover(id, passo) {
    const abertas = pendentes();
    const pos = abertas.findIndex((t) => t.id === id);
    const destino = pos + passo;
    if (pos < 0 || destino < 0 || destino >= abertas.length) return;
    reordenar(id, abertas[destino].id);
    const li = elLista.querySelector(seletor(id));
    if (li) li.focus();
  }

  /* ---------- composer ---------- */

  $("form").addEventListener("submit", (e) => {
    e.preventDefault();
    criar(elCampo.value);
    elCampo.value = "";
    elFantasma.hidden = true;
    elCampo.focus();
  });

  /* previa fantasma: voce ve o que o parser entendeu antes de confirmar */
  function atualizarFantasma() {
    const bruto = elCampo.value.replace(/\s+/g, " ").trim();
    if (!bruto) { elFantasma.hidden = true; return; }
    const { min, titulo } = lerDuracao(elCampo.value);
    const c = contas();
    const cabe = !min || min <= c.sobra;
    elFantasma.hidden = false;
    elFantasma.dataset.cabe = cabe ? "sim" : "nao";
    elFantasma.querySelector(".g-nome").textContent = titulo || bruto;
    elFantasma.querySelector(".g-tempo").textContent =
      (min ? formatar(min) : "sem duração") + (cabe ? "" : " · não cabe hoje");
  }
  elCampo.addEventListener("input", atualizarFantasma);
  elCampo.addEventListener("focus", atualizarFantasma);
  elCampo.addEventListener("blur", () => { elFantasma.hidden = true; });

  /* ---------- eventos da lista ---------- */

  elLista.addEventListener("click", (e) => {
    const botao = e.target.closest("[data-acao]");
    const li = e.target.closest(".tarefa");
    if (!botao || !li || botao.dataset.acao === "renomear") return;
    const id = li.dataset.id;
    if (botao.dataset.acao === "concluir") concluir(id);
    else if (botao.dataset.acao === "excluir") excluir(id);
    else if (botao.dataset.acao === "prio") ciclarPrioridade(id);
    else if (botao.dataset.acao === "tempo") editarTempo(id);
  });

  elLista.addEventListener("change", (e) => {
    if (!e.target.dataset || e.target.dataset.acao !== "renomear") return;
    renomear(e.target.closest(".tarefa").dataset.id, e.target.value);
  });

  elLista.addEventListener("keydown", (e) => {
    const li = e.target.closest(".tarefa");
    if (!li) return;
    const id = li.dataset.id;
    const noNome = e.target.classList.contains("nome");

    if (e.altKey && (e.key === "ArrowUp" || e.key === "ArrowDown")) {
      e.preventDefault();
      /* o render de mover() destroi o input sem disparar change: salva a edicao antes */
      if (noNome) renomear(id, e.target.value);
      mover(id, e.key === "ArrowUp" ? -1 : 1);
      return;
    }

    if (noNome) {
      if (e.key === "Enter") { e.preventDefault(); e.target.blur(); li.focus(); }
      else if (e.key === "Escape") {
        const t = estado.tarefas[acharIndice(id)];
        if (t) e.target.value = t.titulo;
        e.target.blur();
        li.focus();
      }
      return;
    }

    /* os atalhos valem so na linha em si: dentro de um <button> eles roubariam
       a ativacao nativa e Enter concluiria a tarefa em vez de acionar o botao */
    if (e.target !== li) return;

    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); concluir(id); }
    else if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); excluir(id); }
  });

  /* arrastar para reordenar com pointer events: o drag do HTML5 nao dispara em toque,
     e este app abre no celular. a alca captura o ponteiro e a ordem do DOM vira a ordem do estado. */
  let arrasto = null;

  elLista.addEventListener("pointerdown", (e) => {
    const pega = e.target.closest(".pega");
    if (!pega || e.button > 0) return;
    const li = pega.closest(".tarefa");
    if (!li) return;
    e.preventDefault();
    arrasto = { li, y: e.clientY };
    li.classList.add("arrastando");
    pega.setPointerCapture(e.pointerId);
  });

  elLista.addEventListener("pointermove", (e) => {
    if (!arrasto) return;
    const li = arrasto.li;
    li.style.transform = "translateY(" + (e.clientY - arrasto.y) + "px)";
    const alvo = [...elLista.querySelectorAll(".tarefa")].find((n) => {
      if (n === li) return false;
      const r = n.getBoundingClientRect();
      return e.clientY >= r.top && e.clientY <= r.bottom;
    });
    if (!alvo) return;
    const r = alvo.getBoundingClientRect();
    elLista.insertBefore(li, e.clientY > r.top + r.height / 2 ? alvo.nextSibling : alvo);
    arrasto.y = e.clientY;
    li.style.transform = "translateY(0px)";
  });

  function soltarArrasto() {
    if (!arrasto) return;
    const li = arrasto.li;
    li.classList.remove("arrastando");
    li.style.transform = "";
    arrasto = null;
    const ordem = [...elLista.querySelectorAll(".tarefa")].map((n) => n.dataset.id);
    const mapa = new Map(estado.tarefas.map((t) => [t.id, t]));
    const vistos = new Set(ordem);
    estado.tarefas = ordem.map((id) => mapa.get(id)).filter(Boolean)
      .concat(estado.tarefas.filter((t) => !vistos.has(t.id)));
    salvar();
    render();
  }
  elLista.addEventListener("pointerup", soltarArrasto);
  elLista.addEventListener("pointercancel", soltarArrasto);

  /* com o foco na alca, as setas sozinhas ja reordenam (Alt+setas segue valendo na linha) */
  elLista.addEventListener("keydown", (e) => {
    if (e.altKey) return;
    const pega = e.target.closest(".pega");
    if (!pega || (e.key !== "ArrowUp" && e.key !== "ArrowDown")) return;
    e.preventDefault();
    const id = pega.closest(".tarefa").dataset.id;
    mover(id, e.key === "ArrowUp" ? -1 : 1);
    const volta = elLista.querySelector(seletor(id) + " .pega");
    if (volta) volta.focus();
  });

  elFeitas.addEventListener("click", (e) => {
    const b = e.target.closest('[data-acao="reabrir"]');
    if (b) reabrir(b.closest(".feita").dataset.id);
  });

  $("alternar-feitas").addEventListener("click", () => {
    estado.feitasAbertas = !estado.feitasAbertas;
    salvar();
    renderFeitas();
  });

  $("limpar").addEventListener("click", () => {
    const n = feitas().length;
    if (!n) return;
    comDesfazer("removi " + n + (n === 1 ? " concluída" : " concluídas"), () => {
      estado.tarefas = pendentes();
      salvar();
      render();
    });
  });

  /* ---------- editor do dia ---------- */

  elJanela.addEventListener("click", () => {
    elInicio.value = relogio(estado.inicio);
    elFim.value = relogio(estado.fim);
    elEditorDia.hidden = false;
    elInicio.focus();
  });

  $("salvar-dia").addEventListener("click", () => {
    const ler = (v) => {
      const p = /^(\d{1,2}):(\d{2})$/.exec(v || "");
      return p ? (+p[1]) * 60 + (+p[2]) : null;
    };
    const i = ler(elInicio.value), f = ler(elFim.value);
    if (i !== null && f !== null && f > i) {
      estado.inicio = i;
      estado.fim = f;
      salvar();
      render();
    }
    elEditorDia.hidden = true;
    elJanela.focus();
  });

  elEditorDia.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { elEditorDia.hidden = true; elJanela.focus(); }
  });

  /* ---------- teclado global ---------- */

  document.addEventListener("keydown", (e) => {
    const alvo = document.activeElement;
    const digitando = alvo && /^(INPUT|TEXTAREA)$/.test(alvo.tagName);
    if (e.key === "/" && !digitando) { e.preventDefault(); elCampo.focus(); }
    else if (e.key === "Escape") {
      if (alvo === elCampo) elCampo.blur();
      else if (!elAviso.hidden) fecharAviso();
    }
  });

  /* ---------- o dia encolhendo ---------- */
  /* o tick nao tem transicao: tempo passando e um fato seco, nao um efeito */
  setInterval(renderTempo, 30000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) renderTempo(); });

  render();
})();
</script>
</body>
</html>
