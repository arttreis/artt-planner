<script>/* anti-flash do tema: antes de qualquer pintura */

<style>
/* ---------- faixa "ficou de tras" ----------
   nao e erro nem alarme, e um fato com duas saidas: por isso a mesma tinta
   neutra que o resto do sistema usa para isso, sem vermelho. */
.behind{
  display:flex;align-items:center;justify-content:space-between;gap:var(--pd);flex-wrap:wrap;
  margin:0 0 var(--pd);padding:12px var(--pd);
  background:var(--surface);border:1px solid var(--line);border-radius:var(--br3);
}
.behind__text{margin:0;font-size:13px;color:var(--ink-70)}
.behind__text b{color:var(--ink);font-weight:600}
.behind__actions{display:flex;gap:var(--pd2);flex-wrap:wrap}

/* ---------- o quadro ----------
   rola por dentro do proprio wrapper: e assim que o body nunca ganha uma
   barra horizontal, no celular ou com a janela estreita. */
.board-scroll{overflow-x:auto;overflow-y:hidden;padding-bottom:6px;margin:0 -2px}
.board{display:flex;align-items:flex-start;gap:var(--pd2);padding:0 2px}
.day-column{
  flex:0 0 230px;width:230px;
  display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--br3);
  transition:border-color var(--t),background var(--t);
}
/* a partir daqui as seis colunas cabem sem cortar: vira grade que preenche a
   largura inteira, e o rolar horizontal do celular/notebook estreito some. */
@media (min-width:1100px){
  .board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
  .day-column{flex:none;width:auto}
}
/* hoje se destaca por borda, nao por cor de fundo: o quadro inteiro continua
   sendo lido de relance, e o dia certo salta so um pouco */
.day-column.is-today{border-color:var(--ink-30)}
.day-column.is-target{border-color:var(--green);background:var(--fill)}
/* o cabecalho da coluna tem o nome do dia, os minutos abertos e o "+" que
   abre a caixa de novo cartao ja naquele dia — nenhum campo solto embaixo */
.day-column__head{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;padding:10px 8px 8px 12px;border-bottom:1px solid var(--line-soft)}
.day-column__day{margin:0;font-size:13px;font-weight:600;letter-spacing:-.01em;color:var(--ink)}
.day-column.is-today .day-column__day{color:var(--green-ink)}
.day-column__min{margin:2px 0 0}
.day-column__add{width:24px;height:24px;flex:0 0 auto}
.day-column__add svg{width:14px;height:14px}
.day-column__body{flex:1 1 auto;min-height:60px;padding:8px;display:flex;flex-direction:column;gap:10px}

.group{display:flex;flex-direction:column;gap:4px;min-width:0}
.group__label{margin:0}
.group__list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;min-height:6px}

/* ---------- cartao ---------- */
.card{
  display:flex;align-items:center;gap:6px;min-width:0;
  padding:6px 7px;border-radius:var(--br2);
  background:var(--fill);border:1px solid var(--line-soft);
  cursor:grab;transition:background var(--t),border-color var(--t),opacity var(--t);
}
.card:hover,.card:focus-within{background:var(--fill-hover)}
.card.is-dragging{opacity:.4}
.card.is-done{cursor:default}
.card__check{flex:0 0 auto;width:14px;height:14px;accent-color:var(--green);cursor:pointer}
.card__title{
  flex:1 1 auto;min-width:0;font-size:12.5px;color:var(--ink);cursor:text;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal;
}
.card.is-done .card__title{color:var(--ink-30);text-decoration:line-through}
.card__title-input{
  flex:1 1 auto;min-width:0;background:var(--fill-hover);
  border:1px solid var(--green-glow);border-radius:4px;padding:1px 5px;
  font-size:12.5px;color:var(--ink);
}
.card .badge{height:17px;padding:0 6px;font-size:9px}
.card__min{flex:0 0 auto;font-size:10.5px;color:var(--ink-30)}
.card__recurring{flex:0 0 auto;display:flex;color:var(--ink-30)}
.card__recurring svg{width:11px;height:11px}
/* as acoes so existem no hover: fora dele nao ocupam largura, senao o
   titulo perde espaco numa coluna que ja e estreita */
.card{position:relative}
.card__actions{position:absolute;right:4px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:0;opacity:0;pointer-events:none;background:var(--surface-2);border-radius:var(--br2);padding:0 2px;transition:opacity var(--t)}
.card:hover .card__actions,.card:focus-within .card__actions{opacity:1;pointer-events:auto}
.card__actions .action{width:22px;height:22px}
.card__actions .action svg{width:12px;height:12px}
@media (hover:none){.card__actions{opacity:1;pointer-events:auto;position:static;transform:none;background:none}}

/* ---------- botao e dialogo do merlin ---------- */
.merlin-btn__icon{display:flex;width:13px;height:13px;color:var(--green-ink)}
.merlin-btn__icon svg{width:100%;height:100%}
#merlin-btn:disabled{opacity:.6;cursor:default}
.merlin-body{font-size:13px;line-height:1.55;color:var(--ink-70);max-height:52vh;overflow-y:auto}
.merlin-body p{margin:0 0 10px}
.merlin-body ul,.merlin-body ol{margin:0 0 10px;padding-left:20px}
.merlin-body h3,.merlin-body h4,.merlin-body h5{margin:14px 0 6px;color:var(--ink);font-size:13.5px}
.merlin-body code{font-family:var(--mono);font-size:12px;background:var(--fill);padding:1px 5px;border-radius:4px}

@media (max-width:640px){
  .day-column{flex-basis:78vw;width:78vw}
}
</style>
</head>
<body>
<main class="page page--wide" id="app"></main>
<script type="module">
import {
  initPage, newId, today, isDay, notify, sendToDay, api,
  parseMentions, formatMin, parseDuration, mondayOf, addDays, dateLabel, dateOf
} from "./shared/core.js";
import {
  html, mount, useState, useEffect, useLayoutEffect, useRef, useCollection, useFronts, useClients, useKeydown, isTyping,
  useFields, Form, Field, Dialog, Markdown, FrontBadge, ClientBadge, frontOptionList, clientOptionList, icon, svg
} from "./shared/ui.js";

initPage("week");

/* o cartao da semana: day e 'YYYY-MM-DD' (seg-sex) ou 'weekend:YYYY-MM-DD'
   (a segunda daquela semana), para o fim de semana caber numa coluna so. */
const WEEKEND = "weekend:";
const isValidDay = (v) => isDay(v) || (typeof v === "string" && v.startsWith(WEEKEND) && isDay(v.slice(WEEKEND.length)));
function normalize(d) {
  return {
    id: d.id,
    title: String(d.title || "").slice(0, 200),
    day: isValidDay(d.day) ? d.day : today(),
    front: d.front || "",
    client: d.client || "",
    min: Math.max(0, Math.round(+d.min || 0)),
    done: !!d.done,
    recurring: !!d.recurring,
    order: Number.isFinite(+d.order) ? +d.order : 0,
    createdAt: +d.createdAt || Date.now(),
    updatedAt: +d.updatedAt || +d.createdAt || Date.now(),
    /* id do cartao original, so nas copias que a recorrencia gera — impede
       uma copia de virar, ela mesma, uma nova origem que se copia sozinha */
    recurringSource: d.recurringSource || "",
    /* quem escreve isto e o index.html: e o id da tarefa que ele criou a
       partir deste cartao. aqui so lemos — nunca gravamos este campo. */
    inDay: d.inDay || "",
    /* de onde o cartao veio (um objetivo dos planos, por exemplo). so passa
       adiante: quem le e a pagina de origem. */
    origin: d.origin && typeof d.origin === "object" ? { type: String(d.origin.type || ""), id: String(d.origin.id || "") } : null
  };
}

/* icones que nao moram no core por serem exclusivos deste quadro */
const RECURRING_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 00-14.9-4M4 13a8 8 0 0014.9 4"/><path d="M4 4v4h4M20 20v-4h-4"/></svg>';
const SPARK_ICON = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l1.9 6.1L20 10l-6.1 1.9L12 18l-1.9-6.1L4 10l6.1-1.9L12 2z"/></svg>';

const COLUMNS = [
  { id: "mon", offset: 0, label: "seg" },
  { id: "tue", offset: 1, label: "ter" },
  { id: "wed", offset: 2, label: "qua" },
  { id: "thu", offset: 3, label: "qui" },
  { id: "fri", offset: 4, label: "sex" },
  { id: "weekend", offset: null, label: "sáb · dom" }
];

/* ---------- datas ---------- */

const mondayOfCard = (c) => c.day.startsWith(WEEKEND) ? c.day.slice(WEEKEND.length) : mondayOf(c.day);
const columnDay = (monday, col) => col.offset == null ? WEEKEND + monday : addDays(monday, col.offset);
const dayNumber = (day) => dateOf(day).getDate();
const daysBetween = (monday, day) => Math.round((dateOf(day) - dateOf(monday)) / 86400000);

function columnIsToday(monday, col) {
  const t = today();
  if (col.offset != null) return columnDay(monday, col) === t;
  const sat = addDays(monday, 5), sun = addDays(monday, 6);
  return t === sat || t === sun;
}

/* "8–14 set" quando cabe no mesmo mes; "29 ago–4 set" quando vira o mes */
function weekRange(monday) {
  const end = addDays(monday, 6);
  if (dateOf(monday).getMonth() === dateOf(end).getMonth()) return dayNumber(monday) + "–" + dateLabel(end);
  return dateLabel(monday) + "–" + dateLabel(end);
}

/* coluna de "hoje": o proprio dia se for de semana, o fds da semana atual
   se hoje cair em sabado ou domingo */
function todayColumn() {
  const t = today();
  const dow = dateOf(t).getDay();
  return (dow === 0 || dow === 6) ? (WEEKEND + mondayOf(t)) : t;
}

/* today / late / future — e disso que depende se "puxar para o dia" faz
   sentido e se o cartao entra na faixa de quem ficou de tras */
function cardStatus(c) {
  const t = today();
  if (c.day.startsWith(WEEKEND)) {
    const monday = c.day.slice(WEEKEND.length), sat = addDays(monday, 5), sun = addDays(monday, 6);
    if (t === sat || t === sun) return "today";
    return t > sun ? "late" : "future";
  }
  if (c.day === t) return "today";
  return c.day < t ? "late" : "future";
}

/* ---------- "@frente"/"@cliente" e duracao no fim do texto ----------
   parseMentions e do core: reconhece os dois arrobas de uma vez, comparando
   sem acento/espaco/caixa com nome e id. so a duracao fica por nossa conta,
   porque ela precisa rodar DEPOIS de tirar os arrobas do texto. */
function parseLine(raw) {
  const found = parseMentions(raw);
  const { min, title } = parseDuration(found.title);
  return { title: title.trim(), min, front: found.front || "", client: found.client || "" };
}
/* o rotulo da coluna: nome do dia e numero ("seg 7"); no fim de semana, os
   dois nomes e os dois numeros ("sáb · dom 12–13") */
function columnLabel(monday, col) {
  if (col.id !== "weekend") return col.label + " " + dayNumber(columnDay(monday, col));
  return col.label + " " + dayNumber(addDays(monday, 5)) + "–" + dayNumber(addDays(monday, 6));
}

/* ---------- ordenacao dentro do grupo: aberto por ordem, feito no fim ---------- */
function sortGroup(list) {
  const open = list.filter((c) => !c.done).sort((a, b) => a.order - b.order || a.createdAt - b.createdAt);
  const done = list.filter((c) => c.done).sort((a, b) => a.updatedAt - b.updatedAt);
  return open.concat(done);
}

/* ---------- recorrencia ----------
   so a origem (sem recurringSource) espalha copia; a copia carrega
   recurringSource e nunca vira uma nova origem. so acontece em semana atual
   ou futura — reabrir uma semana passada nao inventa tarefa nela. */
function spawnRecurring(week, monday) {
  if (monday < mondayOf(today())) return;
  const all = week.all();
  const inWeek = all.filter((c) => mondayOfCard(c) === monday);
  const exists = (title, front) => inWeek.some((c) => c.title === title && (c.front || "") === (front || ""));
  const fresh = [];
  all.forEach((t) => {
    if (!t.recurring || t.recurringSource) return;
    const sourceMonday = mondayOfCard(t);
    if (sourceMonday === monday) return;
    if (exists(t.title, t.front)) return;
    const onWeekend = t.day.startsWith(WEEKEND);
    const day = onWeekend ? (WEEKEND + monday) : addDays(monday, daysBetween(sourceMonday, t.day));
    const now = Date.now();
    const copy = {
      id: newId(), title: t.title, day, front: t.front, client: t.client,
      min: t.min, done: false, recurring: true, order: now,
      createdAt: now, updatedAt: now, recurringSource: t.id
    };
    fresh.push(copy);
    inWeek.push(copy); // impede duas origens de gerarem duas copias iguais na mesma passada
  });
  if (fresh.length) week.saveMany(fresh);
}

/* ---------- a pagina ----------
   o estado de tela mora aqui: a semana aberta, a caixa de cartao, o resumo
   do merlin, qual titulo esta em edicao e qual coluna esta sob o arrasto.
   nada disso e documento — some ao recarregar, como deve. */
function Week() {
  const week = useCollection("week", { normalize });
  const fronts = useFronts();
  useClients();
  const [monday, setMonday] = useState(() => mondayOf(today()));
  const [form, setForm] = useState(null);         // { id, day } | null
  const [summary, setSummary] = useState(null);   // texto do merlin | null
  const [thinking, setThinking] = useState(false);
  const [editing, setEditing] = useState(null);
  const [target, setTarget] = useState("");       // dia da coluna sob o arrasto
  const [dragging, setDragging] = useState(null);
  const dragId = useRef(null);

  /* uma vez por semana aberta */
  useEffect(() => { spawnRecurring(week, monday); }, [week, monday]);

  const isCurrentWeek = monday === mondayOf(today());
  const all = week.all();
  const inWeek = all.filter((c) => mondayOfCard(c) === monday);
  const late = isCurrentWeek ? all.filter((c) => !c.done && mondayOfCard(c) < monday) : [];

  /* ---------- acoes ---------- */
  const shiftWeek = (n) => setMonday((m) => addDays(m, n * 7));
  const openNew = (day) => setForm({ id: "", day: day || (isCurrentWeek ? todayColumn() : monday) });
  const toggleDone = (c, value) => week.save({ ...c, done: value, updatedAt: Date.now() });
  const removeCard = (id) => {
    const before = week.remove(id);
    if (before) notify("cartão apagado", () => week.save(before));
  };
  const pull = (c) => sendToDay({ title: c.title, min: c.min, front: c.front, client: c.client, origin: { type: "week", id: c.id } });
  const bringLate = () => {
    if (!late.length) return;
    const before = late.map((c) => ({ ...c }));
    const day = todayColumn();
    week.saveMany(late.map((c) => ({ ...c, day, updatedAt: Date.now() })));
    notify(late.length + (late.length === 1 ? " cartão trazido" : " cartões trazidos") + " para esta semana", () => week.saveMany(before));
  };
  const archiveLate = () => {
    if (!late.length) return;
    const before = late.map((c) => ({ ...c }));
    week.saveMany(late.map((c) => ({ ...c, done: true, updatedAt: Date.now() })));
    notify(late.length + (late.length === 1 ? " cartão arquivado" : " cartões arquivados"), () => week.saveMany(before));
  };

  /* ---------- resumir com o merlin ----------
     o contexto e so texto: uma linha por cartao, na mesma ordem que a leitura
     humana usaria. quem entende disso e o worker; aqui a unica preocupacao e
     nao mandar a semana errada quando o usuario trocou de semana no meio. */
  const summaryLine = (c) => {
    const col = COLUMNS.find((col) => columnDay(monday, col) === c.day);
    const colLabel = col ? columnLabel(monday, col) : c.day;
    const front = c.front ? fronts.find((f) => f.id === c.front) : null;
    const parts = [colLabel];
    if (front) parts.push(front.name);
    parts.push(c.title);
    if (c.min) parts.push(formatMin(c.min));
    if (c.done) parts.push("feito");
    return parts.join(" · ");
  };
  const askSummary = async () => {
    if (thinking) return;
    setThinking(true);
    try {
      const r = await api("/merlin", { method: "POST", body: JSON.stringify({ task: "week", context: { range: weekRange(monday), cards: inWeek.map(summaryLine) } }) });
      if (r.ok) setSummary(r.body.text || "");
      else if (r.status === 401) notify("entre para usar o Merlin");
      else notify(r.body.error || "não consegui falar com o Merlin");
    } catch (e) {
      notify("não consegui falar com o Merlin");
    } finally { setThinking(false); }
  };

  /* ---------- atalhos: n abre um cartao novo, Alt+seta troca de semana ----------
     Esc e dos dialogos, que se fecham sozinhos. */
  useKeydown((e) => {
    if (form || summary != null) return;
    if (e.key === "n" && !isTyping() && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); openNew(); return; }
    if (e.altKey && (e.key === "ArrowLeft" || e.key === "ArrowRight")) { e.preventDefault(); shiftWeek(e.key === "ArrowLeft" ? -1 : 1); }
  });

  /* ---------- arrastar e soltar nativo ----------
     solto na hora exata de largar: muda dia e frente, e se for solto perto de
     um cartao especifico, entra antes/depois dele (ordem fracionaria, sem
     precisar reindexar o grupo inteiro). no toque isso nao dispara — e o
     dialogo de editar, com o seletor de dia, que resolve por la. */
  const onDragStart = (e, c) => {
    if (e.target.tagName === "INPUT") { e.preventDefault(); return; }
    dragId.current = c.id;
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", c.id);
    /* a classe entra depois do quadro, senao a imagem arrastada ja nasce apagada */
    requestAnimationFrame(() => setDragging(c.id));
  };
  const onDragEnd = () => { dragId.current = null; setDragging(null); setTarget(""); };
  const onDrop = (e, day) => {
    e.preventDefault();
    setTarget("");
    const original = dragId.current && week.get(dragId.current);
    dragId.current = null;
    if (!original) return;
    const groupEl = e.target.closest(".group");
    const front = groupEl ? groupEl.dataset.front : (original.front || "");
    const targetCard = e.target.closest(".card");

    const siblings = week.all()
      .filter((c) => c.day === day && (c.front || "") === (front || "") && c.id !== original.id && !c.done)
      .sort((a, b) => a.order - b.order || a.createdAt - b.createdAt);

    let order;
    if (targetCard && targetCard.dataset.id !== original.id) {
      const idx = siblings.findIndex((c) => c.id === targetCard.dataset.id);
      const r = targetCard.getBoundingClientRect();
      const before = e.clientY < r.top + r.height / 2;
      const pos = idx < 0 ? siblings.length : (before ? idx : idx + 1);
      const prev = siblings[pos - 1], next = siblings[pos];
      order = prev && next ? (prev.order + next.order) / 2
        : prev ? prev.order + 1
        : next ? next.order - 1
        : 0;
    } else {
      order = siblings.length ? siblings[siblings.length - 1].order + 1 : Date.now();
    }
    week.save({ ...original, day, front, order, updatedAt: Date.now() });
  };

  const actions = { toggleDone, removeCard, pull, edit: (id) => setForm({ id }), editing, setEditing, week, dragging, onDragStart, onDragEnd };

  return html`
    <div class="header">
      <div>
        <h1>semana</h1>
        <p class="sub">${weekRange(monday)}</p>
      </div>
      <div class="actions">
        <button class="pill" type="button" onClick=${() => shiftWeek(-1)}>‹ semana anterior</button>
        <button class="pill" type="button" onClick=${() => setMonday(mondayOf(today()))}>hoje</button>
        <button class="pill" type="button" id="merlin-btn" disabled=${thinking} onClick=${askSummary}>
          <span class="merlin-btn__icon" aria-hidden="true">${svg(SPARK_ICON)}</span>
          <span>${thinking ? "pensando…" : "resumir com o merlin"}</span>
        </button>
        <button class="pill" type="button" onClick=${() => shiftWeek(1)}>próxima ›</button>
        <button class="pill pill--green" type="button" title="novo cartão (n)" onClick=${() => openNew()}>${icon("plus")}cartão</button>
      </div>
    </div>

    ${late.length > 0 && html`
      <div class="behind">
        <p class="behind__text"><b>${late.length}</b> ${late.length === 1 ? "cartão ficou" : "cartões ficaram"} de trás</p>
        <div class="behind__actions">
          <button class="pill" type="button" onClick=${bringLate}>trazer para esta semana</button>
          <button class="pill" type="button" onClick=${archiveLate}>arquivar</button>
        </div>
      </div>`}

    ${!inWeek.length && html`<p class="empty">Semana em branco. O "+" de cada dia abre um cartão novo.</p>`}

    <div class="board-scroll">
      <div class="board">
        ${COLUMNS.map((col) => {
          const day = columnDay(monday, col);
          return html`<${Column} key=${day} day=${day} label=${columnLabel(monday, col)} isToday=${columnIsToday(monday, col)}
            isTarget=${target === day} fronts=${fronts} cards=${inWeek.filter((c) => c.day === day)}
            onNew=${() => openNew(day)} onEnter=${() => setTarget(day)} onLeave=${() => setTarget("")} onDrop=${(e) => onDrop(e, day)} actions=${actions}/>`;
        })}
      </div>
    </div>

    ${form && html`<${CardForm} week=${week} monday=${monday} id=${form.id} presetDay=${form.day} onClose=${() => setForm(null)} onRemove=${removeCard}/>`}
    ${summary != null && html`<${MerlinDialog} text=${summary} onClose=${() => setSummary(null)}/>`}`;
}

/* ---------- a coluna: cabecalho com o dia, os minutos abertos e o "+" ---------- */
function Column({ day, label, isToday, isTarget, fronts, cards, onNew, onEnter, onLeave, onDrop, actions }) {
  const openMin = cards.filter((c) => !c.done).reduce((s, c) => s + c.min, 0);
  const groups = fronts
    .map((f) => ({ id: f.id, cards: cards.filter((c) => c.front === f.id) }))
    .filter((g) => g.cards.length);
  const noFront = cards.filter((c) => !c.front || !fronts.some((f) => f.id === c.front));
  if (noFront.length) groups.push({ id: "", cards: noFront });

  return html`
    <section class=${"day-column" + (isToday ? " is-today" : "") + (isTarget ? " is-target" : "")}>
      <header class="day-column__head">
        <div>
          <p class="day-column__day">${label}</p>
          <p class="day-column__min t-mono t-mute">${openMin ? formatMin(openMin) : "—"}</p>
        </div>
        <button class="action day-column__add" type="button" title=${"novo cartão em " + label} aria-label=${"Novo cartão em " + label} onClick=${onNew}>${icon("plus")}</button>
      </header>
      <div class="day-column__body" data-day=${day}
           onDragOver=${(e) => { e.preventDefault(); e.dataTransfer.dropEffect = "move"; }}
           onDragEnter=${onEnter}
           onDragLeave=${(e) => { if (!e.currentTarget.contains(e.relatedTarget)) onLeave(); }}
           onDrop=${onDrop}>
        ${groups.map((g) => html`
          <div key=${g.id} class="group" data-front=${g.id}>
            <p class="group__label">${g.id ? html`<${FrontBadge} id=${g.id}/>` : html`<span class="t-mono t-mute">sem frente</span>`}</p>
            <ul class="group__list">
              ${sortGroup(g.cards).map((c) => html`<${Card} key=${c.id} c=${c} actions=${actions}/>`)}
            </ul>
          </div>`)}
      </div>
    </section>`;
}

/* ---------- o cartao ---------- */
function Card({ c, actions }) {
  const status = cardStatus(c);
  /* com inDay o cartao ja esta na fila de hoje — o dia e quem escreveu isso,
     entao "puxar" (que manda pra la de novo) deixa de fazer sentido aqui */
  const canPull = !c.done && !c.inDay && (status === "today" || status === "late");
  return html`
    <li class=${"card" + (c.done ? " is-done" : "") + (actions.dragging === c.id ? " is-dragging" : "")} draggable="true" data-id=${c.id}
        onDragStart=${(e) => actions.onDragStart(e, c)} onDragEnd=${actions.onDragEnd}>
      <input type="checkbox" class="card__check" checked=${c.done} aria-label=${"Concluir " + c.title} onChange=${(e) => actions.toggleDone(c, e.currentTarget.checked)}/>
      ${actions.editing === c.id
        ? html`<${EditableTitle} c=${c} week=${actions.week} onClose=${() => actions.setEditing(null)}/>`
        : html`<span class="card__title" tabindex="0" onClick=${() => actions.setEditing(c.id)}>${c.title}</span>`}
      ${c.inDay && html`<span class="badge badge--green">no dia</span>`}
      <${ClientBadge} id=${c.client}/>
      ${c.min > 0 && html`<span class="card__min mono">${formatMin(c.min)}</span>`}
      ${c.recurring && html`<span class="card__recurring" title="toda semana">${svg(RECURRING_ICON)}</span>`}
      <span class="card__actions">
        ${canPull && html`<button class="action" type="button" title="puxar para o dia" onClick=${() => actions.pull(c)}>${icon("arrow")}</button>`}
        <button class="action" type="button" title="editar" onClick=${() => actions.edit(c.id)}>${icon("pencil")}</button>
        <button class="action" type="button" title="apagar" onClick=${() => actions.removeCard(c.id)}>${icon("trash")}</button>
      </span>
    </li>`;
}

/* ---------- edicao inline do titulo ----------
   Enter e blur salvam; Esc cancela. o `closed` evita que o blur que o
   navegador dispara ao tirar o input da tela salve uma segunda vez. */
function EditableTitle({ c, week, onClose }) {
  const ref = useRef(null);
  const closed = useRef(false);
  const [value, setValue] = useState(c.title);
  /* antes da pintura: quem clicou ja esta com o dedo no teclado */
  useLayoutEffect(() => { ref.current.focus(); ref.current.select(); }, []);
  const save = () => {
    if (closed.current) return;
    closed.current = true;
    const t = value.trim();
    if (t && t !== c.title) week.save({ ...c, title: t.slice(0, 200), updatedAt: Date.now() });
    onClose();
  };
  const cancel = () => { if (closed.current) return; closed.current = true; onClose(); };
  return html`<input ref=${ref} class="input card__title-input" value=${value} maxlength="200"
    onInput=${(e) => setValue(e.currentTarget.value)} onBlur=${save}
    onKeyDown=${(e) => { if (e.key === "Enter") { e.preventDefault(); save(); } else if (e.key === "Escape") { e.preventDefault(); cancel(); } }}/>`;
}

/* ---------- a caixa do cartao: criar e editar sao a mesma ----------
   no titulo, "@frente" e a duracao no fim continuam valendo — e a mesma
   gramatica do dia — mas os campos ao lado ganham quando preenchidos. */
function CardForm({ week, monday, id, presetDay, onClose, onRemove }) {
  const c = id ? week.get(id) : null;
  const [v, bind, set] = useFields({
    title: c ? c.title : "",
    day: c ? c.day : (presetDay || todayColumn()),
    duration: c && c.min ? formatMin(c.min) : "",
    front: c ? c.front : "",
    client: c ? c.client : "",
    recurring: !!(c && c.recurring)
  });
  if (id && !c) return null;
  const submit = () => {
    const parsed = parseLine(v.title);
    const title = parsed.title.slice(0, 200);
    if (!title) { notify("o cartão precisa de um título"); return false; }
    const min = parseDuration(v.duration).min || parsed.min;
    const front = v.front || parsed.front, client = v.client || parsed.client;
    const now = Date.now();
    if (c) week.save({ ...c, title, day: v.day, front, client, min, recurring: v.recurring, updatedAt: now });
    else week.save({ id: newId(), title, day: v.day, front, client, min, done: false, recurring: v.recurring, order: now, createdAt: now, updatedAt: now });
  };
  return html`
    <${Form} title=${c ? "cartão" : "novo cartão"} submit=${c ? "salvar" : "adicionar"} remove=${c ? "apagar" : ""}
        onRemove=${() => onRemove(id)} onClose=${onClose} onSubmit=${submit}>
      <${Field} label="título" full>
        <input class="input" maxlength="200" required placeholder="o que fazer · @frente · 45m" ...${bind("title")}/>
      <//>
      <${Field} label="dia">
        <select class="select" ...${bind("day")}>
          ${COLUMNS.map((col) => { const d = columnDay(monday, col); return html`<option key=${d} value=${d}>${columnLabel(monday, col)}</option>`; })}
        </select>
      <//>
      <${Field} label="duração"><input class="input input--mono" placeholder="45m, 1h30" ...${bind("duration")}/><//>
      <${Field} label="frente">
        <select class="select" ...${bind("front")} onChange=${(e) => { set("front", e.currentTarget.value); set("client", ""); }}>${frontOptionList("sem frente")}</select>
      <//>
      <${Field} label="cliente"><select class="select" ...${bind("client")}>${clientOptionList("sem cliente", v.front || undefined)}</select><//>
      <label class="row full"><input type="checkbox" ...${bind("recurring", "check")}/> toda semana</label>
    <//>`;
}

/* ---------- o resumo do merlin ---------- */
function MerlinDialog({ text, onClose }) {
  const copy = async () => {
    try { await navigator.clipboard.writeText(text); notify("copiado"); }
    catch (e) { notify("não consegui copiar"); }
  };
  return html`
    <${Dialog} title="o merlin resume a semana" wide onClose=${onClose}
        actions=${html`<button class="pill" type="button" onClick=${copy}>copiar</button><button class="pill pill--green" type="button" onClick=${onClose}>fechar</button>`}>
      <${Markdown} class="merlin-body" text=${text}/>
    <//>`;
}

mount(html`<${Week}/>`, "app");
</script>
</body>
